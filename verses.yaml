  - id: crisis.rom.8.38
    ref: 로마서 8:38-39
    text: >
      내가 확신하노니 사망이나 생명이나 천사들이나 권세자들이나 현재 일이나
      장래 일이나 능력이나 높음이나 깊음이나 다른 아무 피조물이라도 우리를
      우리 주 그리스도 예수 안에 있는 하나님의 사랑에서 끊을 수 없으리라
    theme: crisis_fixed
    note: >
      "무엇도 끊을 수 없으리라" — 열거 구조가 예외 없음을 표현한다.
      위기 상태에서 "나는 예외일 것"이라는 생각에 대한 응답.
      감정 풀 rom.8.38(sadness.lonely)과 본문 공유.
    verified: true
    verified_by: verify_verses.py(krv1961@bluesaurel/Korean-Bible-1961-KRV#65cdce8)
    verified_at: "2026-08-18"

  # ── 부르짖어도 된다 — 도움 요청의 정당화 ────────────────

  - id: crisis.psa.130.1
    ref: 시편 130:1-2
    text: >
      여호와여 내가 깊은데서 주께 부르짖었나이다 주여 내 소리를 들으시며 나의
      간구하는 소리에 귀를 기울이소서
    theme: crisis_fixed
    note: >
      "깊은데서 주께 부르짖었나이다" — 바닥에서 소리를 내는 것이 성경 안에
      있다는 것 자체가 메시지다. 도움을 청해도 된다는 방향이라 상담 안내와
      결이 맞는다. 1절만 쓰면 간구가 없어 2절과 묶는다.
    verified: true
    verified_by: verify_verses.py(krv1961@bluesaurel/Korean-Bible-1961-KRV#65cdce8)
