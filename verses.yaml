  - id: exo.14.14
    ref: 출애굽기 14:14
    text: >
      여호와께서 너희를 위하여 싸우시리니 너희는 가만히 있을지니라
    emotion_tags: [anxiety.tension]
    theme: trust
    note: >
      2026-08-19 추가. 이 화면은 courage가 10/13이었고 그중 넷이 "두려워 말라"
      명령형이다(사 41:10 · 수 1:9 · 신 31:8 · 사 43:1). 긴장한 사람에게 같은
      명령을 네 번 반복하는 셈이라 축을 넓혔다.
      긴장의 핵심은 "내가 다 해내야 한다"는 압박이고, 이 구절은 그 부담의
      주체를 옮긴다. "가만히 있을지니라"도 명령형이지만 **하지 말라가 아니라
      안 해도 된다**는 면제라 결이 다르다. 33자로 짧다.
      앞 14:13이 "두려워 말고 가만히 서서 …구원을 보라"로 이어지고 책망이 없다.
      ⚠ restless의 시 46:10("가만히 있어")과 이미지가 겹쳐 그쪽에 두지 않았다.
      [제외 기록] 이 슬롯에서 검토하고 뺀 구절 —
        빌 4:13  "내가 모든 것을 할 수 있느니라". 짧고 자연스러워 후보로
                 올랐으나 **exhaustion.listless에서 이미 같은 이유로 제외된
                 구절이다**(verses.yaml psa.40.1-2 note · HANDOFF 2.5).
                 거기서는 "아무것도 할 수 없는 상태에서 읽으면 자신의 현재가
                 반증으로 보인다"였고, 여기서는 **"잘 해내야 한다"는 압박으로
                 도착한다** — 긴장의 원인이 그 부담인데 앱이 한 번 더 얹는다.
                 themes.yaml strength intent가 이 구절을 직접 지목하지만,
                 주제의 intent는 방향을 정하는 것이고 개별 구절 채택은 별개다.
                 **다시 후보로 올리지 말 것.**
        대하 20:15 "이 전쟁이 너희에게 속한 것이 아니요" 부분은 맞으나 116자에
                 인명 서두("야하시엘이 가로되 온 유다와 …여호사밧왕이여")가 붙어
                 화면에 맞지 않는다.

    verified: true
    verified_by: verify_verses.py(krv1961@bluesaurel/Korean-Bible-1961-KRV#65cdce8)
    verified_at: "2026-08-19"
