  - id: crisis.isa.43.1
    ref: 이사야 43:1
    text: >
      야곱아 너를 창조하신 여호와께서 이제 말씀하시느니라 이스라엘아 너를
      조성하신 자가 이제 말씀하시느니라 너는 두려워 말라 내가 너를 구속하였고
