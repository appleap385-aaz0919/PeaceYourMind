      감사하옴은 나를 지으심이 신묘막측하심이라 주의 행사가 기이함을 내 영혼이
      잘 아나이다
    theme: crisis_fixed
    note: >
      "나를 조직하셨나이다 ... 신묘막측하심이라" — 존재가 우연이 아니라는
      진술. 위기 상태에서 가장 먼저 흔들리는 것이 존재의 근거라 이 구절을
      맨 앞에 둔다. 13절만 쓰면 감탄이 없어 14절과 묶는다.
    verified: true
    verified_by: verify_verses.py(krv1961@bluesaurel/Korean-Bible-1961-KRV#65cdce8)
