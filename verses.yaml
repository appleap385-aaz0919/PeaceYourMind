    emotion_tags: [boredom.novelty]
    theme: bible_story
    note: >
      갈멜산 장면. 47자로 짧고 극적이다.
      [경계 메모] 극적인 장면이라 themes.yaml 태깅 금지어 "기적" 계열
      콘텐츠와 인접해 보인다. 다만 금지어는 영상 제목 태깅에 대한 것이고
      구절 본문에는 적용되지 않으며, 이 구절은 신유·집회가 아니라 성경 서사다.
      영상은 bible_story 키워드(성경 인물·강해 등)로만 수집되므로 경로가 분리돼 있다.
      1ki.19.7(exhaustion.burnout, 로뎀나무)의 바로 앞 사건이기도 하다.
    verified: true
    verified_by: verify_verses.py(krv1961@bluesaurel/Korean-Bible-1961-KRV#65cdce8)
    verified_at: "2026-08-18"

