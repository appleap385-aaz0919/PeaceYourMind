  # ═══════════════════════════════════════════════════════════
  # calm.stable (안정감) — 주제: quiet_worship, daily_word
  # 방향: 안정을 유지하라고 요구하지 않는다. 흔들림을 실패로 만들지 않는
  #      정의를 앞세운다 — psa.37.23 "넘어지나 아주 엎드러지지 아니함은".
  #
  # [주제 배분이 기운 이유] quiet_worship 8 / daily_word 2.
  #   안정감은 새 읽을거리를 찾는 상태가 아니라 조용히 유지되는 상태라
  #   daily_word(가벼운 진입점) 성격의 구절이 자연스럽게 적다.
  #   억지로 맞추지 않았다. 영상 풀은 확정 규칙 2에 따라 세분류의 mapping
  #   주제를 그대로 쓰므로 이 편중이 영상 노출에는 영향을 주지 않는다.
  #
  # [착수 경위] 4차분 대상 8개 세분류에서 빠져 있던 세분류다.
  #   1차분 psa.4.8 교차 태깅으로 1건이 있었는데, 그것을 "이미 있다"로
  #   처리하면서 목록에서 누락됐다. 24개 세분류 중 유일하게 10건 미만이던
  #   것이 최종 집계에서 드러나 보강했다.
