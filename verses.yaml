      하나님이여 내가 주께 영영히 감사하리이다
    emotion_tags: [joy.grateful]
    theme: joy_praise
    note: >
      "잠잠치 아니하고" — 침묵의 반대편에 감사를 놓는다.
      psa.30.11(loss, "슬픔을 변하여 춤이 되게")의 다음 절이라, 상실에서
