# =====================================================================
# [2차분 요약 — 2026-08-18]
#
#   sadness.sorrow 10 / sadness.lonely 10 / sadness.loss 10
#   exhaustion.burnout 10 / exhaustion.tired 10 / exhaustion.listless 10
#   = 60구절. 누적 90구절.
#
# [본문 오류 0건]
#   1차분은 30건 중 8건(27%)이 본문 오류였다. 2차분은 60건 중 0건이다.
#   방식을 바꾼 결과다 — 선정은 ref까지만 하고 text는 원문에서 추출했다.
#   추출한 문자열은 정의상 원문과 같으므로 오류가 발생할 자리가 없다.
#   verify_verses.py는 검출기가 아니라 안전망으로 작동했다(전건 통과).
#
# [선정에서 걸러낸 것 — 유형별]  ★ 후보를 내기 전에 이 목록을 먼저 대조한다
#   죄·심판 프레임      사 53:4("징벌") · 시 68:6("거역하는 자의 거처")
#                       시 4:4("범죄치 말지어다") · 시 30:5("그 노염은")
#   상실 축소·수용 요구  욥 1:21("취하신 자도") · 고후 4:17("경한 것")
#   분발·행위 요구       빌 4:13("모든 것을 할 수 있느니라") · 갈 6:9
#                       시 27:14("강하고 담대하며" — 13절만 채택)
#   맥락 이탈           히 13:5(절 앞부분이 "돈을 사랑치 말고")
#                       사 40:1(명령 대상이 위로하는 자들)
#   조건절              시 34:19("의인은")
#   ★ 스스로 표시하고 넘어간 위험
#                       **채택하면서 note에 위험을 적어 두고 진행한 구절들.**
#                       note는 사람이 읽고 화면에는 본문이 뜬다 — 위험을 적는
#                       것으로는 아무것도 막지 못한다. 2026-08-19 확장에서
#                       네 건이 같은 방식으로 들어왔다가 되돌려졌다.
#                       마 10:19  "너희를 넘겨줄 때에" — 면접·발표를 앞둔
#                                 사용자가 받는 첫 단어가 박해 상황이다
#                                 (anxiety.tension에 넣었다가 제외)
#                       요 11:6   "이틀을 더 유하시고" — 맥락을 모르면 무의미하고
#                                 알면 그 맥락이 죽음이다
#                                 (frustration.blocked에 넣었다가 제외)
#                       전 5:12   "노동자는 …잠을 달게 자거니와" — 피곤한데
#                                 잠도 안 오는 사용자에게 반증이 된다.
#                                 빌 4:13을 뺀 것과 같은 논리다
#                                 (exhaustion.tired에 넣었다가 제외)
#                       시 103:10 "우리의 죄를 따라 처치하지 아니하시며" —
#                                 짜증 화면의 첫 단어가 "우리의 죄"다. 정죄는
#                                 아니지만 죄 프레임이 이 화면에 필요하지 않다.
#                                 시편 103을 이 화면에서 세 번째로 쓰는 문제도 겹쳤다
#                                 (anger.irritation에 넣었다가 제외)
#                       ⚠ **규칙: 채택하면서 위험을 적게 되면 그 자리에서 판단을
#                         끝낸다.** 적고 넘어가면 화면에는 그 위험이 그대로 뜬다.
#                         시 128:2도 같은 유형이었고 그때는 승인 단계에서 걸렸다.
#   형통 약속           4차분 주요 위험(번영신학 톤)의 계속. 화면에 뜨는 것은
#                       본문이므로 note로 관리할 수 없다 — 아예 넣지 않는다.
#                       수 1:8("네가 형통하리라") · 시 1:3("그 행사가 다
#                       형통하리로다" → 렘 17:7-8로 대체) · 시 37:4 · 엡 3:20
#                       시 128:2("복되고 형통하리로다" — 2026-08-19 joy.proud
#                       후보로 올랐다가 같은 기준으로 뺐다. 앞부분
#                       "네 손이 수고한대로 먹을 것이라"는 맞았다)
#   ★ 되돌아오는 조건    **앞부분만 보면 모범인데 끝에서 조건으로 돌아오는** 유형.
#                       사 30:18  앞 "여호와께서 기다리시나니"는 화자 전환의
#                                 모범이다(기다리는 것이 사용자가 아니라 하나님).
#                                 그런데 끝이 "무릇 그를 기다리는 자는 복이
#                                 있도다"라 결국 사용자의 기다림이 조건이 된다.
#                       사 49:23  "발의 티끌을 핥을 것이니"(3차분에서 걸렀다)
#                       시 37:34  "그 도를 지키라 그리하면"
#                       ⚠ 이 유형은 **앞부분에 감동해서 채택하기 쉽다.**
#                         절을 끝까지 읽고, 마지막 절반이 앞의 선물을 조건으로
#                         바꾸는지 확인할 것. 범위를 좁혀 앞부분만 취하는 것도
#                         답이 아니다 — 문장이 끊긴다.
#   각 건의 근거는 해당 세분류 헤더 주석과 개별 note에 있다.
#
#   [재제안과 철회 — 2026-08-19 확장 작업]
#     이 목록의 두 건이 다른 세분류 후보로 다시 올라왔다. 둘 다 뺐다.
#       빌 4:13   anxiety.tension 후보로 올랐다. 무기력에서는 "현재가 반증으로
#                 보인다"였고 긴장에서는 "잘 해내야 한다는 압박으로 도착한다" —
#                 긴장의 원인이 그 부담인데 앱이 한 번 더 얹는 셈이다
#       시 27:14  anxiety.restless 후보로 올랐다. "바랄찌어다"의 반복 구조가
#                 속도를 늦춘다는 이유였으나, **그 반복 사이에 낀 것이
#                 "강하고 담대하며"**다. 초조한 사람에게도 결국 요구로 남는다.
#                 27:13만 골라 쓴 전례는 "이 절 전체는 안 된다"는 판단이
#                 이미 두 번 있었다는 뜻이다
#
#     ⚠ **화면마다 다르게 읽힌다는 이유로 예외를 두지 않는다.** 예외를 한 번
#       허용하면 다음에도 "이 화면에서는 다르다"가 나오고, 그때마다 판단이
#       갈리면 이 목록을 확인할 이유가 사라진다 — 목록이 목록으로 기능하지
#       못하게 된다. 제외는 유형 단위로 유지한다.
#
# [원문 데이터 관련 발견]
#   psa.116.7 "돌아갈지어다"(지)와 1차분 psa.46.10 "알찌어다"(찌)는
#   둘 다 공식 표기다 — 개역한글 원문 자체가 이 어미에서 일관되지 않다.
#   대한성서공회 사이트로 확인했다. data/krv/SOURCE.md의 "지/찌 혼재" 절 참조.
#
# [다음 차수로 넘긴 판단]
#   isa.61.3(125자) · rom.8.38(116자) · isa.40.30(112자)이 100자를 넘는다.
#   카드 UI 실물이 나오는 Phase 3에서 길이 상한을 정하고 재검토할 것.
