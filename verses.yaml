    text: >
      두려워 말라 내가 너와 함께 함이니라 놀라지 말라 나는 네 하나님이
      됨이니라 내가 너를 굳세게 하리라 참으로 너를 도와 주리라 참으로 나의
      의로운 오른손으로 너를 붙들리라
    theme: crisis_fixed
    note: >
      "두려워 말라 내가 너와 함께 함이니라 ... 너를 붙들리라" —
      붙드는 주체가 사용자가 아니다. 감정 풀 isa.41.10(anxiety.tension)과
