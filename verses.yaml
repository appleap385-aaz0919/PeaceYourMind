  - id: deu.31.8
    ref: 신명기 31:8
    text: >
      여호와 그가 네 앞서 행하시며 너와 함께하사 너를 떠나지 아니하시며
      버리지 아니하시리니 너는 두려워 말라 놀라지 말라
    emotion_tags: [anxiety.tension, sadness.lonely]
    theme: courage
