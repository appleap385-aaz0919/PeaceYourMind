  - id: 1pe.5.7
    ref: 베드로전서 5:7
    text: >
      너희 염려를 다 주께 맡겨 버리라 이는 저가 너희를 권고하심이니라
    emotion_tags: [anxiety.worry]
    theme: trust
    note: >
      맡김 주제의 대표 구절. 개역한글은 "권고하심"(돌보심의 옛말) —
      필요 시 화면에 짧은 낱말 풀이를 붙이는 옵션 검토 (Phase 3).
    verified: true
    verified_by: 웹 원문 대조 (bible.com KRV)
    verified_at: \"2026-08-18\"

  - id: mat.6.34
    ref: 마태복음 6:34
    text: >
      그러므로 내일 일을 위하여 염려하지 말라 내일 일은 내일 염려할 것이요
      한 날 괴로움은 그 날에 족하니라
    emotion_tags: [anxiety.worry]
    theme: trust
    note: '"한 날 괴로움은 그 날에 족하니라" — 걱정의 시간 범위를 오늘로 줄여주는 구절.'
    verified: true
    verified_by: verify_verses.py(krv1961@bluesaurel/Korean-Bible-1961-KRV#65cdce8)
    verified_at: "2026-08-18"

  - id: mat.6.26
    ref: 마태복음 6:26
    text: >
      공중의 새를 보라 심지도 않고 거두지도 않고 창고에 모아 들이지도
      아니하되 너희 천부께서 기르시나니 너희는 이것들보다 귀하지 아니하냐
    emotion_tags: [anxiety.worry]
    theme: trust
    note: 자연 이미지 + "귀하지 아니하냐"의 존재 긍정. creation 주제와도 접점.
    verified: true
    verified_by: verify_verses.py(krv1961@bluesaurel/Korean-Bible-1961-KRV#65cdce8)
    verified_at: "2026-08-18"

  - id: luk.12.7
    ref: 누가복음 12:7
    text: >
      너희에게는 오히려 머리털까지도 다 세신바 되었나니 두려워하지 말라 너희는
      많은 참새보다 귀하니라
    emotion_tags: [anxiety.worry]
    theme: love
    note: >
      2026-08-19 추가. 이 화면은 trust(맡기라)가 10/13으로 몰려 있어 축을 넓혔다 —
      맡기라고 요구하지 않고 "이미 세밀히 알려져 있다"고 말한다. 걱정이 "내가
      놓치고 있는 게 있다"는 감각이라 방향이 정확히 반대다.
      절 경계는 깨끗하다(앞 12:6이 이어지고 뒤 12:8은 화제 전환).
      ⚠ 다만 2~3절 위(12:4-5)가 박해·심판 맥락이다. 7절만 떼어 쓰는 것이
      proof-texting인지 검토했고, 개역한글 문장이 독립 격언으로 완결되며
      6절과 이어지는 참새 비유가 그 자체로 위로라 허용 범위로 봤다.

    verified: true
    verified_by: verify_verses.py(krv1961@bluesaurel/Korean-Bible-1961-KRV#65cdce8)
    verified_at: "2026-08-19"
  - id: psa.68.19
    ref: 시편 68:19
    text: >
      날마다 우리 짐을 지시는 주 곧 우리의 구원이신 하나님을 찬송할찌로다
    emotion_tags: [anxiety.worry]
    theme: trust
    note: >
      2026-08-19 추가. 같은 trust 축이지만 **문법이 다르다** — 기존 10개는
      "네가 맡겨라"(시 55:22·37:5, 벧전 5:7, 잠 3:5-6)인데 이것은 "이미 날마다
      지고 계신다"다. 요구 없이 같은 자리를 받친다.
      38자로 짧아 이 화면의 짧은 구절 잔량을 5→6으로 올린다.
      앞 18절 개선가·뒤 20절 구원 — 책망도 조건절도 붙지 않는다.

    verified: true
    verified_by: verify_verses.py(krv1961@bluesaurel/Korean-Bible-1961-KRV#65cdce8)
    verified_at: "2026-08-19"
  - id: psa.55.22
    ref: 시편 55:22
    text: >
      네 짐을 여호와께 맡겨 버리라 너를 붙드시고 의인의 요동함을 영영히
      허락지 아니하시리로다
    emotion_tags: [anxiety.worry, frustration.blocked]
    theme: trust
    note: '"짐" 메타포 — 걱정을 무게로 경험하는 사용자 언어와 맞닿는다.'
    verified: true
    verified_by: verify_verses.py(krv1961@bluesaurel/Korean-Bible-1961-KRV#65cdce8)
    verified_at: "2026-08-18"

  - id: pro.3.5
    ref: 잠언 3:5-6
    text: >
      너는 마음을 다하여 여호와를 의뢰하고 네 명철을 의지하지 말라 너는
      범사에 그를 인정하라 그리하면 네 길을 지도하시리라
    emotion_tags: [anxiety.worry, frustration.stuck]
    theme: trust
    note: guidance 주제와 걸치는 구절 — 걱정과 막막함 양쪽에서 쓸 수 있다.
    verified: true
    verified_by: verify_verses.py(krv1961@bluesaurel/Korean-Bible-1961-KRV#65cdce8)
    verified_at: "2026-08-18"

  - id: psa.37.5
    ref: 시편 37:5
    text: >
      너의 길을 여호와께 맡기라 저를 의지하면 저가 이루시고
    emotion_tags: [anxiety.worry]
    theme: trust
    note: 짧고 명료 — 카드 UI에서 첫 화면 후보.
    verified: true
    verified_by: verify_verses.py(krv1961@bluesaurel/Korean-Bible-1961-KRV#65cdce8)
    verified_at: "2026-08-18"

  - id: psa.121.1
    ref: 시편 121:1-2
    text: >
      내가 산을 향하여 눈을 들리라 나의 도움이 어디서 올꼬 나의 도움이
      천지를 지으신 여호와에게서로다
