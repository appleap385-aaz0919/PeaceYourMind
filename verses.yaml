# =====================================================================
# 3차분 — 분노·답답함 계열 (anger.*, frustration.*)
#
# [이 계열의 구조적 난점 — 3차분 착수 시 확인됨]
#   분노를 다루는 유명 구절 대부분이 화난 사람을 질책한다.
#     잠 29:11 "어리석은 자는 그 노를 다 드러내어도"
#     전  7:9  "노는 우매자의 품에 머무름이니라"
#     약 1:20  "사람의 성내는 것이 하나님의 의를 이루지 못함이니라"
#     잠 16:32 "노하기를 더디하는 자는 용사보다 낫고"  (비교 우위 구조 —
#              이미 화난 사람은 자동으로 하위에 놓인다)
#   themes.yaml의 self_control intent가 "정죄하지 않으면서 가라앉히는
#   방향, 잠언 계열"이라고 정의했지만, 실제 잠언의 분노 구절은 대부분
#   정죄한다. 그래서 잠언에서는 15:1만 살리고 나머지 자리를
#   "하나님이 노하기를 더디 하시는 분"이라는 진술로 채웠다.
#   같은 어휘를 사용자에 대한 요구에서 하나님에 대한 서술로 뒤집은 것이다.
# =====================================================================

  - id: psa.102.4
    ref: 시편 102:4
    text: >
      내가 음식 먹기도 잊었음으로 내 마음이 풀 같이 쇠잔하였사오며
    emotion_tags: [exhaustion.listless]
    theme: lament
    note: >
      2026-08-19 추가. "음식 먹기도 잊었음으로 내 마음이 풀 같이 쇠잔하였사오며" —
      무기력의 신체 감각(식욕 상실)을 그대로 적었다. lament 0 → 1이고
      34자로 짧아 잔량이 6 → 7이 된다.
      ⚠ 이 화면은 **+1에서 멈췄다.** 후보가 마른 것이 아니라 이미 채워져
        있기 때문이다 — strength 5 · hope 5로 균형이고 짧은 구절도 상위였다.
        위기 인접이라 걸러야 할 것도 많다. 억지로 채우면 이 화면이 지키는 것
        (의욕 없음을 질책하지 않는다)이 흔들린다.
      [제외 기록] 시 143:7("무덤에 내려가는 자 같을까" — 위기 인접 부적합) ·
        시 42:11("어찌하여 낙망하며"가 자책 유도, "너는 하나님을 바라라"는 요구) ·
        마 12:20(사 42:3 "상한 갈대"와 같은 이미지가 이미 이 화면에 있다) ·
        사 57:15("통회하고 마음이 겸손한 자와 함께"가 조건절) ·
        롬 8:26(frustration.suppressed에 이미 수록)

