  # ═══════════════════════════════════════════════════════════
  # anger.unfair (억울함) — 주제: justice, lament, forgiveness
  # 방향: 억울함을 "네가 참아라"로 누르지 않고 갚으시는 분께 넘긴다.
  #
  # [배분으로 순서를 구현했다] justice 5 / lament 3 / forgiveness 2.
  #   themes.yaml의 mapping 순서(justice → lament → forgiveness)를
  #   구절 수로도 반영했다. 억울한 상태에 용서를 먼저 요구하면 2차 가해다.
  #   남긴 forgiveness 2건도 사용자에게 용서를 요구하지 않는 형식만 골랐다 —
  #   gen.50.20은 가해 사실을 먼저 인정한 뒤의 말이고,
  #   luk.23.34는 명령문이 아니라 예수가 하는 기도다.
  #
  # [제외 — 당위·조건·위협]
  #   마 6:14-15 "용서하면 ... 용서하지 아니하면 아버지께서도 용서하지
