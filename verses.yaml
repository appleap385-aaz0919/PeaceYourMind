    emotion_tags: [sadness.lonely]
    theme: presence
    note: >
      "고아와 같이 버려두지 아니하고" — 외로움을 버림받음으로 경험하는
      언어에 정면으로 대응한다. 짧아 카드 UI에 적합.
    verified: true
    verified_by: verify_verses.py(krv1961@bluesaurel/Korean-Bible-1961-KRV#65cdce8)
    verified_at: "2026-08-18"

  - id: psa.73.23
    ref: 시편 73:23
    text: >
      내가 항상 주와 함께하니 주께서 내 오른손을 붙드셨나이다
    emotion_tags: [sadness.lonely]
    theme: presence
    note: '"내 오른손을 붙드셨나이다" — 접촉의 이미지. 짧고 명료.'
    verified: true
    verified_by: verify_verses.py(krv1961@bluesaurel/Korean-Bible-1961-KRV#65cdce8)
    verified_at: "2026-08-18"

  - id: mat.28.20
    ref: 마태복음 28:20
    text: >
      내가 너희에게 분부한 모든 것을 가르쳐 지키게 하라 볼찌어다 내가 세상
      끝날까지 너희와 항상 함께 있으리라 하시니라
    emotion_tags: [sadness.lonely]
    theme: presence
    note: >
      임마누엘 프레임의 대표 구절. 절 앞부분이 명령이지만 뒤에 약속
      ("세상 끝날까지 함께")이 따라온다 — 선정 원칙 3 충족.
    verified: true
    verified_by: verify_verses.py(krv1961@bluesaurel/Korean-Bible-1961-KRV#65cdce8)
    verified_at: "2026-08-18"

  - id: psa.139.7
    ref: 시편 139:7-8
    text: >
      내가 주의 신을 떠나 어디로 가며 주의 앞에서 어디로 피하리이까 내가
      하늘에 올라갈찌라도 거기 계시며 음부에 내 자리를 펼찌라도 거기
      계시니이다
    emotion_tags: [sadness.lonely]
    theme: presence
    note: >
      "어디로 피하리이까"의 답이 "거기 계시니이다"로 이어진다. 8절까지 묶어야
      질문이 답을 만난다 — 7절 단독은 도피 실패로만 읽힌다(선정 원칙 4).
    verified: true
    verified_by: verify_verses.py(krv1961@bluesaurel/Korean-Bible-1961-KRV#65cdce8)
    verified_at: "2026-08-18"

  - id: psa.27.10
    ref: 시편 27:10
    text: >
      내 부모는 나를 버렸으나 여호와는 나를 영접하시리이다
    emotion_tags: [sadness.lonely]
    theme: love
    note: >
      "내 부모는 나를 버렸으나" — 가장 가까운 관계의 단절을 전제하고 말하는
      구절이라, 외로움을 축소하지 않으면서 그 다음을 놓는다.
    verified: true
    verified_by: verify_verses.py(krv1961@bluesaurel/Korean-Bible-1961-KRV#65cdce8)
    verified_at: "2026-08-18"

  - id: isa.49.15
    ref: 이사야 49:15
    text: >
      여인이 어찌 그 젖먹는 자식을 잊겠으며 자기 태에서 난 아들을 긍휼히
      여기지 않겠느냐 그들은 혹시 잊을찌라도 나는 너를 잊지 아니할 것이라
    emotion_tags: [sadness.lonely]
    theme: love
    note: >
      "그들은 혹시 잊을찌라도 나는 너를 잊지 아니할 것이라" — 잊혀짐의
      두려움에 정확히 대응한다. 옛 표기 "잊을찌라도"가 살아 있는 구절.
    verified: true
    verified_by: verify_verses.py(krv1961@bluesaurel/Korean-Bible-1961-KRV#65cdce8)
    verified_at: "2026-08-18"

  - id: jer.31.3
    ref: 예레미야 31:3
    text: >
      나 여호와가 옛적에 이스라엘에게 나타나 이르기를 내가 무궁한 사랑으로
      너를 사랑하는고로 인자함으로 너를 인도하였다 하였노라
    emotion_tags: [sadness.lonely]
    theme: love
    note: '"무궁한 사랑으로 너를 사랑하는고로" — love 주제의 대표 구절.'
    verified: true
    verified_by: verify_verses.py(krv1961@bluesaurel/Korean-Bible-1961-KRV#65cdce8)
    verified_at: "2026-08-18"

  - id: isa.43.4
    ref: 이사야 43:4
    text: >
      내가 너를 보배롭고 존귀하게 여기고 너를 사랑하였은즉 내가 사람들을 주어
      너를 바꾸며 백성들로 네 생명을 대신하리니
    emotion_tags: [sadness.lonely]
    theme: love
    note: >
      "보배롭고 존귀하게 여기고" — 존재 가치의 언어. 1차분 isa.43.1
      ("지명하여 불렀나니")과 같은 장의 연장이라 톤이 이어진다.
    verified: true
    verified_by: verify_verses.py(krv1961@bluesaurel/Korean-Bible-1961-KRV#65cdce8)
    verified_at: "2026-08-18"

  - id: rom.8.38
    ref: 로마서 8:38-39
    text: >
      내가 확신하노니 사망이나 생명이나 천사들이나 권세자들이나 현재 일이나
      장래 일이나 능력이나 높음이나 깊음이나 다른 아무 피조물이라도 우리를
      우리 주 그리스도 예수 안에 있는 하나님의 사랑에서 끊을 수 없으리라
    emotion_tags: [sadness.lonely]
    theme: love
    note: >
      2차분 최장(116자). 그럼에도 넣는 이유는 열거 구조 자체가 메시지라서다
      — 무엇을 갖다 대도 끊을 수 없다는 결론이 목록의 길이로 표현된다.
      38절만 쓰면 "끊을 수 없으리라"가 없어 문장이 성립하지 않는다.
    verified: true
    verified_by: verify_verses.py(krv1961@bluesaurel/Korean-Bible-1961-KRV#65cdce8)
    verified_at: "2026-08-18"

  # ═══════════════════════════════════════════════════════════
  # sadness.loss (상실) — 주제: comfort, renewal
  # 방향: 애도에 시간을 허용한다. 회복을 말하되 "이제 그만"이라고 하지 않는다.
  #      상실을 축소하는 구절(고후 4:17 "경한 것")과 수용을 요구하는 구절
  #      (욥 1:21 "취하신 자도 여호와시오니")은 유명해도 넣지 않았다 —
  #      상실 직후의 사용자에게 건넬 말이 아니다 (선정 원칙 1)
  # ═══════════════════════════════════════════════════════════

  - id: isa.66.13
    ref: 이사야 66:13
    text: >
      어미가 자식을 위로함 같이 내가 너희를 위로할 것인즉 너희가 예루살렘에서
      위로를 받으리니
    emotion_tags: [sadness.loss]
    theme: comfort
    note: >
      "어미가 자식을 위로함 같이" — 위로하겠다는 선언이 아니라 위로의
      방식을 이미지로 보여준다. 짧아 카드 UI에 적합.
    verified: true
    verified_by: verify_verses.py(krv1961@bluesaurel/Korean-Bible-1961-KRV#65cdce8)
    verified_at: "2026-08-18"

  - id: ecc.3.4
    ref: 전도서 3:4
    text: >
      울 때가 있고 웃을 때가 있으며 슬퍼할 때가 있고 춤출 때가 있으며
    emotion_tags: [sadness.loss]
    theme: comfort
    note: >
      "슬퍼할 때가 있고" — 애도에 시간을 허용하는 구절. 회복을 재촉하지
      않는다는 이 세분류의 방향을 가장 짧게 말한다.
    verified: true
    verified_by: verify_verses.py(krv1961@bluesaurel/Korean-Bible-1961-KRV#65cdce8)
    verified_at: "2026-08-18"

  - id: psa.23.4
    ref: 시편 23:4
    text: >
      내가 사망의 음침한 골짜기로 다닐찌라도 해를 두려워하지 않을 것은 주께서
      나와 함께 하심이라 주의 지팡이와 막대기가 나를 안위하시나이다
    emotion_tags: [sadness.loss]
    theme: comfort
    note: >
      sadness.lonely 검토 때 "사망의 음침한 골짜기"가 외로움 화면에는
      무겁다고 보아 보류했던 구절. 사별 맥락에서는 그 무게가 제자리를 찾는다.
    verified: true
    verified_by: verify_verses.py(krv1961@bluesaurel/Korean-Bible-1961-KRV#65cdce8)
    verified_at: "2026-08-18"

  - id: rev.21.4
    ref: 요한계시록 21:4
    text: >
      모든 눈물을 그 눈에서 씻기시매 다시 사망이 없고 애통하는 것이나 곡하는
      것이나 아픈 것이 다시 있지 아니하리니 처음 것들이 다 지나갔음이러라
    emotion_tags: [sadness.loss]
    theme: comfort
    note: >
      종말론적 위로. 지금 슬픔이 끝난다고 말하지 않는 점이 오히려 정직하다 —
      상실 직후에 "곧 괜찮아진다"고 하는 것보다 낫다.
    verified: true
    verified_by: verify_verses.py(krv1961@bluesaurel/Korean-Bible-1961-KRV#65cdce8)
    verified_at: "2026-08-18"

  - id: psa.116.15
    ref: 시편 116:15
    text: >
      성도의 죽는 것을 여호와께서 귀중히 보시는도다
    emotion_tags: [sadness.loss]
    theme: comfort
    note: >
      떠난 이를 가볍게 두지 않는 구절.
      [주의] 이 세분류는 사별뿐 아니라 이별·상실 전반을 받는데 이 구절은
      죽음에 특화돼 있다. 사별이 아닌 상실에는 겉돌 수 있다 — Phase 3에서
      노출 우선순위를 둘 때 고려할 것.
    verified: true
    verified_by: verify_verses.py(krv1961@bluesaurel/Korean-Bible-1961-KRV#65cdce8)
    verified_at: "2026-08-18"

  - id: psa.30.11
    ref: 시편 30:11
    text: >
      주께서 나의 슬픔을 변하여 춤이 되게 하시며 나의 베옷을 벗기고 기쁨으로
      띠 띠우셨나이다
    emotion_tags: [sadness.loss]
    theme: renewal
    note: >
      "슬픔을 변하여 춤이 되게 하시며" — 슬픔을 없애는 것이 아니라
      변화시킨다는 어휘라 애도를 부정하지 않는다.
      (같은 시편 30편 5절은 앞부분 "그 노염은 잠간이요" 때문에 제외했다)
    verified: true
    verified_by: verify_verses.py(krv1961@bluesaurel/Korean-Bible-1961-KRV#65cdce8)
    verified_at: "2026-08-18"

  - id: joe.2.25
    ref: 요엘 2:25
    text: >
      내가 전에 너희에게 보낸 큰 군대 곧 메뚜기와 늣과 황충과 팟종이의 먹은
      햇수대로 너희에게 갚아주리니
    emotion_tags: [sadness.loss]
    theme: renewal
    note: >
      잃어버린 "햇수" 곧 시간을 회복 대상으로 말하는 드문 구절.
      [검수 이력] 희귀 어휘(메뚜기·늣·황충·팟종이)가 있어 HANDOFF 3절이
      별도 확인을 지시한 구절이다. 제2 소스와 전문 대조해 일치 확인 (2026-08-18).
    verified: true
    verified_by: verify_verses.py(krv1961@bluesaurel/Korean-Bible-1961-KRV#65cdce8)
    verified_at: "2026-08-18"

  - id: psa.71.20
    ref: 시편 71:20
    text: >
      우리에게 많고 심한 고난을 보이신 주께서 우리를 다시 살리시며 땅 깊은
      곳에서 다시 이끌어 올리시리이다
    emotion_tags: [sadness.loss]
    theme: renewal
    note: '"다시 살리시며", "다시 이끌어 올리시리이다" — "다시"의 반복이 회복의 리듬을 만든다.'
    verified: true
    verified_by: verify_verses.py(krv1961@bluesaurel/Korean-Bible-1961-KRV#65cdce8)
    verified_at: "2026-08-18"

  - id: isa.61.3
    ref: 이사야 61:3
    text: >
      무릇 시온에서 슬퍼하는 자에게 화관을 주어 그 재를 대신하며 희락의
      기름으로 그 슬픔을 대신하며 찬송의 옷으로 그 근심을 대신하시고 그들로
      의의 나무 곧 여호와의 심으신바 그 영광을 나타낼 자라 일컬음을 얻게
      하려 하심이니라
    emotion_tags: [sadness.loss]
    theme: renewal
    note: >
      2차분 최장(125자). 그럼에도 넣는 이유는 "재를 대신하며 / 슬픔을
      대신하며 / 근심을 대신하시고"의 3연속이 renewal 주제의 핵심이라서다.
      [검토 필요] 길이가 카드 UI에 부담이면 가장 먼저 재검토할 후보다.
    verified: true
    verified_by: verify_verses.py(krv1961@bluesaurel/Korean-Bible-1961-KRV#65cdce8)
    verified_at: "2026-08-18"

  - id: isa.25.8
    ref: 이사야 25:8
    text: >
      사망을 영원히 멸하실 것이라 주 여호와께서 모든 얼굴에서 눈물을 씻기시며
      그 백성의 수치를 온 천하에서 제하시리라 여호와께서 이같이 말씀하셨느니라
    emotion_tags: [sadness.loss]
    theme: renewal
    note: >
      rev.21.4("모든 눈물을 그 눈에서 씻기시매")의 구약 원형.
      두 구절이 겹치지만 theme이 갈려(comfort / renewal) 다른 화면에 놓인다.
    verified: true
    verified_by: verify_verses.py(krv1961@bluesaurel/Korean-Bible-1961-KRV#65cdce8)
    verified_at: "2026-08-18"

  # ═══════════════════════════════════════════════════════════
  # exhaustion.burnout (번아웃) — 주제: rest, renewal
  # 방향: 쉬라고 권하기 전에 "쉬어도 된다"는 허가를 준다.
  #      더 애쓰라는 방향의 구절은 넣지 않는다 — 번아웃 화면에서
  #      분발 요구는 이 서비스가 낼 수 있는 최악의 출력에 가깝다
  # ═══════════════════════════════════════════════════════════

  - id: mat.11.28
    ref: 마태복음 11:28
    text: >
      수고하고 무거운 짐진 자들아 다 내게로 오라 내가 너희를 쉬게 하리라
    emotion_tags: [exhaustion.burnout]
    theme: rest
    note: >
      themes.yaml의 rest 키워드("수고하고 무거운", "쉬게 하리라")가 그대로
      나오는 대표 구절. 번아웃 화면의 첫 후보.
    verified: true
    verified_by: verify_verses.py(krv1961@bluesaurel/Korean-Bible-1961-KRV#65cdce8)
    verified_at: "2026-08-18"

  - id: mrk.6.31
    ref: 마가복음 6:31
    text: >
      이르시되 너희는 따로 한적한 곳에 와서 잠간 쉬어라 하시니 이는 오고
      가는 사람이 많아 음식 먹을 겨를도 없음이라
    emotion_tags: [exhaustion.burnout]
    theme: rest
    note: >
      예수가 제자들에게 쉬라고 명하는 장면이고, 그 사유가 "음식 먹을
      겨를도 없음이라" — 번아웃 상태 묘사 그 자체다. 옛 표기 "잠간"이
      살아 있는 구절(verses.yaml 헤더가 든 예시 어휘).
    verified: true
    verified_by: verify_verses.py(krv1961@bluesaurel/Korean-Bible-1961-KRV#65cdce8)
    verified_at: "2026-08-18"

  - id: psa.23.2
    ref: 시편 23:2
    text: >
      그가 나를 푸른 초장에 누이시며 쉴만한 물 가으로 인도하시는도다
    emotion_tags: [exhaustion.burnout]
    theme: rest
    note: >
      "누이시며" — 쉬라고 권하는 것이 아니라 눕히신다. 쉬는 데 죄책감을
      느끼는 상태에 맞는 방향.
      시편 23편에서 세 번째 절이다(psa.23.1=trust, psa.23.4=comfort).
      주제가 셋 다 달라 같은 화면에 함께 뜨지 않는다.
    verified: true
    verified_by: verify_verses.py(krv1961@bluesaurel/Korean-Bible-1961-KRV#65cdce8)
    verified_at: "2026-08-18"

  - id: exo.33.14
    ref: 출애굽기 33:14
    text: >
      여호와께서 가라사대 내가 친히 가리라 내가 너로 편케 하리라
    emotion_tags: [exhaustion.burnout]
    theme: rest
    note: '"내가 너로 편케 하리라" — 짧고 명료. 카드 UI 첫 화면 후보.'
    verified: true
    verified_by: verify_verses.py(krv1961@bluesaurel/Korean-Bible-1961-KRV#65cdce8)
    verified_at: "2026-08-18"

  - id: psa.127.2
    ref: 시편 127:2
    text: >
      너희가 일찌기 일어나고 늦게 누우며 수고의 떡을 먹음이 헛되도다 그러므로
      여호와께서 그 사랑하시는 자에게는 잠을 주시는도다
    emotion_tags: [exhaustion.burnout]
    theme: rest
    note: >
      "일찌기 일어나고 늦게 누우며" — 과로를 직접 묘사하고 결론이 "잠을
      주시는도다"로 떨어진다. "헛되도다"가 질책이 아니라 놓아도 된다는
      방향으로 읽히는지 Phase 3 문구 검토 때 확인할 것.
    verified: true
    verified_by: verify_verses.py(krv1961@bluesaurel/Korean-Bible-1961-KRV#65cdce8)
    verified_at: "2026-08-18"

  - id: mat.11.29
    ref: 마태복음 11:29-30
    text: >
      나는 마음이 온유하고 겸손하니 나의 멍에를 메고 내게 배우라 그러면 너희
      마음이 쉼을 얻으리니 이는 내 멍에는 쉽고 내 짐은 가벼움이라 하시니라
    emotion_tags: [exhaustion.burnout]
    theme: rest
    note: >
      mat.11.28("쉬게 하리라")의 "어떻게"에 해당한다. 29절만 쓰면
      "멍에를 메라"는 요구로 끝나므로 30절("내 짐은 가벼움이라")과 묶는다
      — 선정 원칙 3.
    verified: true
    verified_by: verify_verses.py(krv1961@bluesaurel/Korean-Bible-1961-KRV#65cdce8)
    verified_at: "2026-08-18"

  - id: 1ki.19.7
    ref: 열왕기상 19:7
    text: >
      여호와의 사자가 또 다시 와서 어루만지며 이르되 일어나서 먹으라 네가
      길을 이기지 못할까 하노라 하는지라
    emotion_tags: [exhaustion.burnout]
    theme: renewal
    note: >
      소진해 죽기를 구하던 엘리야에게 천사가 준 것이 잠과 음식이었다.
      영적 처방도 분발 요구도 아니라는 점이 이 구절을 고른 이유다.
      서사 구절 사용은 1차분 mrk.4.39가 선례.
    verified: true
    verified_by: verify_verses.py(krv1961@bluesaurel/Korean-Bible-1961-KRV#65cdce8)
    verified_at: "2026-08-18"

  - id: jer.31.25
    ref: 예레미야 31:25
    text: >
      이는 내가 그 피곤한 심령을 만족케 하며 무릇 슬픈 심령을 상쾌케
      하였음이니라 하시기로
    emotion_tags: [exhaustion.burnout]
    theme: renewal
    note: '"피곤한 심령을 만족케 하며" — 피곤을 영적 결함으로 두지 않는 어휘.'
    verified: true
    verified_by: verify_verses.py(krv1961@bluesaurel/Korean-Bible-1961-KRV#65cdce8)
    verified_at: "2026-08-18"

  - id: isa.58.11
    ref: 이사야 58:11
    text: >
      나 여호와가 너를 항상 인도하여 마른 곳에서도 네 영혼을 만족케 하며 네
      뼈를 견고케 하리니 너는 물 댄 동산 같겠고 물이 끊어지지 아니하는 샘
      같을 것이라
    emotion_tags: [exhaustion.burnout]
    theme: renewal
    note: >
      "마른 곳에서도" — 고갈된 상태를 전제하고 말한다. 회복을 조건 없이
      약속하는 구조라 번아웃에 맞는다.
    verified: true
    verified_by: verify_verses.py(krv1961@bluesaurel/Korean-Bible-1961-KRV#65cdce8)
    verified_at: "2026-08-18"

  - id: psa.116.7
    ref: 시편 116:7
    text: >
      내 영혼아 네 평안함에 돌아갈지어다 여호와께서 너를 후대하심이로다
    emotion_tags: [exhaustion.burnout]
    theme: renewal
    note: >
      쉼을 "돌아감"으로 표현한다 — 새로 얻는 것이 아니라 원래 자리로
      되돌아가는 것.
      [검수 이력] 이 구절은 "돌아갈지어다"(지)이고 시 46:10은 "알찌어다"(찌)다.
      개역한글 원문 자체가 이 어미에서 일관되지 않으며 둘 다 공식 표기임을
      대한성서공회 사이트로 확인했다 (2026-08-18). data/krv/SOURCE.md 참조.
    verified: true
    verified_by: verify_verses.py(krv1961@bluesaurel/Korean-Bible-1961-KRV#65cdce8)
    verified_at: "2026-08-18"

  # ═══════════════════════════════════════════════════════════
  # exhaustion.tired (피곤·지침) — 주제: rest, quiet_worship
  # 방향: burnout보다 가벼운 일상적 피로를 받는다. 회복을 약속하기보다
  #      지금 이대로 조용히 있어도 된다는 쪽에 무게를 둔다.
  #
  # [시간대 어휘] 이 풀은 시간대 어휘가 유독 풍부하다 —
  #   잠들기 전 psa.3.5 · pro.3.24 / 밤중 psa.63.6 / 낮과 밤 psa.42.8 /
  #   아침 psa.143.8 (1차분 psa.4.8도 밤 맥락)
  #   1차분 psa.4.8 note의 "시간대별 노출"(Phase 3) 아이디어를 실제로
  #   시험해 볼 수 있는 풀이 여기서 만들어진다
  # ═══════════════════════════════════════════════════════════

  - id: psa.3.5
    ref: 시편 3:5
    text: >
      내가 누워 자고 깨었으니 여호와께서 나를 붙드심이로다
    emotion_tags: [exhaustion.tired]
    theme: rest
    note: >
      잠들고 깬 것 자체를 붙드심으로 본다 — 아무것도 해내지 못한 날에도
      성립하는 진술이라 지친 상태에 맞는다.
    verified: true
    verified_by: verify_verses.py(krv1961@bluesaurel/Korean-Bible-1961-KRV#65cdce8)
    verified_at: "2026-08-18"

  - id: pro.3.24
    ref: 잠언 3:24
    text: >
      네가 누울 때에 두려워하지 아니하겠고 네가 누운즉 네 잠이 달리로다
    emotion_tags: [exhaustion.tired]
    theme: rest
    note: '"네 잠이 달리로다" — 감각 어휘라 관념적이지 않다.'
    verified: true
    verified_by: verify_verses.py(krv1961@bluesaurel/Korean-Bible-1961-KRV#65cdce8)
    verified_at: "2026-08-18"

  - id: psa.91.1
    ref: 시편 91:1
    text: >
      지존자의 은밀한 곳에 거하는 자는 전능하신 자의 그늘 아래 거하리로다
    emotion_tags: [exhaustion.tired]
    theme: rest
    note: '"그늘 아래" — 쉼을 공간 이미지로 준다. 무엇을 하라는 요구가 없다.'
    verified: true
    verified_by: verify_verses.py(krv1961@bluesaurel/Korean-Bible-1961-KRV#65cdce8)
    verified_at: "2026-08-18"

  - id: psa.131.1
    ref: 시편 131:1
    text: >
      여호와여 내 마음이 교만치 아니하고 내 눈이 높지 아니하오며 내가 큰
      일과 미치지 못할 기이한 일을 힘쓰지 아니하나이다
    emotion_tags: [exhaustion.tired]
    theme: rest
    note: >
      "큰 일과 미치지 못할 기이한 일을 힘쓰지 아니하나이다" — 과욕을
      내려놓는 고백이라 지침의 원인 쪽을 건드린다.
      1차분 psa.131.2의 바로 앞 절이다. 131편을 묶지 않고 나눈 것은 두 절이
      받는 감정이 달라서다 — 1절은 과욕 내려놓기(지침), 2절은 젖 뗀 아이의
      고요함(초조함). 서로 다른 화면에 놓인다.
    verified: true
    verified_by: verify_verses.py(krv1961@bluesaurel/Korean-Bible-1961-KRV#65cdce8)
    verified_at: "2026-08-18"

  - id: heb.4.9
    ref: 히브리서 4:9-10
    text: >
      그런즉 안식할 때가 하나님의 백성에게 남아 있도다 이미 그의 안식에
      들어간 자는 하나님이 자기 일을 쉬심과 같이 자기 일을 쉬느니라
    emotion_tags: [exhaustion.tired]
    theme: rest
    note: >
      "안식할 때가 남아 있도다" — 쉼이 아직 소진되지 않았다는 진술.
      9절만 쓰면 근거가 없어 10절과 묶는다.
    verified: true
    verified_by: verify_verses.py(krv1961@bluesaurel/Korean-Bible-1961-KRV#65cdce8)
    verified_at: "2026-08-18"

  - id: lam.3.26
    ref: 예레미야애가 3:26
    text: >
      사람이 여호와의 구원을 바라고 잠잠히 기다림이 좋도다
    emotion_tags: [exhaustion.tired]
    theme: quiet_worship
    note: >
      "잠잠히 기다림이 좋도다" — 아무것도 하지 않는 상태를 긍정한다.
      29자로 짧아 카드 UI에 적합.
    verified: true
    verified_by: verify_verses.py(krv1961@bluesaurel/Korean-Bible-1961-KRV#65cdce8)
    verified_at: "2026-08-18"

  - id: psa.130.5
    ref: 시편 130:5
    text: >
      나 곧 내 영혼이 여호와를 기다리며 내가 그 말씀을 바라는도다
    emotion_tags: [exhaustion.tired]
    theme: quiet_worship
    note: 기다림의 자세만 있고 성취 요구가 없다. 잔잔한 찬양 영상과 결이 맞는다.
    verified: true
    verified_by: verify_verses.py(krv1961@bluesaurel/Korean-Bible-1961-KRV#65cdce8)
    verified_at: "2026-08-18"

  - id: psa.63.6
    ref: 시편 63:6
    text: >
      내가 나의 침상에서 주를 기억하며 밤중에 주를 묵상할 때에 하오리니
    emotion_tags: [exhaustion.tired]
    theme: quiet_worship
    note: '"침상에서", "밤중에" — 밤 시간대 사용 맥락에 직접 맞는 구절.'
    verified: true
    verified_by: verify_verses.py(krv1961@bluesaurel/Korean-Bible-1961-KRV#65cdce8)
    verified_at: "2026-08-18"

  - id: psa.42.8
    ref: 시편 42:8
    text: >
      낮에는 여호와께서 그 인자함을 베푸시고 밤에는 그 찬송이 내게 있어
      생명의 하나님께 기도하리로다
    emotion_tags: [exhaustion.tired]
    theme: quiet_worship
    note: >
      "낮에는 ... 밤에는"이 한 절 안에 들어 있어 하루 전체를 받는다.
      1차분에 없던 리듬 구조.
    verified: true
    verified_by: verify_verses.py(krv1961@bluesaurel/Korean-Bible-1961-KRV#65cdce8)
    verified_at: "2026-08-18"

  - id: psa.143.8
    ref: 시편 143:8
    text: >
      아침에 나로 주의 인자한 말씀을 듣게 하소서 내가 주를 의뢰함이니이다
      나의 다닐 길을 알게 하소서 내가 내 영혼을 주께 받듦이니이다
    emotion_tags: [exhaustion.tired]
    theme: quiet_worship
    note: '"아침에" — 하루를 시작하는 시간대. psa.63.6(밤)과 짝을 이룬다.'
    verified: true
    verified_by: verify_verses.py(krv1961@bluesaurel/Korean-Bible-1961-KRV#65cdce8)
    verified_at: "2026-08-18"

  # ═══════════════════════════════════════════════════════════
  # exhaustion.listless (무기력) — 주제: strength, hope
  # 방향: 의욕 없음을 질책하지 않고 힘의 출처를 바꾼다.
  #      위기 표현과 인접한 세분류다(HANDOFF 3절). 분발 요구·조건절이 붙은
  #      구절은 넣지 않았다 — 아무것도 할 수 없는 상태에서는 격려도
  #      요구로 도착한다. 제외 사례는 psa.40.1 아래 note 참조
  # ═══════════════════════════════════════════════════════════

  - id: isa.40.29
    ref: 이사야 40:29
    text: >
      피곤한 자에게는 능력을 주시며 무능한 자에게는 힘을 더하시나니
    emotion_tags: [exhaustion.listless]
    theme: strength
    note: >
      "무능한 자에게는 힘을 더하시나니" — 조건이 없다. 무능을 자격 미달로
      두지 않는 드문 구절이라 무기력 화면의 첫 후보.
    verified: true
    verified_by: verify_verses.py(krv1961@bluesaurel/Korean-Bible-1961-KRV#65cdce8)
    verified_at: "2026-08-18"

  - id: isa.40.30
    ref: 이사야 40:30-31
    text: >
      소년이라도 피곤하며 곤비하며 장정이라도 넘어지며 자빠지되 오직 여호와를
      앙망하는 자는 새 힘을 얻으리니 독수리의 날개치며 올라감 같을 것이요
      달음박질하여도 곤비치 아니하겠고 걸어가도 피곤치 아니하리로다
    emotion_tags: [exhaustion.listless]
    theme: strength
    note: >
      themes.yaml의 strength 키워드("새 힘", "독수리")가 그대로 나오는 구절.
      31절의 "앙망하는 자는"이 조건절로 읽힐 수 있어 조건 없는 isa.40.29와
      같은 풀에 두었다. 30절부터 묶는 것은 "장정이라도 넘어지며"가
      무기력을 정상 상태로 놓기 때문이다.
    verified: true
    verified_by: verify_verses.py(krv1961@bluesaurel/Korean-Bible-1961-KRV#65cdce8)
    verified_at: "2026-08-18"

  - id: psa.73.26
    ref: 시편 73:26
    text: >
      내 육체와 마음은 쇠잔하나 하나님은 내 마음의 반석이시요 영원한
      분깃이시라
    emotion_tags: [exhaustion.listless]
    theme: strength
    note: >
      "내 육체와 마음은 쇠잔하나" — 쇠잔함을 부정하지 않고 그 위에 반석을
      놓는 구조. 감정을 판단하지 않는다는 선정 원칙 1에 정확히 맞는다.
    verified: true
    verified_by: verify_verses.py(krv1961@bluesaurel/Korean-Bible-1961-KRV#65cdce8)
    verified_at: "2026-08-18"

  - id: psa.103.5
    ref: 시편 103:5
    text: >
      좋은 것으로 네 소원을 만족케 하사 네 청춘으로 독수리 같이 새롭게
      하시는도다
    emotion_tags: [exhaustion.listless]
    theme: strength
    note: >
      exhaustion.tired 검토 때 주제 매핑(rest/quiet_worship)과 맞지 않아
      보류했던 구절. strength 주제에서 제자리를 찾았다.
    verified: true
    verified_by: verify_verses.py(krv1961@bluesaurel/Korean-Bible-1961-KRV#65cdce8)
    verified_at: "2026-08-18"

  - id: psa.138.3
    ref: 시편 138:3
    text: >
      내가 간구하는 날에 주께서 응답하시고 내 영혼을 장려하여 강하게
      하셨나이다
    emotion_tags: [exhaustion.listless]
    theme: strength
    note: '"내 영혼을 장려하여 강하게 하셨나이다" — 힘의 출처가 내가 아니라는 구조.'
    verified: true
    verified_by: verify_verses.py(krv1961@bluesaurel/Korean-Bible-1961-KRV#65cdce8)
    verified_at: "2026-08-18"

  - id: isa.42.3
    ref: 이사야 42:3
    text: >
      상한 갈대를 꺾지 아니하며 꺼져가는 등불을 끄지 아니하고 진리로 공의를
      베풀 것이며
    emotion_tags: [exhaustion.listless]
    theme: hope
    note: >
      "상한 갈대를 꺾지 아니하며 꺼져가는 등불을 끄지 아니하고" —
      이미 약해진 것을 더 밀지 않겠다는 선언이다. 이 세분류의 핵심 구절.
    verified: true
    verified_by: verify_verses.py(krv1961@bluesaurel/Korean-Bible-1961-KRV#65cdce8)
    verified_at: "2026-08-18"

  - id: psa.27.13
    ref: 시편 27:13
    text: >
      내가 산 자의 땅에 있음이여 여호와의 은혜 볼 것을 믿었도다
    emotion_tags: [exhaustion.listless]
    theme: hope
    note: >
      살아 있음 자체를 근거로 두는 구절. 14절("강하고 담대하며")은
      분발 요구라 범위에서 뺐다 — 13절 단독으로 문장이 성립한다.
    verified: true
    verified_by: verify_verses.py(krv1961@bluesaurel/Korean-Bible-1961-KRV#65cdce8)
    verified_at: "2026-08-18"

  - id: lam.3.24
    ref: 예레미야애가 3:24
    text: >
      내 심령에 이르기를 여호와는 나의 기업이시니 그러므로 내가 저를 바라리라
      하도다
    emotion_tags: [exhaustion.listless]
    theme: hope
    note: >
      "내 심령에 이르기를" — 자기 자신에게 하는 말이라 외부의 훈계가 아니다.
      애가 3장에서 세 구절을 쓰지만(22 sorrow / 24 listless / 26 tired)
      세분류가 갈려 같은 화면에 겹치지 않는다.
    verified: true
