    text: >
      여호와는 내 편이시라 내게 두려움이 없나니 사람이 내게 어찌할꼬
    emotion_tags: [anxiety.tension]
    theme: courage
    note: >
      "사람이 내게 어찌할꼬" — 긴장의 실제 원인(대인·평가 상황)과 정확히
