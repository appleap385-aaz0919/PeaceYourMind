    verified_at: "2026-08-18"

  - id: psa.6.2
    ref: 시편 6:2
    text: >
      여호와여 내가 수척하였사오니 긍휼히 여기소서 여호와여 나의 뼈가 떨리오니
      나를 고치소서
    emotion_tags: [exhaustion.burnout]
    theme: lament
    note: >
      2026-08-19 추가. 이 화면은 rest 6 · renewal 4의 두 축뿐이었고 lament가 0이었다.
      **"쉬어도 된다"는 허가는 "내가 소진됐다"는 말이 먼저 있어야 성립하는데
      그 말을 할 자리가 없었다.**
      "내가 수척하였사오니 …나의 뼈가 떨리오니" — 소진의 신체 언어다.
      ⚠ "나를 고치소서"는 치유 요청이다. themes.yaml 전역 금지어 "치유"는
        **영상 제목 태깅 사전**에 적용되는 규칙이지 구절 본문에는 적용되지 않는다
        (themes.yaml 헤더 [채널 승인과 콘텐츠 태깅은 별개다]와 같은 층 구분).
      ⚠ 시 6:6이 frustration.suppressed에 있으나 다른 절·다른 화면이다.

    verified: true
    verified_by: verify_verses.py(krv1961@bluesaurel/Korean-Bible-1961-KRV#65cdce8)
    verified_at: "2026-08-19"
