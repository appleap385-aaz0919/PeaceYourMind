    verified: true
    verified_by: verify_verses.py(krv1961@bluesaurel/Korean-Bible-1961-KRV#65cdce8)
    verified_at: "2026-08-18"

  - id: psa.139.14
    ref: 시편 139:14
    text: >
      내가 주께 감사하옴은 나를 지으심이 신묘막측하심이라 주의 행사가 기이함을
      내 영혼이 잘 아나이다
    emotion_tags: [joy.grateful]
    theme: creation
    note: >
      2026-08-19 추가. 이 화면은 gratitude 6 · joy_praise 4의 두 축뿐이었다.
      "**나를 지으심이** 신묘막측하심이라" — 받은 것이 아니라 **존재 자체**에
      대한 감사라 거래가 될 수 없다. 헤더 방향("감사를 거래로 만들지 않는다")에
      가장 정확한 형태다.
      ⚠ 시편 139를 세 번째로 쓴다(139:1-2 suppressed · 139:7-8 lonely).

    verified: true
    verified_by: verify_verses.py(krv1961@bluesaurel/Korean-Bible-1961-KRV#65cdce8)
    verified_at: "2026-08-19"
  - id: psa.65.11
    ref: 시편 65:11
    text: >
      주의 은택으로 년사에 관 씌우시니 주의 길에는 기름이 떨어지며
    emotion_tags: [joy.grateful]
    theme: creation
    note: >
      2026-08-19 추가. "주의 은택으로 **년사에 관 씌우시니**" — 계절은 내가
      얻어낸 것이 아니다. 34자로 짧아 잔량을 5 → 6으로 올린다. 시편 65 신규.

    verified: true
    verified_by: verify_verses.py(krv1961@bluesaurel/Korean-Bible-1961-KRV#65cdce8)
    verified_at: "2026-08-19"
  - id: psa.145.15-16
    ref: 시편 145:15-16
    text: >
      중생의 눈이 주를 앙망하오니 주는 때를 따라 저희에게 식물을 주시며 손을
      펴사 모든 생물의 소원을 만족케 하시나이다
    emotion_tags: [joy.grateful]
    theme: creation
    note: >
      2026-08-19 추가. "**모든 생물의** 소원을 만족케 하시나이다" — 나만이
      아니라는 것이 감사를 거래에서 떼어 놓는다.
      ⚠ 시편 145를 세 번째로 쓴다(145:1-2 이 화면 · 145:9 anger.irritation).
        지금은 문제가 아니지만 마지막에 한 책·한 편 편중을 볼 때 자료가 된다.

    verified: true
    verified_by: verify_verses.py(krv1961@bluesaurel/Korean-Bible-1961-KRV#65cdce8)
    verified_at: "2026-08-19"
  - id: deu.8.10
    ref: 신명기 8:10
    text: >
      네가 먹어서 배불리고 네 하나님 여호와께서 옥토로 네게 주셨음을 인하여
      그를 찬송하리라
    emotion_tags: [joy.grateful]
    theme: gratitude
    note: >
      2026-08-19 추가. "네가 먹어서 배불리고 …그를 찬송하리라" — 일상의 감사.
      ⚠ 신 8:17("내 능과 내 손의 힘으로 내가 이 재물을 얻었다 할까 하노라")은
        joy.proud에서 제외된 구절이다. **같은 장이지만 방향이 반대다** —
        8:17은 경고이고 8:10은 감사다. 장이 같다는 이유로 묶지 않는다.

    verified: true
    verified_by: verify_verses.py(krv1961@bluesaurel/Korean-Bible-1961-KRV#65cdce8)
    verified_at: "2026-08-19"
  - id: psa.4.7
    ref: 시편 4:7
    text: >
      주께서 내 마음에 두신 기쁨은 저희의 곡식과 새 포도주의 풍성할 때보다
      더하니이다
    emotion_tags: [joy.grateful]
    theme: joy_praise
    note: >
      2026-08-19 추가. "주께서 내 마음에 두신 기쁨은 **저희의 곡식과 새 포도주의
      풍성할 때보다** 더하니이다" — 물질의 크기와 명시적으로 대비한다.
      4차분이 감사 구절에서 경계한 번영 프레임을 본문 자체가 밀어낸다.

    verified: true
    verified_by: verify_verses.py(krv1961@bluesaurel/Korean-Bible-1961-KRV#65cdce8)
