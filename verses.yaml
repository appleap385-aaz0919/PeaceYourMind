  - id: psa.90.17
    ref: 시편 90:17
    text: >
      주 우리 하나님의 은총을 우리에게 임하게 하사 우리 손의 행사를 우리에게
      견고케 하소서 우리 손의 행사를 견고케 하소서
    emotion_tags: [joy.proud]
    theme: gratitude
    note: >
      2026-08-19 추가. "**우리 손의 행사를** 우리에게 견고케 하소서" —
      손이 한 일을 인정한 채로 공을 돌린다. 이 화면 헤더가 제외한 유형
      (요 15:5 "아무 것도 할 수 없음이라" · 시 127:1 "수고가 헛되며")의
      **정반대 형태**이고 형통 어휘가 없다.
      ⚠ 이 화면은 11에서 멈췄다 — 아래 제외 기록 참조.
      [제외 기록] 같은 슬롯에서 뺀 것 —
        시 128:2   "네가 네 손이 수고한대로 먹을 것이라"까지는 맞으나
                   **"복되고 형통하리로다"가 붙는다.** 화면에 뜨는 것은 본문이라
                   note로 관리할 문제가 아니다. 뿌듯한 사용자에게 형통 약속은
                   정확히 번영신학 프레임이고, 4차분에서 수 1:8·시 1:3을
                   같은 이유로 뺀 기준이 그대로 적용된다.
        고전 15:58 뒷부분("너희 수고가 헛되지 않은 줄을 앎이니라")은 좋으나
                   **앞부분이 "항상 주의 일에 더욱 힘쓰는 자들이 되라"는 분발
                   요구**다. 사 30:18과 같은 구조이되 방향이 반대다 —
                   요구가 앞에 오고 위로가 뒤에 온다. 절 단위로 자를 수 없다.
        느 6:16    앞부분이 대적 서사("우리 모든 대적과 …두려워하여")다.

    verified: true
    verified_by: verify_verses.py(krv1961@bluesaurel/Korean-Bible-1961-KRV#65cdce8)
    verified_at: "2026-08-19"
