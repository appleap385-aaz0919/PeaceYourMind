  - id: psa.103.8
    ref: 시편 103:8
    text: >
      여호와는 자비로우시며 은혜로우시며 노하기를 더디 하시며 인자하심이
      풍부하시도다
    emotion_tags: [anger.irritation]
    theme: self_control
    note: >
      "노하기를 더디 하시며" — 잠언이 사용자에게 요구하는 바로 그 어휘를
      하나님의 성품으로 진술한다. 요구가 아니라 서술이라 정죄가 없다.
      이 세분류의 첫 후보.
    verified: true
    verified_by: verify_verses.py(krv1961@bluesaurel/Korean-Bible-1961-KRV#65cdce8)
    verified_at: "2026-08-18"

  - id: psa.103.13
    ref: 시편 103:13-14
    text: >
      아비가 자식을 불쌍히 여김 같이 여호와께서 자기를 경외하는 자를 불쌍히
      여기시나니 이는 저가 우리의 체질을 아시며 우리가 진토임을 기억하심이로다
    emotion_tags: [anger.irritation]
    theme: self_control
    note: >
      "우리의 체질을 아시며 우리가 진토임을 기억하심이로다" — 약함을
      아신다는 진술. 짜증을 낸 자신이 이해받는 방향이라 자책을 덜어낸다.
      13절만 쓰면 근거("이는 ... 아시며")가 없어 14절과 묶는다.
    verified: true
    verified_by: verify_verses.py(krv1961@bluesaurel/Korean-Bible-1961-KRV#65cdce8)
    verified_at: "2026-08-18"

  - id: exo.34.6
    ref: 출애굽기 34:6
    text: >
      여호와께서 그의 앞으로 지나시며 반포하시되 여호와로라 여호와로라 자비롭고
      은혜롭고 노하기를 더디하고 인자와 진실이 많은 하나님이로라
    emotion_tags: [anger.irritation]
    theme: self_control
    note: >
      하나님이 자기 이름을 반복해 선포하는 형식("여호와로라 여호와로라")
      이라 진술의 무게가 다르다. psa.103.8과 같은 계열의 원형.
    verified: true
    verified_by: verify_verses.py(krv1961@bluesaurel/Korean-Bible-1961-KRV#65cdce8)
    verified_at: "2026-08-18"

  - id: eph.4.26
    ref: 에베소서 4:26
    text: >
      분을 내어도 죄를 짓지 말며 해가 지도록 분을 품지 말고
    emotion_tags: [anger.irritation]
    theme: self_control
    note: >
      "분을 내어도" — 분노 자체를 허용하고 분노와 죄를 분리한다.
      분노를 죄로 규정하는 통념과 반대 방향이라 이 화면에 필요한 구절.
      뒤의 "죄를 짓지 말며"가 조건처럼 보이지만, 전제가 이미
      "분을 내어도"라 분노를 금지하지 않는다.
    verified: true
    verified_by: verify_verses.py(krv1961@bluesaurel/Korean-Bible-1961-KRV#65cdce8)
    verified_at: "2026-08-18"

