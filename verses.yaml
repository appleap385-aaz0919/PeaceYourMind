# =====================================================================
# [3차분 요약 — 2026-08-18]
#
#   anger.irritation 10 / anger.unfair 10 / anger.rage 10
#   frustration.stuck 10 / frustration.blocked 10 / frustration.suppressed 10
#   = 60구절. 누적 150구절. 본문 오류 0건 (2차분에 이어 두 번째).
#
# [이 차수의 핵심 난점 — 다음 차수도 참고할 것]
#   분노를 다루는 유명 구절 대부분이 화난 사람을 질책한다. 그대로 쓰면
#   감정을 판단하지 않는다는 선정 원칙 1이 통째로 무너진다.
#   해법은 어휘를 버리는 것이 아니라 화자를 바꾸는 것이었다 —
#   "너는 노하기를 더디 하라"(잠언)를 버리고
#   "여호와는 노하기를 더디 하시며"(시 103:8)를 취했다.
#   같은 어휘가 요구에서 서술로 바뀌면 정죄가 사라진다.
#
# [주제 해석을 바꾼 사례]
#   self_control 을 "억누름"이 아니라 "쏟아낼 자리를 준다"로 읽었다.
#   anger.rage 풀의 psa.62.8("마음을 토하라") · psa.142.2("원통함을 토하며")
#   · psa.55.1("응답하소서")이 그 결과다. 격분에 통제를 요구하면
#   짜증 화면보다 더 크게 어긋난다.
#
# [배분으로 정책을 구현한 사례]
#   anger.unfair 를 justice 5 / lament 3 / forgiveness 2 로 두었다.
#   themes.yaml mapping 순서(justice → lament → forgiveness)를 구절 수로도
#   반영한 것이다. 남긴 forgiveness 2건도 사용자에게 용서를 요구하지 않는
#   형식만 골랐다 (gen.50.20은 가해 인정 후의 말, luk.23.34는 예수의 기도).
#   마 6:14-15 · 골 3:13은 조건·위협·당위라 제외했다.
#
# [4차분에 넘기는 것]
#   isa.43.19("광야에 길과 사막에 강을 내리니")를 frustration.stuck에서
#   일부러 쓰지 않았다. themes.yaml이 new_thing intent에 이 구절을 지목했고
#   flutter.anticipation 매핑에 new_thing이 있어서다. 4차분에서 쓸 것.
#
# [길이 상한 미결 — 누적]
#   100자 초과 8건: isa.61.3(125) psa.13.1(124) rom.8.38(116)
#   isa.40.30(112) php.4.6(109) isa.42.16(105) isa.43.1(103) num.6.24(101)
#   카드 UI 실물이 나오는 Phase 3에서 상한을 정하고 일괄 재검토할 것.
# =====================================================================

# =====================================================================
# 4차분 — 긍정 계열 (joy.*, flutter.*, calm.ease, boredom.*) + crisis 전용
#
# [이 차수의 위험은 앞 차수와 다르다]
#   1~3차분의 위험은 "질책·요구가 얹히는 것"이었다.
#   여기서는 번영신학과 자기계발 톤이 위험이다 — themes.yaml 전역 금지어
#   (은혜·치유·축복·간증·기적)가 경고하는 그 영역이다.
#   감사·기쁨 구절은 "감사하면 복이 온다" 계열로 미끄러지기 쉬우므로,
#   감사의 근거를 받은 것이 아니라 하나님의 성품에 두는 구절을 우선한다.
#
# [교차 태깅 규칙 — 2026-08-18 확정, HANDOFF 3절]
#   1. emotion_tags는 원칙적으로 1개. 복수는 두 세분류 모두에서 명백히
#      대표 구절일 때만 예외로 허용하고 note에 근거를 남긴다
#   2. 영상 풀은 세분류의 mapping 주제만 사용한다. 구절의 theme으로
#      확장하지 않는다
#   3. 매핑 주제가 겹치는 세분류(joy.* 3개 등)는 태그가 아니라
#      구절 선정으로 성격을 가른다
#
# [절 합본 구간 주의 — 4차분 착수 중 발견]
#   개역한글은 시편 92:1-3처럼 여러 절을 나누지 않고 합쳐 싣는 구간이 있다
#   (대한성서공회 사이트도 "1-3"으로 표시). 데이터는 합본 본문을 각 절
#   번호에 복제해 절 수를 맞춘다. 전체 19개 구간.
#   범위 ref로 쓰면 문장이 반복되므로 수록하지 않는다 —
#   scripts/lib/krv_source.py가 RefError로 막는다. data/krv/SOURCE.md 참조.
# =====================================================================

