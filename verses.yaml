# =====================================================================
# [4차분 요약 — 2026-08-18] · [Phase 1 구절 큐레이션 완료]
#
#   joy.grateful 10 / joy.proud 10 / joy.delight 10
#   flutter.anticipation 10 / flutter.thrill 10
#   calm.ease 10 / calm.stable 10
#   boredom.dull 10 / boredom.novelty 10
#   + crisis 전용 10
#   = 90구절. 누적 250구절 (감정 240 + 위기 10). 본문 오류 0건 (3회 연속).
#
# [이 차수의 위험은 앞 차수와 달랐다]
#   1~3차분  질책·요구가 얹히는 것
#   4차분    번영신학·자기계발 톤
#   제외한 대표 사례:
#     수 1:8   "주야로 묵상하여 ... 네가 형통하리라"   (묵상 구절 중 최다 인용)
#     시 1:3   "그 행사가 다 형통하리로다"             (렘 17:7-8로 대체)
#     시 37:4  "네 마음의 소원을 이루어 주시리로다"    (설렘 화면에 직격)
#     엡 3:20  "구하는 것에 더 넘치도록"
#   감사 구절은 근거를 받은 것이 아니라 하나님의 성품에 두는 쪽으로 골랐다
#   (psa.107.1 "그는 선하시며 그 인자하심이 영원함이로다").
#
# [확정 규칙 3의 실증]
#   매핑 주제가 겹치는 세분류를 구절 선정으로 갈랐다. 지배 어휘가 갈린다:
#     joy.grateful    감사하라 · 은택 · 보답
#     joy.proud       여기까지 · 나의 나 된 것 · 자랑하리로다
#     joy.delight     뛰놀며 · 손바닥을 치고 · 춤 추며      (개인적 몸짓)
#     flutter.thrill  소리를 발하여 · 힘을 다하여 · 크게    (강도·볼륨)
#     boredom.dull    눈을 열어서 · 맛 · 꿀                 (다시 보게)
#     boredom.novelty 큰 광경 · 인물 나열 · 마음이 뜨겁지   (모르는 것으로)
#   주제를 공유해도 구절은 한 건도 겹치지 않는다. 4차분 신규 복수 태깅 0건.
#
# [원문 데이터 발견 — 절 합본 구간]
#   시편 92:1-3처럼 원문이 여러 절을 나누지 않고 합쳐 싣는 구간이 19개 있다
#   (대한성서공회 사이트도 "1-3"으로 표시). 데이터는 합본 본문을 각 절 번호에
#   복제해 절 수를 맞춘다. 범위 ref로 쓰면 문장이 반복되므로 수록하지 않는다.
#   krv_source.py가 RefError로 막고, 기존 구절은 전부 안전했다.
#   이 유형은 정답지 대조로도 옛 표기 분포로도 잡히지 않는다 — SOURCE.md 참조.
#
# [남은 판단 — Phase 3]
