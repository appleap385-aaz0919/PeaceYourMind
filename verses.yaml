      다른 계열에 교차 태깅하지 않는 이유가 그것이다.
    verified: true
    verified_by: verify_verses.py(krv1961@bluesaurel/Korean-Bible-1961-KRV#65cdce8)
    verified_at: "2026-08-18"

  - id: psa.103.1
    ref: 시편 103:1-2
    text: >
      내 영혼아 여호와를 송축하라 내 속에 있는 것들아 다 그 성호를 송축하라
      내 영혼아 여호와를 송축하며 그 모든 은택을 잊지 말찌어다
    emotion_tags: [joy.grateful]
    theme: gratitude
    note: >
      자기 영혼에게 하는 말이라 외부의 요구가 아니다.
      1절만 쓰면 "은택을 잊지 말찌어다"가 없어 2절과 묶는다.
      시편 103편에서 네 번째(1-2 grateful / 8·13-14 irritation / 9 rage /
      5 listless) — 전부 세분류가 다르다.
    verified: true
    verified_by: verify_verses.py(krv1961@bluesaurel/Korean-Bible-1961-KRV#65cdce8)
    verified_at: "2026-08-18"

  - id: psa.107.1
    ref: 시편 107:1
    text: >
