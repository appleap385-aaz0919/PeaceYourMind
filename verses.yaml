  # ═══════════════════════════════════════════════════════════
  # flutter.anticipation (기대·설렘) — 주제: new_thing, hope
  # 방향: 이 차수의 번영신학 위험이 가장 강한 세분류다 — 설렘은
  #      "잘 될 것"과 바로 붙어 있다. 사용자가 바라는 특정 결과를
  #      약속하는 구절은 전부 뺐다.
  #      새로움의 내용을 "하나님이 하시는 일"로 두는 구절(new_thing)과
  #      소망의 구조 자체를 말하는 구절(hope)로만 채웠다.
  #
  # [번영신학 톤으로 제외]
  #   시 37:4  "저가 네 마음의 소원을 이루어 주시리로다" — 이 화면에서는
  #            "원하는 게 이뤄진다"로 곧장 도착한다. themes.yaml이
  #            "기도응답"을 태깅 금지어로 둔 것과 같은 축이다
  #   엡 3:20  "구하는 것이나 생각하는 것에 더 넘치도록" — 기대를 부풀린다
  # ═══════════════════════════════════════════════════════════

