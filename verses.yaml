  # ═══════════════════════════════════════════════════════════
  # boredom.dull (지루함) — 주제: daily_word, bible_story
  # 방향: 다른 주제들은 감정에 응답하지만 이 둘은 진입점이다
  #      (themes.yaml intent: "가벼운 진입점", "지적 호기심 진입점").
  #      위로 구절이 아니라 읽을거리로 초대하는 구절을 고른다.
  #
  #      boredom.* 두 세분류는 themes.yaml 매핑 순서가 서로 반대다
  #      (dull은 daily_word 우선, novelty는 bible_story 우선).
  #      그 의도대로 dull은 daily_word 6, novelty는 bible_story 6으로 둔다.
  #
  # [제외 — 번영신학·훈계 톤]
  #   수 1:8    "주야로 묵상하여 ... 네가 형통하리라" — 묵상 구절 중 가장
  #             유명하지만 결말이 형통 약속이다. 이 차수 주요 위험에 정면
  #   딤후 3:16 "교훈과 책망과 바르게 함과" — 훈계 프레임이 먼저 온다
  #   히 4:12   "날선 어떤 검 ... 찔러 쪼개기까지" — 진입점 화면에 위협적 이미지
  #   고전 10:11 "경계로 기록하였느니라" — 경계 프레임
  # ═══════════════════════════════════════════════════════════

