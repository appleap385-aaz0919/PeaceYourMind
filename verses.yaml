#
#   [셀프 리뷰 결과] 표본 6구절 원문 대조 → 오류 3건 검출·정정:
#     isa.43.1  "이제" 1회 누락
#     psa.46.1  절 경계 오류 (3절 끝을 2절에 이어붙임) → 46:1 단독으로 정정
#     psa.46.10 현대 맞춤법화 ("알지어다" ← 원문 "알찌어다")
#   오류율 약 10%가 실측됐다. 나머지 24구절(verified: false)은 사용 전
#   전수 원문 대조가 필수다 — Claude Code에서 배치 대조 스크립트로 처리 권장.
#   특히 옛 표기(-ㄹ찌-, 잠간 등) 현대화 오류를 중점 확인할 것.
#
#   교차 태깅: 8구절이 인접 세분류에 걸침. 이때 구절의 theme이 해당 감정의
#   mapping 주제 밖일 수 있다 (예: anxiety.worry 화면에 theme=courage 구절).
