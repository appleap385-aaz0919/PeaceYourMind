  - id: psa.69.4
    ref: 시편 69:4
    text: >
      무고히 나를 미워하는 자가 내 머리털보다 많고 무리히 내 원수가 되어
      나를 끊으려 하는 자가 강하였으니 내가 취치 아니한 것도 물어 주게
      되었나이다
    emotion_tags: [anger.unfair]
    theme: lament
    note: >
      2026-08-19 추가. "**내가 취치 아니한 것도 물어 주게 되었나이다**" —
      하지 않은 일의 책임을 지는 것, 억울함의 핵심 상황이 문장에 그대로 있다.
      82자로 길지만 이 문장 때문에 골랐다.

