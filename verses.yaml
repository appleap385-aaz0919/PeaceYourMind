# =====================================================================
# verses.yaml — PYM 구절 큐레이션 소스 (Phase 1)
#
# 이 파일이 구절을 관리하는 유일한 곳이다. 빌드 스크립트(gen_verses_json.py,
# Phase 2에서 작성)가 이 파일에서 verses.json을 생성한다 — note 등
# 큐레이션 메타는 앱 번들에서 제거된다.
#
# [번역본] 개역한글(1961). PLAN.md 1절 확정 사항.
#   저작재산권은 보호기간 만료로 자유 사용 가능 — 대한성서공회 공식 FAQ 확인
#   (2026-08-18). 단 저작인격권 2가지를 준수해야 한다:
#   1. 동일성유지권 — 본문을 한 글자도 바꾸지 않는다. 축약·현대 맞춤법 교정 금지.
#      개역한글은 옛 표기를 쓴다: -ㄹ찌어다, -ㄹ찌라도, 잠간, 훤화 등.
#      현대 맞춤법으로 "고치는" 것이 곧 훼손이다. (실제로 1차 초안에서
#      "알찌어다"를 "알지어다"로 쓴 오류가 검출됐다)
#   2. 성명표시권 — 앱에 출처 표기: "성경전서 개역한글판, 대한성서공회"
#      (Phase 3에서 설정/정보 화면에 고정 표기)
#
# [검수 절차 — 중요]
#   text는 AI가 작성한 초안이다. 등록 전 반드시 개역한글 원문과 대조한다.
#   개역한글/개역개정은 표현이 미세하게 다르다 (예: 벧전 5:7 "권고하심이라"
#   vs "돌보심이라"). 두 번역이 섞이면 저작권 전제가 깨지므로 대조는
#   개역한글 원문 기준으로만 한다.
#   대조 완료 시 verified를 true로 바꾸고 verified_by / verified_at을 채운다.
#   빌드는 verified: false 구절을 포함하면 실패한다 (검수 없이 배포 불가).
#
# [선정 원칙]
#   1. 감정을 판단·질책하지 않는 구절 (FYM 감성 터치 원칙의 PYM 판)
#   2. 개역한글 문체로 읽어도 자연스러운 구절 우선
#   3. 당위 명령형("~하라")만으로 끝나는 구절은 약속·근거가 함께 있는 것 우선
#   4. proof-texting 경계 — 맥락에서 떼어내면 뜻이 왜곡되는 구절은 제외,
#      note에 선정 근거를 남긴다
#   5. 위기 화면용 구절은 이 파일이 아니라 crisis 전용 섹션에서 별도 관리
#      (Phase 1 후반, 죄·심판 프레임 배제 원칙 적용)
#
# [진행 현황]
#   1차분: 불안 계열 (anxiety.*) 30구절 — 검수 완료 (2026-08-18)
#   2차분: 우울·지침 계열 (sadness.*, exhaustion.*) 60구절 — 검수 완료 (2026-08-18)
#          6개 세분류 × 10구절. 본문은 타이핑하지 않고 원문에서 추출했다
#          (scripts/fill_verses.py — 아래 2차분 헤더 주석 참조)
#   3차분: 분노·답답함 계열 (anger.*, frustration.*) 60구절 — 검수 완료 (2026-08-18)
#   4차분: 기쁨·설렘·평온·심심함 계열 + crisis 전용 — 미착수
#          joy.* 3 · flutter.* 2 · calm.ease · boredom.* 2 = 8개 세분류
#          (calm.stable은 1차분 psa.4.8 교차 태깅으로 이미 1건 있다)
#   현재 150구절 / 24개 세분류 중 16개 완료 / 목표 약 250구절
# =====================================================================

version: "0.1.0"
translation: krv1961

verses:

  # ═══════════════════════════════════════════════════════════
  # anxiety.restless (초조함) — 주제: peace, quiet_worship
  # 방향: 초조함을 없애라고 하지 않고, 잠잠함·고요함으로 초대한다
  # ═══════════════════════════════════════════════════════════

  - id: jhn.14.27
    ref: 요한복음 14:27
    text: >
      평안을 너희에게 끼치노니 곧 나의 평안을 너희에게 주노라 내가 너희에게
      주는 것은 세상이 주는 것 같지 아니하니라 너희는 마음에 근심도 말고
      두려워하지도 말라
    emotion_tags: [anxiety.restless, anxiety.tension]
    theme: peace
    note: 서비스명(Peace Your Mind)과 직결되는 대표 구절. 초조함 화면의 첫 후보.
    verified: true
    verified_by: verify_verses.py(krv1961@bluesaurel/Korean-Bible-1961-KRV#65cdce8)
    verified_at: "2026-08-18"

  - id: isa.26.3
    ref: 이사야 26:3
    text: >
      주께서 심지가 견고한 자를 평강에 평강으로 지키시리니 이는 그가 주를
      의뢰함이니이다
    emotion_tags: [anxiety.restless]
    theme: peace
    note: '"평강에 평강으로" — 개역한글 특유의 리듬이 살아 있는 구절.'
    verified: true
    verified_by: verify_verses.py(krv1961@bluesaurel/Korean-Bible-1961-KRV#65cdce8)
    verified_at: "2026-08-18"

  - id: php.4.6
    ref: 빌립보서 4:6-7
    text: >
      아무 것도 염려하지 말고 오직 모든 일에 기도와 간구로, 너희 구할 것을
      감사함으로 하나님께 아뢰라 그리하면 모든 지각에 뛰어난 하나님의 평강이
      그리스도 예수 안에서 너희 마음과 생각을 지키시리라
    emotion_tags: [anxiety.restless, anxiety.worry]
    theme: peace
    note: >
      6절 단독은 명령형으로 끝나 7절(약속)과 반드시 묶는다 — 선정 원칙 3.
    verified: true
    verified_by: verify_verses.py(krv1961@bluesaurel/Korean-Bible-1961-KRV#65cdce8)
    verified_at: "2026-08-18"

  - id: psa.94.19
    ref: 시편 94:19
    text: >
      내 속에 생각이 많을 때에 주의 위안이 내 영혼을 즐겁게 하시나이다
    emotion_tags: [anxiety.restless]
    theme: peace
    note: >
      "생각이 많을 때" — 초조함의 실제 언어와 정확히 겹친다. 자연어 입력
      "생각이 너무 많아"와 직결되는 드문 구절. 강력 추천.
    verified: true
    verified_by: verify_verses.py(krv1961@bluesaurel/Korean-Bible-1961-KRV#65cdce8)
    verified_at: "2026-08-18"

  - id: psa.131.2
    ref: 시편 131:2
    text: >
      실로 내가 내 심령으로 고요하고 평온케 하기를 젖 뗀 아이가 그 어미 품에
      있음 같게 하였나니 내 중심이 젖 뗀 아이와 같도다
    emotion_tags: [anxiety.restless]
    theme: peace
    note: 이미지(어미 품의 아이)가 위로의 톤을 만든다. 개역한글 문체 검수 필요.
    verified: true
    verified_by: 웹 원문 대조 (bible.com KRV)
    verified_at: \"2026-08-18\"

  - id: psa.62.1
    ref: 시편 62:1
    text: >
      나의 영혼이 잠잠히 하나님만 바람이여 나의 구원이 그에게서 나는도다
    emotion_tags: [anxiety.restless]
    theme: quiet_worship
    note: '"잠잠히" — 잔잔한 찬양 주제와 자연스럽게 연결.'
    verified: true
    verified_by: verify_verses.py(krv1961@bluesaurel/Korean-Bible-1961-KRV#65cdce8)
    verified_at: "2026-08-18"

  - id: psa.46.10
    ref: 시편 46:10
    text: >
      이르시기를 너희는 가만히 있어 내가 하나님 됨을 알찌어다 내가 열방과
      세계 중에서 높임을 받으리라 하시도다
    emotion_tags: [anxiety.restless]
    theme: peace
    note: >
      "가만히 있어" — 무언가 해야 할 것 같은 초조함에 대한 직접 응답.
      [검수 이력] 초안 "알지어다"(현대 표기) → 원문 "알찌어다"로 정정 (2026-08-18)
    verified: true
    verified_by: 웹 원문 대조 (bible.com KRV + 대한성서공회)
    verified_at: "2026-08-18"

  - id: psa.4.8
    ref: 시편 4:8
    text: >
      내가 평안히 눕고 자기도 하리니 나를 안전히 거하게 하시는 이는 오직
      여호와시니이다
    emotion_tags: [anxiety.restless, calm.stable]
    theme: peace
    note: 밤·잠들기 전 사용 맥락에 맞는 구절. 시간대별 노출 아이디어(Phase 3)와 연결 가능.
    verified: true
    verified_by: verify_verses.py(krv1961@bluesaurel/Korean-Bible-1961-KRV#65cdce8)
    verified_at: "2026-08-18"

  - id: mrk.4.39
    ref: 마가복음 4:39
    text: >
      예수께서 깨어 바람을 꾸짖으시며 바다더러 이르시되 잠잠하라 고요하라
      하시니 바람이 그치고 아주 잔잔하여지더라
    emotion_tags: [anxiety.restless, anxiety.tension]
    theme: peace
    note: >
      서사 구절(풍랑 진압). 교리 진술이 아닌 장면 묘사라 감정 화면에서
      이미지로 작동한다. 서사 구절 사용의 선례로 검토 요망.
    verified: true
    verified_by: verify_verses.py(krv1961@bluesaurel/Korean-Bible-1961-KRV#65cdce8)
    verified_at: "2026-08-18"

  - id: isa.30.15
    ref: 이사야 30:15
    text: >
      주 여호와 이스라엘의 거룩하신 자가 말씀하시되 너희가 돌이켜 안연히
      처하여야 구원을 얻을 것이요 잠잠하고 신뢰하여야 힘을 얻을 것이어늘
      너희가 원치 아니하고
    emotion_tags: [anxiety.restless]
    theme: peace
    note: >
      [검토 필요] 후반부 "너희가 원치 아니하고"는 책망 맥락이다.
      전반부만 쓰면 proof-texting(선정 원칙 4), 전체를 쓰면 톤이 꺾인다.
      제외 쪽으로 기울지만 판단을 남긴다.
    verified: true
    verified_by: verify_verses.py(krv1961@bluesaurel/Korean-Bible-1961-KRV#65cdce8)
    verified_at: "2026-08-18"

  # ═══════════════════════════════════════════════════════════
  # anxiety.worry (걱정) — 주제: trust, peace
  # 방향: 걱정의 대상을 붙들고 있는 손을 펴게 한다 (맡김)
  # ═══════════════════════════════════════════════════════════

  - id: 1pe.5.7
    ref: 베드로전서 5:7
    text: >
      너희 염려를 다 주께 맡겨 버리라 이는 저가 너희를 권고하심이니라
    emotion_tags: [anxiety.worry]
    theme: trust
    note: >
      맡김 주제의 대표 구절. 개역한글은 "권고하심"(돌보심의 옛말) —
      필요 시 화면에 짧은 낱말 풀이를 붙이는 옵션 검토 (Phase 3).
    verified: true
    verified_by: 웹 원문 대조 (bible.com KRV)
    verified_at: \"2026-08-18\"

  - id: mat.6.34
    ref: 마태복음 6:34
    text: >
      그러므로 내일 일을 위하여 염려하지 말라 내일 일은 내일 염려할 것이요
      한 날 괴로움은 그 날에 족하니라
    emotion_tags: [anxiety.worry]
    theme: trust
    note: '"한 날 괴로움은 그 날에 족하니라" — 걱정의 시간 범위를 오늘로 줄여주는 구절.'
    verified: true
    verified_by: verify_verses.py(krv1961@bluesaurel/Korean-Bible-1961-KRV#65cdce8)
    verified_at: "2026-08-18"

  - id: mat.6.26
    ref: 마태복음 6:26
    text: >
      공중의 새를 보라 심지도 않고 거두지도 않고 창고에 모아 들이지도
      아니하되 너희 천부께서 기르시나니 너희는 이것들보다 귀하지 아니하냐
    emotion_tags: [anxiety.worry]
    theme: trust
    note: 자연 이미지 + "귀하지 아니하냐"의 존재 긍정. creation 주제와도 접점.
    verified: true
    verified_by: verify_verses.py(krv1961@bluesaurel/Korean-Bible-1961-KRV#65cdce8)
    verified_at: "2026-08-18"

  - id: psa.55.22
    ref: 시편 55:22
    text: >
      네 짐을 여호와께 맡겨 버리라 너를 붙드시고 의인의 요동함을 영영히
      허락지 아니하시리로다
    emotion_tags: [anxiety.worry, frustration.blocked]
    theme: trust
    note: '"짐" 메타포 — 걱정을 무게로 경험하는 사용자 언어와 맞닿는다.'
    verified: true
    verified_by: verify_verses.py(krv1961@bluesaurel/Korean-Bible-1961-KRV#65cdce8)
    verified_at: "2026-08-18"

  - id: pro.3.5
    ref: 잠언 3:5-6
    text: >
      너는 마음을 다하여 여호와를 의뢰하고 네 명철을 의지하지 말라 너는
      범사에 그를 인정하라 그리하면 네 길을 지도하시리라
    emotion_tags: [anxiety.worry, frustration.stuck]
    theme: trust
    note: guidance 주제와 걸치는 구절 — 걱정과 막막함 양쪽에서 쓸 수 있다.
    verified: true
    verified_by: verify_verses.py(krv1961@bluesaurel/Korean-Bible-1961-KRV#65cdce8)
    verified_at: "2026-08-18"

  - id: psa.37.5
    ref: 시편 37:5
    text: >
      너의 길을 여호와께 맡기라 저를 의지하면 저가 이루시고
    emotion_tags: [anxiety.worry]
    theme: trust
    note: 짧고 명료 — 카드 UI에서 첫 화면 후보.
    verified: true
    verified_by: verify_verses.py(krv1961@bluesaurel/Korean-Bible-1961-KRV#65cdce8)
    verified_at: "2026-08-18"

  - id: psa.121.1
    ref: 시편 121:1-2
    text: >
      내가 산을 향하여 눈을 들리라 나의 도움이 어디서 올꼬 나의 도움이
      천지를 지으신 여호와에게서로다
    emotion_tags: [anxiety.worry, frustration.stuck]
    theme: trust
    note: 질문("어디서 올꼬")으로 시작해 답으로 끝나는 구조 — 걱정의 내적 대화와 닮았다.
    verified: true
    verified_by: verify_verses.py(krv1961@bluesaurel/Korean-Bible-1961-KRV#65cdce8)
    verified_at: "2026-08-18"

  - id: psa.23.1
    ref: 시편 23:1
    text: >
      여호와는 나의 목자시니 내가 부족함이 없으리로다
    emotion_tags: [anxiety.worry]
    theme: trust
    note: 가장 널리 알려진 구절 — 비신자 사용자에게도 진입 장벽이 낮다.
    verified: true
    verified_by: verify_verses.py(krv1961@bluesaurel/Korean-Bible-1961-KRV#65cdce8)
    verified_at: "2026-08-18"

  - id: php.4.19
    ref: 빌립보서 4:19
    text: >
      나의 하나님이 그리스도 예수 안에서 영광 가운데 그 풍성한대로 너희
      모든 쓸 것을 채우시리라
    emotion_tags: [anxiety.worry]
    theme: trust
    note: >
      [검토 필요] 공급 약속 구절 — 번영신학 오용이 많은 구절이다.
      생계 걱정 맥락에서는 정당한 위로이지만, 전역 금지어(축복) 원칙과의
      일관성 관점에서 포함 여부 판단 요망.
    verified: true
    verified_by: verify_verses.py(krv1961@bluesaurel/Korean-Bible-1961-KRV#65cdce8)
    verified_at: "2026-08-18"

  - id: psa.56.3
    ref: 시편 56:3
    text: >
      내가 두려워하는 날에는 주를 의지하리이다
    emotion_tags: [anxiety.worry, anxiety.tension]
    theme: trust
    note: >
      두려움을 부정하지 않는다("두려워하는 날에는") — 감정 판단 없음
      원칙의 모범 구절. 한 문장이라 카드 UI 최적.
    verified: true
    verified_by: verify_verses.py(krv1961@bluesaurel/Korean-Bible-1961-KRV#65cdce8)
    verified_at: "2026-08-18"

  # ═══════════════════════════════════════════════════════════
  # anxiety.tension (긴장) — 주제: courage, peace
  # 방향: 긴장을 풀라고 하지 않고, 함께하심을 근거로 담대함을 준다
  # ═══════════════════════════════════════════════════════════

  - id: isa.41.10
    ref: 이사야 41:10
    text: >
      두려워 말라 내가 너와 함께 함이니라 놀라지 말라 나는 네 하나님이
      됨이니라 내가 너를 굳세게 하리라 참으로 너를 도와 주리라 참으로 나의
