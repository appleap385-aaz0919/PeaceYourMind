  - id: isa.43.2
    ref: 이사야 43:2
    text: >
      네가 물 가운데로 지날 때에 내가 함께할 것이라 강을 건널 때에 물이
      너를 침몰치 못할 것이며 네가 불 가운데로 행할 때에 타지도 아니할
      것이요 불꽃이 너를 사르지도 못하리니
    emotion_tags: [sadness.loss]
    theme: presence
    note: >
      2026-08-19 추가. presence 축이 0이었다(comfort 5 · renewal 5의 두 축뿐).
      "네가 물 가운데로 지날 때에 내가 함께할 것이라" — **통과**의 이미지라
      "이제 그만"이 아니다. 헤더 방향("회복을 말하되 이제 그만이라고 하지
      않는다")과 맞는다.
      사 43:1이 이미 sadness.lonely·anxiety.tension에 있으나 그쪽은 courage
      축("두려워 말라")이고 이 절은 동행이라 결이 다르다.

