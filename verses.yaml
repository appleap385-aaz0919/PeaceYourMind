# [3차분 요약 — 2026-08-18]
#
#   anger.irritation 10 / anger.unfair 10 / anger.rage 10
#   frustration.stuck 10 / frustration.blocked 10 / frustration.suppressed 10
#   = 60구절. 누적 150구절. 본문 오류 0건 (2차분에 이어 두 번째).
#
# [이 차수의 핵심 난점 — 다음 차수도 참고할 것]
#   분노를 다루는 유명 구절 대부분이 화난 사람을 질책한다. 그대로 쓰면
#   감정을 판단하지 않는다는 선정 원칙 1이 통째로 무너진다.
#   해법은 어휘를 버리는 것이 아니라 화자를 바꾸는 것이었다 —
#   "너는 노하기를 더디 하라"(잠언)를 버리고
#   "여호와는 노하기를 더디 하시며"(시 103:8)를 취했다.
#   같은 어휘가 요구에서 서술로 바뀌면 정죄가 사라진다.
#
# [주제 해석을 바꾼 사례]
#   self_control 을 "억누름"이 아니라 "쏟아낼 자리를 준다"로 읽었다.
#   anger.rage 풀의 psa.62.8("마음을 토하라") · psa.142.2("원통함을 토하며")
#   · psa.55.1("응답하소서")이 그 결과다. 격분에 통제를 요구하면
#   짜증 화면보다 더 크게 어긋난다.
#
# [배분으로 정책을 구현한 사례]
#   anger.unfair 를 justice 5 / lament 3 / forgiveness 2 로 두었다.
#   themes.yaml mapping 순서(justice → lament → forgiveness)를 구절 수로도
#   반영한 것이다. 남긴 forgiveness 2건도 사용자에게 용서를 요구하지 않는
#   형식만 골랐다 (gen.50.20은 가해 인정 후의 말, luk.23.34는 예수의 기도).
#   마 6:14-15 · 골 3:13은 조건·위협·당위라 제외했다.
#
# [4차분에 넘기는 것]
#   isa.43.19("광야에 길과 사막에 강을 내리니")를 frustration.stuck에서
#   일부러 쓰지 않았다. themes.yaml이 new_thing intent에 이 구절을 지목했고
#   flutter.anticipation 매핑에 new_thing이 있어서다. 4차분에서 쓸 것.
