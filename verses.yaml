  # ═══════════════════════════════════════════════════════════
  # joy.proud (뿌듯함) — 주제: gratitude, joy_praise
  # 방향: 뿌듯함을 부정하지 않으면서 공을 돌린다.
  #      공을 돌리는 구절 중 상당수가 성취 자체를 부정한다
  #      (요 15:5 "아무 것도 할 수 없음이라", 시 127:1 "수고가 헛되며",
  #       시 44:3 "자기 칼로 ... 아니요", 신 8:17 "두렵건대").
  #      뿌듯한 사용자에게는 찬물이라 전부 제외했다 — 선정 원칙 1.
  #
  # [joy.* 3개 세분류를 가르는 방식 — 확정 규칙 3]
  #   grateful  감사 어휘 중심 (감사하라 · 은택 · 보답)
  #   proud     공을 돌리는 방향 (여기까지 · 나의 나 된 것 · 자랑하리로다)
  #   delight   기쁨 · 즐거움 어휘 중심
  #   매핑 주제가 같아도 태그가 아니라 구절로 성격을 가른다
  # ═══════════════════════════════════════════════════════════

  - id: 1sa.7.12
    ref: 사무엘상 7:12
    text: >
      사무엘이 돌을 취하여 미스바와 센 사이에 세워 가로되 여호와께서 여기까지
      우리를 도우셨다 하고 그 이름을 에벤에셀이라 하니라
    emotion_tags: [joy.proud]
    theme: gratitude
    note: >
      "여호와께서 여기까지 우리를 도우셨다" — "여기까지 왔다"가 뿌듯함의
      언어와 정확히 겹친다. 돌을 세워 표시하는 행위 자체가 성취를 기념하는
      방식이라 감정을 축소하지 않는다. 서사 구절.
    verified: true
    verified_by: verify_verses.py(krv1961@bluesaurel/Korean-Bible-1961-KRV#65cdce8)
    verified_at: "2026-08-18"

  - id: 1co.15.10
    ref: 고린도전서 15:10
    text: >
      그러나 나의 나 된 것은 하나님의 은혜로 된 것이니 내게 주신 그의
      은혜가 헛되지 아니하여 내가 모든 사도보다 더 많이 수고하였으나 내가
      아니요 오직 나와 함께하신 하나님의 은혜로라
    emotion_tags: [joy.proud]
    theme: gratitude
    note: >
      이 세분류의 기준 구절. "내가 모든 사도보다 더 많이 수고하였으나"로
      자기 수고를 명시한 뒤 "내가 아니요 오직 나와 함께하신"으로 넘어간다.
      성취를 깎지 않으면서 공을 돌리는 유일한 구조라 101자 길이를 감수했다.
    verified: true
    verified_by: verify_verses.py(krv1961@bluesaurel/Korean-Bible-1961-KRV#65cdce8)
    verified_at: "2026-08-18"

  - id: php.2.13
    ref: 빌립보서 2:13
    text: >
      너희 안에서 행하시는 이는 하나님이시니 자기의 기쁘신 뜻을 위하여 너희로
      소원을 두고 행하게 하시나니
    emotion_tags: [joy.proud]
    theme: gratitude
    note: '"너희 안에서 행하시는 이는" — 내가 한 일 밖이 아니라 안에서 일하셨다는 구조.'
    verified: true
    verified_by: verify_verses.py(krv1961@bluesaurel/Korean-Bible-1961-KRV#65cdce8)
    verified_at: "2026-08-18"

  - id: psa.115.1
    ref: 시편 115:1
    text: >
      여호와여 영광을 우리에게 돌리지 마옵소서 우리에게 돌리지 마옵소서 오직
      주의 인자하심과 진실하심을 인하여 주의 이름에 돌리소서
    emotion_tags: [joy.proud]
    theme: gratitude
    note: >
      "영광을 우리에게 돌리지 마옵소서" — 화자가 스스로 하는 고백이라
      사용자에게 겸손을 요구하는 형식이 아니다.
    verified: true
    verified_by: verify_verses.py(krv1961@bluesaurel/Korean-Bible-1961-KRV#65cdce8)
    verified_at: "2026-08-18"

  - id: jas.1.17
    ref: 야고보서 1:17
    text: >
      각양 좋은 은사와 온전한 선물이 다 위로부터 빛들의 아버지께로서
      내려오나니 그는 변함도 없으시고 회전하는 그림자도 없으시니라
    emotion_tags: [joy.proud]
    theme: gratitude
    note: 좋은 것의 출처를 부드럽게 짚는다. 성취를 언급조차 하지 않아 부정할 여지가 없다.
    verified: true
    verified_by: verify_verses.py(krv1961@bluesaurel/Korean-Bible-1961-KRV#65cdce8)
    verified_at: "2026-08-18"

  - id: psa.71.16
    ref: 시편 71:16
    text: >
      내가 주 여호와의 능하신 행적을 가지고 오겠사오며 주의 의 곧 주의 의만
      진술하겠나이다
    emotion_tags: [joy.proud]
    theme: gratitude
    note: '"주의 의만 진술하겠나이다" — 무엇을 말할지 스스로 정하는 형식. 48자.'
    verified: true
    verified_by: verify_verses.py(krv1961@bluesaurel/Korean-Bible-1961-KRV#65cdce8)
    verified_at: "2026-08-18"

  - id: psa.126.3
    ref: 시편 126:3
    text: >
      여호와께서 우리를 위하여 대사를 행하셨으니 우리는 기쁘도다
    emotion_tags: [joy.proud]
    theme: joy_praise
    note: >
      "우리는 기쁘도다" — 뿌듯함이 기쁨으로 이어진다. 32자.
      psa.126.5(sorrow, "눈물을 흘리며 씨를 뿌리는 자")와 같은 시편의
      앞쪽이라, 눈물에서 기쁨으로 가는 흐름이 한 시편 안에 있다.
    verified: true
    verified_by: verify_verses.py(krv1961@bluesaurel/Korean-Bible-1961-KRV#65cdce8)
    verified_at: "2026-08-18"

  - id: psa.118.23
    ref: 시편 118:23
    text: >
      이는 여호와의 행하신 것이요 우리 눈에 기이한 바로다
    emotion_tags: [joy.proud]
    theme: joy_praise
    note: '"우리 눈에 기이한 바로다" — 성취를 자기 평가가 아니라 놀라움으로 받는다. 29자.'
    verified: true
    verified_by: verify_verses.py(krv1961@bluesaurel/Korean-Bible-1961-KRV#65cdce8)
    verified_at: "2026-08-18"

  - id: psa.92.4
    ref: 시편 92:4
    text: >
      여호와여 주의 행사로 나를 기쁘게 하셨으니 주의 손의 행사를 인하여 내가
