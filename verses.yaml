    verified_by: verify_verses.py(krv1961@bluesaurel/Korean-Bible-1961-KRV#65cdce8)
    verified_at: "2026-08-18"

  - id: psa.46.1
    ref: 시편 46:1
    text: >
      하나님은 우리의 피난처시요 힘이시니 환난 중에 만날 큰 도움이시라
    emotion_tags: [anxiety.tension]
    theme: courage
    note: >
      "피난처" 메타포 — 압도되는 상황의 언어.
      [검수 이력] 초안은 46:1-2로 잡고 3절 끝("우리는 두려워 아니하리로다")을
      2절에 이어붙였다 — 절 경계 오류. 1절 단독으로 정정 (2026-08-18).
      1~3절 전체 수록안은 "요동할찌라도"의 옛 표기 포함 원문 그대로일 때만 가능.
    verified: true
    verified_by: 웹 원문 대조 (bible.com KRV + 대한성서공회)
    verified_at: "2026-08-18"

  - id: isa.43.1
    ref: 이사야 43:1
    text: >
      야곱아 너를 창조하신 여호와께서 이제 말씀하시느니라 이스라엘아 너를
      조성하신 자가 이제 말씀하시느니라 너는 두려워 말라 내가 너를
      구속하였고 내가 너를 지명하여 불렀나니 너는 내 것이라
    emotion_tags: [anxiety.tension, sadness.lonely]
    theme: courage
    note: >
      "지명하여 불렀나니" — 익명의 긴장(군중 속 나) 반대편의 언어.
      love 주제와도 접점. 길어도 축약 불가(동일성유지권).
      [검수 이력] 초안에서 두 번째 "이제" 누락 → 원문 대조로 보정 (2026-08-18)
    verified: true
    verified_by: 웹 원문 대조 (bible.com KRV + 대한성서공회)
    verified_at: "2026-08-18"

