# =====================================================================
# [1차분 요약 — 2026-08-18 셀프 리뷰 반영]
#   anxiety.restless 10 / anxiety.worry 10 / anxiety.tension 10 = 30구절
#   검토 필요 표시: isa.30.15 (책망 맥락 — 제외 권고), php.4.19 (번영신학 오용 우려)
#
#   [셀프 리뷰 결과] 표본 6구절 원문 대조 → 오류 3건 검출·정정:
#     isa.43.1  "이제" 1회 누락
#     psa.46.1  절 경계 오류 (3절 끝을 2절에 이어붙임) → 46:1 단독으로 정정
#     psa.46.10 현대 맞춤법화 ("알지어다" ← 원문 "알찌어다")
#   오류율 약 10%가 실측됐다. 나머지 24구절(verified: false)은 사용 전
#   전수 원문 대조가 필수다 — Claude Code에서 배치 대조 스크립트로 처리 권장.
#   특히 옛 표기(-ㄹ찌-, 잠간 등) 현대화 오류를 중점 확인할 것.
#
#   교차 태깅: 8구절이 인접 세분류에 걸침. 이때 구절의 theme이 해당 감정의
#   mapping 주제 밖일 수 있다 (예: anxiety.worry 화면에 theme=courage 구절).
#   [설계 결정 필요] 영상 풀을 "mapping 주제 ∪ 표시된 구절의 theme"으로
#   확장할지, 구절을 mapping 주제 안으로 제한할지 — Phase 2 배치 설계 전 확정
# =====================================================================

# =====================================================================
# 2차분 — 우울·지침 계열 (sadness.*, exhaustion.*)
#
# [작업 방식 — 1차분과 다르다]
#   구절 선정은 ref(장절)까지만 하고, text는 타이핑하지 않는다.
#   scripts/fill_verses.py 가 data/krv 원문에서 추출해 채운다.
#   근거: 1차분 30건 중 8건(27%)이 본문 오류였고 전부 기억에 의존해 쓴
#   초안에서 나왔다. 유형이 쉼표·띄어쓰기·조사·옛 표기라 눈으로 읽어서는
#   걸리지 않는다. 추출한 문자열은 정의상 원문과 같다.
#   자세한 경위는 HANDOFF.md 3절.
# =====================================================================

