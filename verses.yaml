  - id: heb.6.19
    ref: 히브리서 6:19
    text: >
      우리가 이 소망이 있는 것은 영혼의 닻 같아서 튼튼하고 견고하여 휘장
      안에 들어 가나니
    emotion_tags: [frustration.blocked]
    theme: hope
    note: >
      "영혼의 닻 같아서" — 멈춰 있는 상태와 닻의 이미지가 겹친다.
      움직이지 못하는 것이 표류가 아니라는 방향. heb.4.9(tired)와 같은 서신.
    verified: true
    verified_by: verify_verses.py(krv1961@bluesaurel/Korean-Bible-1961-KRV#65cdce8)
    verified_at: "2026-08-18"

  - id: psa.90.15
    ref: 시편 90:15
    text: >
      우리를 곤고케 하신 날수대로와 우리의 화를 당한 년수대로 기쁘게 하소서
    emotion_tags: [frustration.blocked]
