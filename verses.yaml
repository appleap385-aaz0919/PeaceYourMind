      이로써 시편 23편은 1·2·3·4·6절이 쓰인다
      (1 trust / 2 rest / 3 quiet_worship / 4 comfort / 6 quiet_worship).
      3절과 6절은 주제가 같지만 세분류가 달라(anger.irritation / calm.ease)
      같은 화면에 겹치지 않는다.
    verified: true
    verified_by: verify_verses.py(krv1961@bluesaurel/Korean-Bible-1961-KRV#65cdce8)
    verified_at: "2026-08-18"

  - id: psa.27.4
