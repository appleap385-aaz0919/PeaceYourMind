  - id: psa.40.1
    ref: 시편 40:1-2
    text: >
      내가 여호와를 기다리고 기다렸더니 귀를 기울이사 나의 부르짖음을
      들으셨도다 나를 기가 막힐 웅덩이와 수렁에서 끌어 올리시고 내 발을 반석
      위에 두사 내 걸음을 견고케 하셨도다
    emotion_tags: [exhaustion.listless]
    theme: hope
    note: >
      "기가 막힐 웅덩이와 수렁" — 무기력의 신체 감각과 겹치는 이미지.
      1절만 쓰면 건져냄이 없어 2절과 묶는다.
      [제외 기록] 이 세분류에서 뺀 구절과 이유 —
        빌 4:13  "내가 모든 것을 할 수 있느니라". themes.yaml의 strength
                 intent가 직접 지목한 구절이지만, 아무것도 할 수 없는 상태에서
                 읽으면 자신의 현재가 반증으로 보인다. 주제의 intent는 방향을
                 정하는 것이고 개별 구절 채택은 별개 판단이라고 보았다.
                 (themes.yaml은 수정하지 않았다 — 2차분 범위 밖)
        갈 6:9   "선을 행하되 ... 피곤하지 아니하면"이 행위 조건.
        고후 12:9 "약한 것들을 자랑하리니"가 무기력 상태에는 고차원이다.
    verified: true
    verified_by: verify_verses.py(krv1961@bluesaurel/Korean-Bible-1961-KRV#65cdce8)
