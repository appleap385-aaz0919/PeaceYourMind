    emotion_tags: [sadness.sorrow]
    theme: comfort
    note: >
      애통을 고쳐야 할 결함이 아니라 복으로 뒤집는다. 슬픔에 머무는 것을
      허용하는 방향이라 comfort 주제의 축과 맞는다.
    verified: true
    verified_by: verify_verses.py(krv1961@bluesaurel/Korean-Bible-1961-KRV#65cdce8)
    verified_at: "2026-08-18"

  - id: psa.56.8
    ref: 시편 56:8
    text: >
      나의 유리함을 주께서 계수하셨으니 나의 눈물을 주의 병에 담으소서 이것이
      주의 책에 기록되지 아니하였나이까
    emotion_tags: [sadness.sorrow]
    theme: lament
    note: >
      눈물이 계수되고 기록된다는 이미지. 탄식이되 슬픔을 미화하지 않는다 —
      themes.yaml의 lament 원칙("감정 증폭이 아니라 말해도 된다는 허용").
    verified: true
    verified_by: verify_verses.py(krv1961@bluesaurel/Korean-Bible-1961-KRV#65cdce8)
    verified_at: "2026-08-18"

  - id: psa.31.9
    ref: 시편 31:9
    text: >
      여호와여 내 고통을 인하여 나를 긍휼히 여기소서 내가 근심으로 눈과 혼과
      몸이 쇠하였나이다
    emotion_tags: [sadness.sorrow]
    theme: lament
    note: >
      "눈과 혼과 몸이 쇠하였나이다" — 슬픔의 신체화를 그대로 말한다.
      해결을 제시하지 않는 탄식 구절이라 lament 풀의 성격을 규정한다.
    verified: true
    verified_by: verify_verses.py(krv1961@bluesaurel/Korean-Bible-1961-KRV#65cdce8)
    verified_at: "2026-08-18"

  - id: psa.42.5
    ref: 시편 42:5
    text: >
      내 영혼아 네가 어찌하여 낙망하며 어찌하여 내 속에서 불안하여 하는고
      너는 하나님을 바라라 그 얼굴의 도우심을 인하여 내가 오히려 찬송하리로다
    emotion_tags: [sadness.sorrow, sadness.lonely]
    theme: hope
    note: >
      낙망을 부정하지 않으면서 소망으로 향하는 구절 — 우울 계열 대표.
      PLAN.md 4.1의 verses.json 스키마 예시에 쓰인 구절이다.
    verified: true
    verified_by: verify_verses.py(krv1961@bluesaurel/Korean-Bible-1961-KRV#65cdce8)
    verified_at: "2026-08-18"

  - id: jhn.16.22
    ref: 요한복음 16:22
    text: >
      지금은 너희가 근심하나 내가 다시 너희를 보리니 너희 마음이 기쁠 것이요
      너희 기쁨을 빼앗을 자가 없느니라
    emotion_tags: [sadness.sorrow]
    theme: hope
    note: >
      "지금은 너희가 근심하나"로 현재 감정을 먼저 인정하고 약속이 뒤따른다 —
      선정 원칙 3 충족.
    verified: true
    verified_by: verify_verses.py(krv1961@bluesaurel/Korean-Bible-1961-KRV#65cdce8)
    verified_at: "2026-08-18"

  - id: lam.3.22
    ref: 예레미야애가 3:22-23
    text: >
      여호와의 자비와 긍휼이 무궁하시므로 우리가 진멸되지 아니함이니이다 이것이
      아침마다 새로우니 주의 성실이 크도소이다
    emotion_tags: [sadness.sorrow]
    theme: hope
    note: >
      탄식서 한복판의 소망 구절. 22절만 쓰면 문장이 끝나지 않아 23절과 묶는다
      (선정 원칙 3과 같은 이유 — 약속이 뒤에 온다).
    verified: true
    verified_by: verify_verses.py(krv1961@bluesaurel/Korean-Bible-1961-KRV#65cdce8)
    verified_at: "2026-08-18"

  - id: psa.126.5
    ref: 시편 126:5
    text: >
      눈물을 흘리며 씨를 뿌리는 자는 기쁨으로 거두리로다
    emotion_tags: [sadness.sorrow]
    theme: hope
    note: >
      눈물의 시간에 의미를 놓되 "곧 끝난다"고 재촉하지 않는다.
      짧아 카드 UI에 적합.
    verified: true
    verified_by: verify_verses.py(krv1961@bluesaurel/Korean-Bible-1961-KRV#65cdce8)
    verified_at: "2026-08-18"

  - id: psa.77.2
    ref: 시편 77:2
    text: >
      나의 환난날에 내가 주를 찾았으며 밤에는 내 손을 들고 거두지
      아니하였으며 내 영혼이 위로 받기를 거절하였도다
    emotion_tags: [sadness.sorrow]
    theme: lament
    note: >
      2026-08-19 추가. lament가 2개뿐이었는데 이 화면의 방향이 "슬픔을 고치려
      하지 않고 곁에 있는다"라 축이 방향과 어긋나 있었다.
      "내 영혼이 위로 받기를 거절하였도다" — **위로를 거부하는 상태를 성경이
      그대로 적었다.** 위기 인접 세분류에서 오히려 안전한 구절이다.
      앱이 위로를 들이밀지 않는다는 신호가 되기 때문이다.

    verified: true
    verified_by: verify_verses.py(krv1961@bluesaurel/Korean-Bible-1961-KRV#65cdce8)
    verified_at: "2026-08-19"
  - id: psa.42.3
    ref: 시편 42:3
    text: >
      사람들이 종일 나더러 하는 말이 네 하나님이 어디 있느뇨 하니 내 눈물이
      주야로 내 음식이 되었도다
    emotion_tags: [sadness.sorrow]
    theme: lament
    note: >
      2026-08-19 추가. "내 눈물이 주야로 내 음식이 되었도다" — 슬픔의 신체
      이미지다. 시 42:5가 이미 이 화면에 hope 축으로 있어 같은 시편의 짝이 된다
      (탄식 → 소망 순서가 한 시편 안에서 보인다).
      ⚠ "네 하나님이 어디 있느뇨"는 조롱하는 타인의 말이다. 신앙 회의를
      자극하는 것이 아니라 **그 말을 듣는 자리에 있음**을 인정하는 쪽이다.

    verified: true
    verified_by: verify_verses.py(krv1961@bluesaurel/Korean-Bible-1961-KRV#65cdce8)
    verified_at: "2026-08-19"
  - id: psa.143.4
    ref: 시편 143:4
    text: >
      그러므로 내 심령이 속에서 상하며 내 마음이 속에서 참담하니이다
    emotion_tags: [sadness.sorrow]
    theme: lament
    note: >
      2026-08-19 추가. 35자로 짧다 — 이 화면의 짧은 구절 잔량을 5 → 6으로 올린다.
      ⚠⚠ **"그러므로"로 시작한다. 앞 143:3("원수가 내 영혼을 핍박하며")을 받는
      절이고, 절 단위로 자르면 그 근거가 사라진다. 그것이 의도다.**
      이 화면에서 "그러므로"의 자리는 **사용자 자신의 상황**이 채운다. 앱은
      슬픔의 이유를 모르고, 물어서도 안 된다. 근거를 비워 두는 것이 이 화면의
      설계이지 실수가 아니다.
      나중에 "앞뒤 절을 붙여야 완성된다"며 143:3-4로 넓히지 말 것 —
      그러면 원수·핍박이라는 특정 서사가 들어와 사용자의 상황을 앱이 지정하게 된다.

    verified: true
    verified_by: verify_verses.py(krv1961@bluesaurel/Korean-Bible-1961-KRV#65cdce8)
    verified_at: "2026-08-19"
  - id: psa.22.24
    ref: 시편 22:24
    text: >
      그는 곤고한 자의 곤고를 멸시하거나 싫어하지 아니하시며 그 얼굴을
      저에게서 숨기지 아니하시고 부르짖을 때에 들으셨도다
    emotion_tags: [sadness.sorrow]
    theme: comfort
    note: >
      2026-08-19 추가. "그 얼굴을 저에게서 숨기지 아니하시고" — 유기감을 직접
      부정한다. 위기 인접 세분류라 이 방향이 특히 필요하다.
      [제외 기록] 같은 슬롯에서 시 13:1("나를 영영히 잊으시나이까")을 검토했다.
      탄식의 대표 구절이지만 위기 인접에서는 유기감을 키우는 쪽이라 뺐고,
      대신 그 감정을 정면으로 받는 이 구절을 골랐다.

    verified: true
    verified_by: verify_verses.py(krv1961@bluesaurel/Korean-Bible-1961-KRV#65cdce8)
    verified_at: "2026-08-19"
  - id: psa.31.7
    ref: 시편 31:7
    text: >
      내가 주의 인자하심을 기뻐하며 즐거워할 것은 주께서 나의 곤란을 감찰하사
      환난 중에 있는 내 영혼을 아셨고
    emotion_tags: [sadness.sorrow]
    theme: comfort
    note: >
      2026-08-19 추가. "주께서 나의 곤란을 감찰하사 …내 영혼을 아셨고" —
      **과거형이라 약속이 아니다.** 위기 인접에서 미래 약속("곧 좋아진다")을
      피하면서도 위로를 놓는 방법이다.
      시 31:9가 이미 이 화면에 lament로 있어 같은 시편의 짝이 된다.

