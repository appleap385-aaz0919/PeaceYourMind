  - id: psa.25.16
    ref: 시편 25:16
    text: >
      주여 나는 외롭고 괴롭사오니 내게 돌이키사 나를 긍휼히 여기소서
    emotion_tags: [sadness.lonely]
    theme: presence
    note: >
      "나는 외롭고 괴롭사오니" — 본문에 "외롭"이 직접 나오는 드문 구절이라
      자연어 입력 "외로워"와 정확히 겹친다. 간구 형식이라 사용자의 말을
      대신 해주는 위치에 선다. 강력 추천.
    verified: true
    verified_by: verify_verses.py(krv1961@bluesaurel/Korean-Bible-1961-KRV#65cdce8)
    verified_at: "2026-08-18"

  - id: jhn.14.18
    ref: 요한복음 14:18
    text: >
      내가 너희를 고아와 같이 버려두지 아니하고 너희에게로 오리라
    emotion_tags: [sadness.lonely]
    theme: presence
    note: >
      "고아와 같이 버려두지 아니하고" — 외로움을 버림받음으로 경험하는
      언어에 정면으로 대응한다. 짧아 카드 UI에 적합.
    verified: true
    verified_by: verify_verses.py(krv1961@bluesaurel/Korean-Bible-1961-KRV#65cdce8)
    verified_at: "2026-08-18"

  - id: psa.73.23
    ref: 시편 73:23
    text: >
      내가 항상 주와 함께하니 주께서 내 오른손을 붙드셨나이다
    emotion_tags: [sadness.lonely]
    theme: presence
    note: '"내 오른손을 붙드셨나이다" — 접촉의 이미지. 짧고 명료.'
    verified: true
    verified_by: verify_verses.py(krv1961@bluesaurel/Korean-Bible-1961-KRV#65cdce8)
    verified_at: "2026-08-18"

  - id: mat.28.20
    ref: 마태복음 28:20
    text: >
      내가 너희에게 분부한 모든 것을 가르쳐 지키게 하라 볼찌어다 내가 세상
      끝날까지 너희와 항상 함께 있으리라 하시니라
    emotion_tags: [sadness.lonely]
    theme: presence
    note: >
      임마누엘 프레임의 대표 구절. 절 앞부분이 명령이지만 뒤에 약속
      ("세상 끝날까지 함께")이 따라온다 — 선정 원칙 3 충족.
    verified: true
    verified_by: verify_verses.py(krv1961@bluesaurel/Korean-Bible-1961-KRV#65cdce8)
    verified_at: "2026-08-18"

  - id: psa.139.7
    ref: 시편 139:7-8
    text: >
      내가 주의 신을 떠나 어디로 가며 주의 앞에서 어디로 피하리이까 내가
      하늘에 올라갈찌라도 거기 계시며 음부에 내 자리를 펼찌라도 거기
      계시니이다
    emotion_tags: [sadness.lonely]
    theme: presence
    note: >
      "어디로 피하리이까"의 답이 "거기 계시니이다"로 이어진다. 8절까지 묶어야
      질문이 답을 만난다 — 7절 단독은 도피 실패로만 읽힌다(선정 원칙 4).
    verified: true
    verified_by: verify_verses.py(krv1961@bluesaurel/Korean-Bible-1961-KRV#65cdce8)
    verified_at: "2026-08-18"

  - id: psa.27.10
    ref: 시편 27:10
    text: >
      내 부모는 나를 버렸으나 여호와는 나를 영접하시리이다
    emotion_tags: [sadness.lonely]
    theme: love
    note: >
      "내 부모는 나를 버렸으나" — 가장 가까운 관계의 단절을 전제하고 말하는
      구절이라, 외로움을 축소하지 않으면서 그 다음을 놓는다.
    verified: true
    verified_by: verify_verses.py(krv1961@bluesaurel/Korean-Bible-1961-KRV#65cdce8)
    verified_at: "2026-08-18"

  - id: isa.49.15
    ref: 이사야 49:15
    text: >
      여인이 어찌 그 젖먹는 자식을 잊겠으며 자기 태에서 난 아들을 긍휼히
      여기지 않겠느냐 그들은 혹시 잊을찌라도 나는 너를 잊지 아니할 것이라
    emotion_tags: [sadness.lonely]
    theme: love
    note: >
      "그들은 혹시 잊을찌라도 나는 너를 잊지 아니할 것이라" — 잊혀짐의
      두려움에 정확히 대응한다. 옛 표기 "잊을찌라도"가 살아 있는 구절.
    verified: true
    verified_by: verify_verses.py(krv1961@bluesaurel/Korean-Bible-1961-KRV#65cdce8)
    verified_at: "2026-08-18"

  - id: jer.31.3
    ref: 예레미야 31:3
    text: >
      나 여호와가 옛적에 이스라엘에게 나타나 이르기를 내가 무궁한 사랑으로
      너를 사랑하는고로 인자함으로 너를 인도하였다 하였노라
    emotion_tags: [sadness.lonely]
    theme: love
    note: '"무궁한 사랑으로 너를 사랑하는고로" — love 주제의 대표 구절.'
    verified: true
    verified_by: verify_verses.py(krv1961@bluesaurel/Korean-Bible-1961-KRV#65cdce8)
    verified_at: "2026-08-18"

  - id: isa.43.4
    ref: 이사야 43:4
    text: >
      내가 너를 보배롭고 존귀하게 여기고 너를 사랑하였은즉 내가 사람들을 주어
      너를 바꾸며 백성들로 네 생명을 대신하리니
    emotion_tags: [sadness.lonely]
    theme: love
    note: >
      "보배롭고 존귀하게 여기고" — 존재 가치의 언어. 1차분 isa.43.1
      ("지명하여 불렀나니")과 같은 장의 연장이라 톤이 이어진다.
    verified: true
    verified_by: verify_verses.py(krv1961@bluesaurel/Korean-Bible-1961-KRV#65cdce8)
    verified_at: "2026-08-18"

  - id: rom.8.38
    ref: 로마서 8:38-39
    text: >
      내가 확신하노니 사망이나 생명이나 천사들이나 권세자들이나 현재 일이나
      장래 일이나 능력이나 높음이나 깊음이나 다른 아무 피조물이라도 우리를
      우리 주 그리스도 예수 안에 있는 하나님의 사랑에서 끊을 수 없으리라
    emotion_tags: [sadness.lonely]
    theme: love
    note: >
      2차분 최장(116자). 그럼에도 넣는 이유는 열거 구조 자체가 메시지라서다
      — 무엇을 갖다 대도 끊을 수 없다는 결론이 목록의 길이로 표현된다.
      38절만 쓰면 "끊을 수 없으리라"가 없어 문장이 성립하지 않는다.
    verified: true
    verified_by: verify_verses.py(krv1961@bluesaurel/Korean-Bible-1961-KRV#65cdce8)
    verified_at: "2026-08-18"

  - id: psa.142.4
    ref: 시편 142:4
    text: >
      내 우편을 살펴 보소서 나를 아는 자도 없고 피난처도 없고 내 영혼을
      돌아보는 자도 없나이다
    emotion_tags: [sadness.lonely]
    theme: lament
    note: >
      2026-08-19 추가. 이 화면은 presence 5 · love 5로 "곁에 있다/사랑받는다"에
      몰려 있었고 lament가 0이었다. 그런데 헤더가 명시한 방향은
      "단절을 부정하지 않는 구절을 앞에 둔다(외롭다고 먼저 말하게 한다)"다.
      "나를 아는 자도 없고 …내 영혼을 돌아보는 자도 없나이다"가 그 자리다.
      ⚠⚠ **4절만 떼면 답 없이 끝난다. 뒤 142:5가 "주는 나의 피난처시요"로
      전환하는데 그것을 붙이지 않았다. 의도적이다.**
      외로운 사람에게 앱이 먼저 "그래도 하나님이 계셔요"로 넘어가면, 방금
      말한 단절이 부정당한다. 이 화면에는 그 전환을 이미 놓은 구절이 11개 있다
      (presence 5 · love 5 · hope 1). **하나쯤은 전환 없이 남겨 두는 자리가
      필요하고 그것이 이 구절이다.**
      나중에 142:4-5로 넓히지 말 것 — 넓히는 순간 이 화면에 "그냥 머물러도
      되는 자리"가 사라진다.

    verified: true
    verified_by: verify_verses.py(krv1961@bluesaurel/Korean-Bible-1961-KRV#65cdce8)
    verified_at: "2026-08-19"
  - id: jhn.15.15
    ref: 요한복음 15:15
    text: >
      이제부터는 너희를 종이라 하지 아니하리니 종은 주인의 하는 것을 알지
      못함이라 너희를 친구라 하였노니 내가 내 아버지께 들은 것을 다 너희에게
      알게 하였음이니라
    emotion_tags: [sadness.lonely]
    theme: love
    note: >
      2026-08-19 추가. love가 이미 5개지만 **결이 다르다** — 기존 5개는
      "사랑받고 있다"(사 43:4 · 렘 31:3 · 사 49:15 · 시 27:10 · 롬 8:38-39)인데
      이것은 "종이 아니라 친구라 하였노니", 즉 **관계의 지위**다.
      외로움은 사랑의 부재가 아니라 관계의 부재라 축이 갈린다.

