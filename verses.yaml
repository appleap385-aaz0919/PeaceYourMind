      가깝다. 87자로 이 풀에서 가장 길다.
      시편 27편에서 네 번째(1 anxiety.tension / 4 calm.ease /
      10 sadness.lonely / 13 exhaustion.listless).
    verified: true
    verified_by: verify_verses.py(krv1961@bluesaurel/Korean-Bible-1961-KRV#65cdce8)
    verified_at: "2026-08-18"

