    verified_at: "2026-08-18"

  - id: 1pe.2.23
    ref: 베드로전서 2:23
    text: >
      욕을 받으시되 대신 욕하지 아니하시고 고난을 받으시되 위협하지 아니하시고
      오직 공의로 심판하시는 자에게 부탁하시며
    emotion_tags: [anger.unfair]
    theme: justice
    note: >
      2026-08-19 추가. "욕을 받으시되 대신 욕하지 아니하시고 …공의로 심판하시는
      자에게 부탁하시며" — **화자가 예수이고 3인칭 서술이다.** 사용자에게
      참으라고 요구하지 않고, 억울함을 넘기는 곳이 사람이 아니라는 것만 말한다.
      3차분의 화자 전환 원칙(HANDOFF 2.6)에 맞는 형태다.
      ⚠ forgiveness 축은 2건을 유지한다(정책). 이 구절은 justice로 둔다 —
        용서가 아니라 심판을 맡기는 방향이기 때문이다.

    verified: true
    verified_by: verify_verses.py(krv1961@bluesaurel/Korean-Bible-1961-KRV#65cdce8)
    verified_at: "2026-08-19"
  - id: psa.140.12
    ref: 시편 140:12
    text: >
      내가 알거니와 여호와는 고난 당하는 자를 신원하시며 궁핍한 자에게 공의를
      베푸시리이다
    emotion_tags: [anger.unfair]
    theme: justice
    note: >
      2026-08-19 추가. "여호와는 고난 당하는 자를 **신원하시며**" —
      themes.yaml justice의 title_keywords에 "신원"이 그대로 있다.
      내가 갚는 것이 아니라는 화자 전환이고, 47자로 짧다.

    verified: true
    verified_by: verify_verses.py(krv1961@bluesaurel/Korean-Bible-1961-KRV#65cdce8)
    verified_at: "2026-08-19"
  - id: psa.73.13
    ref: 시편 73:13
    text: >
      내가 내 마음을 정히 하며 내 손을 씻어 무죄하다 한 것이 실로 헛되도다
    emotion_tags: [anger.unfair]
    theme: lament
    note: >
      2026-08-19 추가. "내 손을 씻어 무죄하다 한 것이 **실로 헛되도다**" —
      바르게 살았는데 소용없다는, 억울함의 정확한 언어다. 40자로 짧다.
      ⚠ 시편 73은 17절("하나님의 성소에 들어갈 때에야")에서 전환하는데
        **13절만 떼어 헛됨에서 끝낸다.** 이 화면의 방향이 그것이다 —
        억울함에 자리를 주는 것이 먼저이고, 전환은 사용자의 시간에 맡긴다.

    verified: true
    verified_by: verify_verses.py(krv1961@bluesaurel/Korean-Bible-1961-KRV#65cdce8)
    verified_at: "2026-08-19"
  - id: psa.10.1
    ref: 시편 10:1
    text: >
      여호와여 어찌하여 멀리 서시며 어찌하여 환난 때에 숨으시나이까
    emotion_tags: [anger.unfair]
    theme: lament
    note: >
      2026-08-19 추가. "어찌하여 멀리 서시며 어찌하여 환난 때에 숨으시나이까" —
      억울할 때의 부재감을 그대로 묻는다. 34자로 짧아 잔량 4 → 5.
      이 화면은 위기 인접 목록에 없어 이 강도를 허용한다.

