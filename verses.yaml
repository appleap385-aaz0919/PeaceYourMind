    note: >
      "주의 행사로 나를 기쁘게 하셨으니" — 기쁨의 출처를 짚되 기쁨 자체는
      그대로 둔다.
      [데이터 메모] 시편 92:1-3은 절 합본 구간이라 쓸 수 없지만(4차분 헤더
      주석 참조) 4절부터는 정상 분할이다.
    verified: true
    verified_by: verify_verses.py(krv1961@bluesaurel/Korean-Bible-1961-KRV#65cdce8)
