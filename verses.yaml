      1절만 쓰면 상태 서술("근심으로 편치 못하여 탄식하오니")이 없어 2절과 묶는다.
      1차분 psa.55.22("네 짐을 맡겨 버리라")와 같은 시편이며, 22절이 결론이라면
      1-2절은 그 앞의 토로다.
