  # ═══════════════════════════════════════════════════════════
  # boredom.novelty (새 자극) — 주제: bible_story, daily_word
  # 방향: 새 자극을 찾는 상태를 산만함으로 취급하지 않는다.
  #      dull과 이렇게 갈린다 (확정 규칙 3):
  #        dull      익숙한 것을 다시 보게 한다 (눈을 열어서 · 맛 · 꿀)
  #        novelty   아직 모르는 것으로 데려간다 (큰 광경 · 인물 나열 · 뜨겁지)
  #      매핑 주제가 같지만 구절은 한 건도 겹치지 않는다
  # ═══════════════════════════════════════════════════════════

  - id: exo.3.3
    ref: 출애굽기 3:3
    text: >
      이에 가로되 내가 돌이켜 가서 이 큰 광경을 보리라 떨기나무가 어찌하여
      타지 아니하는고 하는 동시에
    emotion_tags: [boredom.novelty]
    theme: bible_story
    note: >
      "내가 돌이켜 가서 이 큰 광경을 보리라" — 호기심이 발동하는 순간
      자체를 담은 장면이다. 사용자의 상태와 구절 속 화자의 상태가 겹친다.
      exo.33.14(exhaustion.burnout) · exo.34.6(anger.irritation)과 같은 책.
    verified: true
    verified_by: verify_verses.py(krv1961@bluesaurel/Korean-Bible-1961-KRV#65cdce8)
    verified_at: "2026-08-18"

