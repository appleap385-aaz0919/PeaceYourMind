# =====================================================================
# crisis — 위기 화면 전용 고정 큐레이션
#
# [감정 매핑을 타지 않는다]
#   PLAN.md 7절: "위기 화면의 구절은 감정 매핑을 타지 않는 별도 고정
#   큐레이션(운영자 확정 목록)". 그래서 최상위 키를 분리했다 —
#   PLAN 4.2가 videos.json에 정한 "crisis 최상위 분리 + 빌드 시 교차 검증
#   단언"과 같은 구조다. 구조로 섞임을 막는다.
#
#   verify_verses.py의 check_crisis_separation()이 매번 단언한다:
#     - 위기 구절 id는 "crisis." 접두사여야 한다
#     - 위기 구절에 emotion_tags가 있으면 안 된다
#     - 위기 구절의 theme은 crisis_fixed여야 한다
#     - 감정 풀에 crisis. id나 crisis_fixed theme이 있으면 안 된다
#   하나라도 어긋나면 게이트가 실패한다.
#
# [선정 기준 — 감정 풀보다 엄격하다]
#   PLAN.md 7절: "죄·심판·형벌 프레임의 구절은 위기 화면에서 배제한다.
#   위기 상태의 사용자에게 종교적 부담을 지우는 방향의 콘텐츠는 이 서비스가
#   낼 수 있는 최악의 출력이다."
#
#   넣는 것   조건 없는 존재 긍정 / 곁에 있음 / 부르짖어도 된다는 정당화
#   빼는 것   죄·회개·심판·형벌 어휘, 조건절("믿으면"·"의인은"),
#            분발 요구("강하고 담대하라"), 고난에 의미를 부여하는 구절
#
#   [실제 제외 사례] 시 34:18("여호와는 마음이 상한 자에게 가까이 하시고")은
#   감정 풀(sadness.sorrow)의 대표 구절이지만 위기 풀에서는 뺐다.
#   후반부가 "중심에 통회하는 자를 구원하시는도다"인데, 위기 상태에서
#   "통회"가 구원의 조건처럼 읽힐 여지가 있다. 감정 화면에서는 문제가
#   되지 않는 표현이 위기 화면에서는 문제가 된다 — 기준이 다르기 때문이다.
#   같은 자리를 시 147:3("상심한 자를 고치시며", 조건 없음)이 채웠다.
#
# [감정 풀과 구절이 겹치는 것은 문제가 아니다]
#   별도 큐레이션이므로 같은 구절이 양쪽에 있을 수 있다. id 충돌만
#   "crisis." 접두사로 피한다. 아래 5건이 감정 풀과 본문을 공유한다
#   (isa.43.1 · isa.41.10 · rom.8.38 · mat.11.28 · psa.147.3).
#   검증된 강한 구절을 위기 화면에서 굳이 피할 이유가 없다.
#
# [화면 구성 주의 — Phase 3]
#   위기 화면은 상담 안내가 최상단이고 구절은 보조다(FYM 승계).
#   "추천"이라는 단어를 쓰지 않고 자동재생하지 않는다(PLAN 7절).
# =====================================================================

crisis:

  # ── 존재 긍정 — 조건 없이 귀하다 ────────────────────────

  - id: crisis.psa.139.13
    ref: 시편 139:13-14
    text: >
