    verified_by: verify_verses.py(krv1961@bluesaurel/Korean-Bible-1961-KRV#65cdce8)
    verified_at: "2026-08-19"
  - id: psa.90.14
    ref: 시편 90:14
    text: >
      아침에 주의 인자로 우리를 만족케 하사 우리 평생에 즐겁고 기쁘게 하소서
    emotion_tags: [sadness.loss]
    theme: hope
    note: >
      2026-08-19 추가. hope 축이 0이었다. 40자로 짧아 잔량을 3 → 4로 올린다.
      "아침에 주의 인자로 우리를 만족케 하사" — **기도문이라 약속이 아니다.**
      위기 인접 세분류에서 "곧 좋아진다"를 피하면서 시간의 방향만 놓는 방식이다.
      [제외 기록] 요 16:20("너희 근심이 도리어 기쁨이 되리라")을 검토하고 뺐다 —
      회복 약속이고, 16:22가 이미 sadness.sorrow에 있어 같은 단락이다.
      시 88:18은 "주께서 …떠나게 하시며"가 하나님을 단절의 원인으로 지목해
      위기 인접에 부적합하다.

