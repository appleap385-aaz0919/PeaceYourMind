  - id: hab.2.3
    ref: 하박국 2:3
    text: >
      이 묵시는 정한 때가 있나니 그 종말이 속히 이르겠고 결코 거짓되지
      아니하리라 비록 더딜찌라도 기다리라 지체되지 않고 정녕 응하리라
    emotion_tags: [frustration.blocked]
    theme: patience
    note: >
      "비록 더딜찌라도 기다리라" — 더딤을 부정하지 않고 인정한 채로 말한다.
      themes.yaml patience intent가 지목한 구절. 옛 표기 "더딜찌라도".
