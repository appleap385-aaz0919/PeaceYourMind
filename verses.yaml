      이야기가 많다는 뜻이라 진입점으로 작동한다.
      heb.11.1(anticipation) · heb.11.8(dull)과 같은 장이지만 셋 다 성격이 다르다.
    verified: true
    verified_by: verify_verses.py(krv1961@bluesaurel/Korean-Bible-1961-KRV#65cdce8)
    verified_at: "2026-08-18"

