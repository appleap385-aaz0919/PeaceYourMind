      "너는 두려워 말라 ... 너는 내 것이라" — 소속을 선언한다.
      감정 풀 isa.43.1(anxiety.tension)과 본문이 같다. 위기 화면에서
      굳이 피할 이유가 없어 접두사만 달리해 재사용한다.
