      없던 어휘다.
      ⚠ 시편 126을 세 번째로 쓴다(126:3 joy.proud · 126:5 sadness.sorrow).
        한 시편이 기쁨과 슬픔 양쪽에 걸치는 것은 126편의 구조(눈물로 뿌리고
        기쁨으로 거둔다) 때문이라 자연스럽지만, 편중 자료로 기록해 둔다.

