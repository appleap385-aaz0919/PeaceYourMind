<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Peace in Mind 앱 아이콘 — scripts/gen_icons.py가 PNG와 함께 생성한다.
       ⛔ 손으로 고치지 말 것. 색은 app/src/theme.js에서 읽는다.
       모양: 자정 그라데이션 + 호흡하는 빛 + 위쪽 90도가 열린 얇은 원(03-c).
       원을 닫지 않은 것은 "들이쉬는 중"으로 읽히게 하려는 것이다. -->
  <defs>
    <radialGradient id="bg" cx="50%" cy="0%" r="115%">
      <stop offset="0" stop-color="#221A28"/>
      <stop offset="0.45" stop-color="#141E24"/>
      <stop offset="1" stop-color="#0B1216"/>
    </radialGradient>
    <radialGradient id="glow">
    <stop offset="0.00" stop-color="#7FB3A3" stop-opacity="0.950"/>
    <stop offset="0.10" stop-color="#7FB3A3" stop-opacity="0.753"/>
    <stop offset="0.20" stop-color="#7FB3A3" stop-opacity="0.581"/>
    <stop offset="0.30" stop-color="#7FB3A3" stop-opacity="0.433"/>
    <stop offset="0.40" stop-color="#7FB3A3" stop-opacity="0.309"/>
    <stop offset="0.50" stop-color="#7FB3A3" stop-opacity="0.207"/>
    <stop offset="0.60" stop-color="#7FB3A3" stop-opacity="0.127"/>
    <stop offset="0.70" stop-color="#7FB3A3" stop-opacity="0.067"/>
    <stop offset="0.80" stop-color="#7FB3A3" stop-opacity="0.028"/>
    <stop offset="0.90" stop-color="#7FB3A3" stop-opacity="0.006"/>
    <stop offset="1.00" stop-color="#7FB3A3" stop-opacity="0.000"/>
    </radialGradient>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <circle cx="256" cy="256" r="152" fill="url(#glow)"/>
  <circle cx="256" cy="256" r="124" fill="none"
          stroke="#7FB3A3" stroke-width="13"
          stroke-linecap="round" opacity="0.76"
          stroke-dasharray="584.3 194.8" stroke-dashoffset="-681.7"/>
</svg>
