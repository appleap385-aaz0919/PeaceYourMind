# =====================================================================
# channel_blocklist.yaml — 채널 단위 차단 목록 (v0.1 스켈레톤)
#
# ---------------------------------------------------------------------
# PYM에서 이 파일의 위상 — FYM과 다르다. 먼저 읽을 것.
#
# FYM  화이트리스트는 위기 카테고리에만 적용됐다. 일반 카테고리는 검색으로
#      수집했으므로 블록리스트가 주된 방어선 중 하나였다.
# PYM  모든 영상이 channel_allowlist.yaml에서만 나온다 (PLAN.md 5절).
#      승인되지 않은 채널은 애초에 수집되지 않는다.
#
# 그래서 이 파일은 **주된 방어선이 아니라 2차 안전망**이다.
# 여기에 채널이 쌓인다는 것은 곧 allowlist 승인 기준이 새고 있다는 신호다.
# 채널을 막기 전에 "그 채널이 어떻게 allowlist를 통과했는가"를 먼저 본다.
# 대개의 올바른 조치는 이 파일에 추가하는 것이 아니라 allowlist에서 빼는 것이다.
#
# 그럼에도 이 파일을 두는 이유:
#   1. 승인된 채널이 나중에 성격이 바뀌는 경우가 있다 (운영자 교체, 노선 변경).
#      allowlist 제거는 PR 검토를 거치지만, 그 사이 즉시 차단이 필요할 수 있다.
#   2. 같은 교회·단체가 채널을 여럿 운영하며 일부만 성격이 다른 경우
#      (예: 본 채널은 설교, 부속 채널은 정치 시사) — 명시적 차단으로 남긴다.
#   3. 화이트리스트는 필터 면제권이 아니라는 원칙을 구조로 유지한다.
#      allowlist·blocklist가 충돌하면 **blocklist가 이긴다.**
#
# 변경은 반드시 PR로만 한다 — 누가 왜 막았는지 이력이 남아야 한다.
#
# ---------------------------------------------------------------------
# 필수 필드 (하나라도 비면 배치가 실패한다 — FYM 형식 승계)
#   channel_id     YouTube 채널 ID. "UC"로 시작하는 24자. 핸들·URL 불가.
#   channel_name   사람이 알아볼 이름
#   added_at       추가일 (YYYY-MM-DD)
#   added_by       추가한 사람
#   reason         왜 막았는가.
#                  allowlist에 있던 채널이면 왜 승인이 뒤집혔는지,
#                  없던 채널이면 어떤 경로로 유입됐는지까지 적는다.
#
# ---------------------------------------------------------------------
# 현재 등록: 0개
#
# 비어 있는 것이 정상 상태다. allowlist가 아직 비어 있어(Phase 0 진행 중)
# 수집이 시작되지 않았고, 전면 화이트리스트 구조에서는 이 목록이 계속
# 비어 있는 것이 설계 의도대로 작동한다는 뜻이다.
# =====================================================================

version: "0.1.0"

channels: []
  # 등록 예시 (형식 참고용)
  #
  # - channel_id: UCxxxxxxxxxxxxxxxxxxxxxx
  #   channel_name: 예시 채널
  #   added_at: "2026-08-19"
  #   added_by: jaehyuk.myung
  #   reason: >
  #     2026-08-19 승인된 채널이나 이후 정치 시사 논평이 주력으로 바뀌었다.
  #     allowlist 승인 기준 3(콘텐츠 성격) 위반. allowlist 제거 PR과 함께 등록.
