      - id: frustration.suppressed
        label: 억눌림
        empathy_messages:   # 매번 랜덤 1개 (직전 것 제외)
          - "하고 싶은 말을 삼킨 하루였군요."
          - "표현하지 못한 마음이 안에 쌓여 있네요."
          - "참는 게 익숙해진 것 같아 마음이 쓰여요."
