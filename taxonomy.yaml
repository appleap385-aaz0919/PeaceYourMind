  # ===================================================================
  #   `죽어`·`죽여`·`자살`은 문장 안에서는 뜻이 갈린다(위 2026-08-20 기록).
  #   그런데 **이 말만 적어 넣은 사람**은 사정이 다르다. 감정 입력 상자에
  #   "죽어" 두 글자만 적는 것은 사별 서술도 관용구도 아니다.
  #
  #   그래서 층을 나눴다. crisis_keywords는 부분 문자열, 여기는 **정확 일치**다.
  #     "죽어"                    → 위기        (입력 전체가 이것뿐)
  #     "할머니가 죽어서 슬퍼요"   → 위기 아님   (sadness.loss로 간다)
  #
  #   비교 전에 자모(ㅠㅋㅎ…)를 걷어낸다 — "죽어ㅠㅠ"도 단독 입력이다.
  #   정규화가 공백·문장부호를 이미 지우므로 "죽 어"·"죽어..."도 여기 걸린다.
  #   ⚠ normalize() 자체는 건드리지 않았다. scripts/lib/normalize.py와
  #     문자 단위로 같아야 하기 때문이고, 자모 제거는 이 검사 안에만 있다.
  #
  #   ⛔ 여기 있는 말을 crisis_keywords로 옮기지 말 것. 옮기는 순간 사별·
  #     관용구·타인 지향 분노가 전부 위기로 빨려 들어간다 (실측 오탐 8건).
  crisis_exact: [죽어, 죽여, 자살, 죽음]
  crisis_response:
    message: >
      지금 마음이 많이 힘드신 것 같아요. 혼자 견디지 않으셔도 됩니다.
      전문 상담원과 이야기해보시는 건 어떨까요. 24시간 언제든 연결돼요.
    resources:
      - name: 자살예방 상담전화
        number: "109"
      - name: 정신건강 위기상담전화
        number: "1577-0199"
    # --- 위기 상황 콘텐츠 정책 (일반 추천과 완전히 분리) ---
    content_policy:
      show_videos: true
      placement: 상담 안내 아래에 배치. 상담 안내가 화면 최상단·최대 강조로 항상 먼저 보인다.

      # [PYM 재작성 — FYM은 검색으로 위기 풀을 만들었다]
      #   FYM은 전용 검색어 + 3중 가드레일로 위기 영상을 모았다. PYM은
      #   전면 화이트리스트라 검색 자체를 하지 않는다 (PLAN.md 5절).
      #   위기 풀은 channel_allowlist.yaml에서 crisis_eligible: true인 채널의
      #   업로드에서만 나온다. 검색이 없으면 유입 경로도 없다.
      source: allowlist_crisis_eligible
      source_note: >
        일반 풀보다 좁은 기준이다. crisis_eligible은 정신건강 전문 사역·상담 사역
        중심으로만 준다 (PLAN.md 7절). 2026-08-19 현재 승인 15개 채널은 전부
        false이므로 **위기 화면은 상담 안내만 표시한다 — 의도된 안전 동작이며
        결함이 아니다.** 배치는 crisis_no_channels·crisis_empty 경보를 낸다.

      framing: >
        "추천" 표현을 쓰지 않는다. "지금 곁에 두면 좋을 것들" 정도의 조용한 문구로
        제시하고 자동재생하지 않는다. 노출 4~6개로 제한해 선택 부담을 줄이고,
        매 방문 확보된 풀에서 랜덤 노출해 같은 영상이 고정되지 않게 한다.

      # 위기 화면에는 [말씀]/[찬양] 토글이 없다.
      # 형식 선택은 감정 화면의 기능이고(PLAN.md 3.4), 위기 화면은 상담 안내가
      # 최상단인 단일 목록이다. 폴백도 쓰지 않는다 — 주제 태깅이 안 된 영상을
      # 위기 상태의 사용자에게 형식만 보고 내놓을 수는 없다.
      media_type_toggle: false
      fallback: false

      filter_rules:
        - 영상 길이 3분 미만 제외 (짧은 자극형 콘텐츠 배제)
        - Shorts 표기(#shorts 등) 제외 — 제목·설명·태그를 함께 본다
        - channel_blocklist.yaml 채널 제외 (화이트리스트는 필터 면제권이 아니다)
        - 일반 주제 풀과 videoId를 공유하지 않는다 (배치가 단언하고, 어기면 배포하지 않는다)
      blocklist_terms: >
        blocklist_tiers는 아직 배치에 연결되어 있지 않다 (헤더 주석 참조).
        위기 풀에 채널이 생기는 시점에 tier_a부터 켤지 실측으로 판단한다.
      blocklist_scope_rationale: >
        제목만 본다. 설명란에는 해시태그·링크·채널 소개·상담 안내가 뒤섞여 있어
        영상 내용과 무관한 문자열에 걸린다. 특히 자살예방 상담전화를 성실히 적어둔
        채널이 tier_a의 "자살"에 잡혀 제외되는, 정책 의도와 정반대의 결과가
        구조적으로 발생한다 (FYM 실측 교훈).

      selection_method: round_robin
      selection_method_rationale: >
        채널을 순회하며 1건씩 채우고 채널당 상한까지 반복한다. 순회 시작 지점은
        day_of_year로 매일 회전시켜, 뒤쪽 채널이 매일 같은 자리에서 밀려나지 않게 한다.
        상수(상한 3, 목표 20건, 최소 12건)는 scripts/lib/themes.py에 있다.
      min_videos_rationale: >
        확보량이 12건에 못 미치면 **필터를 완화하지 않고 직전 결과를 유지한다.**
        못 채우는 것이 안전한 기본값이다. 유지할 직전 결과도 없으면 0건으로 두고
        상담 안내만 노출한다.

      review: 배치 산출물 중 이 카테고리는 월 1회 사람이 샘플 점검한다
      closing_messages:   # 위기 화면 하단. 가장 조심스러운 자리다
        - "지금은 여기까지 온 것만으로 충분해요."
        - "아무것도 하지 않아도 괜찮아요. 연락처는 위에 그대로 있어요."
