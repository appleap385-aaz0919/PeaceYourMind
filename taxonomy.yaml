        # "빵터질"은 2026-08-16에 frustration.suppressed로 "터질"을 넣으면서
        # 함께 넣은 가드다. "빵 터질 것 같아"는 웃긴다는 뜻이라 억눌림이 아니다.
        # "빵터"(2자)로는 "터질"(2자)과 길이가 같아 동점이 되고, 동점에서는
        # 앞선 대분류(frustration)가 이겨서 막지 못한다 — 그래서 3자로 넣는다.
        # 2026-08-20 — ★ 긴급: "기분이 좋아"가 미분류였다 (실사용 제보)
        #
        #   `기분좋`은 있는데 조사 하나가 끼면 깨진다. 위기 사전의
        #   `죽어버리` / `죽어버릴까`(2026-08-20)와 **같은 유형**이다.
        #     "기분 좋아"   → 걸림    "기분이 좋아"   → 미분류
        #     "기분좋다"    → 걸림    "기분이 좋아요" → 미분류
        #   `좋` 계열이 세분류 키워드 893개 중 9개뿐이었다.
        #   긍정 3계열은 세분류당 31.7개, 부정 5계열은 39.5개다 — 20% 얇다.
        #
        #   ⚠ **NO_MATCH 화면이 정상 동작인 것과 분류가 정상인 것은 별개다.**
        #     "일이 너무 많아서 정신이 없었어요"는 감정어가 없어 NO_MATCH가 맞지만,
        #     "기분이 좋아"는 감정을 직접 말한 입력이다. 화면이 깨지지 않는다고
        #     결함이 아닌 것이 아니다. 이 구분을 놓쳐 발견이 늦었다.
        #
        #   추가한 8종 — 부정 표현 오탐 0 실측 (아래 배제 목록 참조)
        #     좋다 · 너무좋 · 진짜좋 · 참좋 · 좋았어 · 좋은하루 · 기분째 · 기분이좋아
        #
        #   ⛔ 아래는 **넣지 않았다.** 되돌리려는 시도를 막기 위해 근거를 남긴다.
        #     `좋아`     오탐 6건 — "기분이 안 좋아" · "하나도 안 좋아"
        #                          · "좋아하는 사람이 생겼어요"(flutter.thrill)
        #     `좋아요`   오탐 1건 — "마음이 안 좋아요"
        #     `기분이좋` 오탐 1건 — "기분이 좋지 않아요"
        #                → 그래서 어미까지 붙인 `기분이좋아`로 넣었다
        #
        #   ⚠ "좋아요" 단독 입력은 여전히 미분류다. 위기 경로처럼 **단독 입력
        #     정확 일치 층**을 열면 잡히지만 열지 않기로 했다(사용자 결정) —
        #     위기는 놓치면 사람이 위험하지만 이건 선택 화면이 나올 뿐이다.
        #     1건을 위해 층을 여는 비용이 크고, 열면 "이것도 단독으로"가 계속 나온다.
        #     부정 표현 처리와 함께 볼 것.
        #
        #   ⚠ "괜찮아요"는 이 목록의 대상이 아니다. **평가형**이라 감정을 직접
        #     말한 것이 아니고, 아래 [placeholder] 기록이 "평가형이 가장 나쁘다"고
        #     판정한 그 유형이다. NO_MATCH → 선택 화면이 설계된 동작이다.
        keywords: [즐거, 즐겁, 신나, 신난, 재밌, 재미있, 행복해, 행복하, 웃음이, 기분좋, 최고야, 날아갈것, 룰루랄라, 짱이야, 개꿀, 좋아죽겠, 웃겨죽,
                   신남, 텐션, 하하, ㅋㅋ, 기쁘, 빵터질, 상쾌, 후련, 살맛, 신바람, 끝내주, 날아갈듯, 반가, 흐뭇, 유쾌, 발랄, 활기차, 팔팔, 기쁜,
