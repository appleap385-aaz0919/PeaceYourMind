# =====================================================================
# channel_reviewed_out.yaml — 검토를 마치고 제외한 채널 기록
#
# ---------------------------------------------------------------------
# 목적 — blocklist와 무엇이 다른가
#
#   channel_allowlist.yaml    "이 채널만 쓴다"           (승인 목록)
#   channel_blocklist.yaml    "이 채널은 쓰지 않는다"     (승인됐다가 문제된 채널)
#   channel_reviewed_out.yaml "이 채널은 이미 검토했다"   (승인된 적 없음)
#
#   이 파일은 차단 장치가 아니라 **작업 기록**이다.
#   suggest_channels.py는 월 1회 돌고 매번 같은 상위 채널을 데려온다.
#   제외 판단이 끝난 채널이 다시 올라오면 같은 조사를 반복하게 되고,
#   검토 대상 상위 N개의 자리도 낭비된다.
#
#   그래서 배치는 이 파일을 보지 않는다. 화이트리스트에 없으면 애초에
#   수집되지 않으므로 볼 이유가 없다. 이 파일을 읽는 것은
#   suggest_channels.py 하나뿐이며, 하는 일은 두 가지다:
#     1. 검토 시트에 "기검토 제외"로 표시한다 (판단 근거와 함께)
#     2. 상위 N 선정에서 빼서 새 후보에게 자리를 넘긴다
#
# ---------------------------------------------------------------------
# 필수 필드
#   channel_id          "UC"로 시작하는 24자 채널 ID
#   channel_name        검토 당시의 채널명 (이후 바뀔 수 있다)
#   criterion           걸린 승인 기준 번호 (channel_allowlist.yaml 참조)
#                       "0"=범위 / "1"=정체 확인 / "2"=이단 배제 /
#                       "3"=콘텐츠 성격 / "4"=자동 점검
#                       여러 개면 "1·3"처럼 적는다
#   reason              무엇을 보고 그렇게 판단했는지. 근거가 된 제목·문구를
#                       그대로 인용한다 — 나중에 재검토할 때 원본이 된다
#   reviewed_at         검토일 (YYYY-MM-DD)
#   reviewed_by         검토자
#   recheckable         채널이 바뀌면 통과할 수 있는가
#                       true  = 조건이 충족되면 다시 볼 가치가 있다
#                       false = 채널이 바뀌어도 통과할 수 없다
#
# 선택 필드
#   recheck_condition   recheckable: true일 때 무엇이 바뀌면 되는지.
#                       비워두면 "다시 보긴 해야 하는데 조건이 불명"이라는 뜻이다
#
# ---------------------------------------------------------------------
# recheckable을 나누는 기준
#
#   false로 두는 것은 **채널의 정체성 자체가 범위 밖**인 경우다.
#     - 기준 0 (개신교·한국어 범위 밖) — 채널이 바뀐다고 교파가 바뀌지 않는다
#     - 채널 정체성이 곧 제외 사유인 경우 (뉴스 채널, 종교비판 채널)
#
#   true로 두는 것은 **콘텐츠나 표기가 바뀌면 통과할 수 있는** 경우다.
#     - 기준 1 (정체 확인 실패) — 채널 설명에 홈페이지가 추가되면 통과한다
#     - 기준 3 중 톤 문제 — 제목 방식이 바뀌면 통과할 수 있다
#     - 기준 4 (자동 점검) — 업로드 패턴이 바뀌면 통과한다
#
#   ⚠ true라고 해서 다음 발굴에서 자동으로 재검토되지는 않는다.
#     이 파일에 있으면 상위 N에서 빠지므로, 재검토하려면 사람이
#     여기서 항목을 지워야 한다. 그것이 의도다 — 재검토는 판단이지
#     자동화 대상이 아니다.
# =====================================================================

