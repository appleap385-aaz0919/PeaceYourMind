apply plugin: 'com.android.application'

/*
 * 버전 — package.json이 단일 소스다. 손으로 적지 않는다.
 *
 * [왜 두 값을 계산으로 뽑는가]
 *   versionName  사용자와 "이 앱에 대해" 화면이 보는 값. package.json 그대로다
 *   versionCode  스토어가 보는 값. **정수여야 하고 단조 증가해야 한다.**
 *                올리는 것을 잊으면 업로드가 거부되고, 손으로 적으면
 *                versionName과 어긋난다 — 둘이 갈리면 어느 빌드인지 알 수 없다.
 *
 * 규칙  major*10000 + minor*100 + patch      0.1.0 -> 100
 *       ⚠ minor·patch가 99를 넘으면 자리가 겹친다. 그 전에 규칙을 바꿀 것.
 *
 * ⚠ vite.config.js도 같은 package.json에서 __APP_VERSION__을 읽는다.
 *   세 곳(앱 화면·versionName·versionCode)이 한 파일에서 나온다.
 */
def pkg = new groovy.json.JsonSlurper().parse(file("../../package.json"))
def parts = pkg.version.tokenize('.').collect { it.toInteger() }
if (parts.size() != 3) {
    throw new GradleException("package.json version이 major.minor.patch 형태가 아닙니다: ${pkg.version}")
}
if (parts[1] > 99 || parts[2] > 99) {
    throw new GradleException("minor/patch가 99를 넘어 versionCode 자리가 겹칩니다: ${pkg.version}")
}
def pymVersionName = pkg.version
def pymVersionCode = parts[0] * 10000 + parts[1] * 100 + parts[2]

/*
 * AdMob App ID — **저장소에 값을 두지 않는다.**
 *
 * [⚠⚠ 이 값이 왜 위험한가]
 *   없거나 형식이 틀리면 **앱이 시작하자마자 죽는다.** 광고가 안 나오는 것이
 *   아니라 앱이 죽는다. JS가 광고를 안 켜도 같다 — Mobile Ads SDK가 앱 시작
 *   시점에 매니페스트의 meta-data를 읽기 때문이다("Missing application ID").
 *
 * [⛔ 그래서 조용히 빈 값으로 가지 않는다 — 빌드가 선다]
 *   빈 문자열을 넣으면 빌드는 성공하고 **실행할 때 죽는다.** 실패를 빌드로
 *   당겨 온다. 2026-09-02에 작업 스케줄러가 조용히 실패한 직후에 정한 원칙이다.
 *
 * ⚠ 새로 clone하면 이 파일이 없어 빌드가 선다. 그것이 의도다 —
 *   메시지가 무엇을 하라고 말한다. HANDOFF 3절 실행 환경 참조.
 */
def admobFile = rootProject.file("admob.properties")
if (!admobFile.exists()) {
    throw new GradleException(
        "AdMob App ID가 없습니다.\n" +
        "  android/admob.properties.example 을 android/admob.properties 로 복사하고 값을 채우세요.\n" +
        "  시험용 데모 ID(계정 불필요): ca-app-pub-3940256099942544~3347511713\n" +
        "  ⛔ admob.properties는 저장소에 커밋하지 않습니다."
    )
}
def admobProps = new Properties()
admobFile.withInputStream { admobProps.load(it) }
def pymAdmobAppId = admobProps.getProperty("admob.appId", "").trim()
if (!(pymAdmobAppId ==~ /ca-app-pub-\d+~\d+/)) {
    throw new GradleException(
        "admob.appId 형식이 틀렸습니다: '${pymAdmobAppId}'\n" +
        "  ca-app-pub-<숫자>~<숫자> 여야 합니다. (~ 앞뒤를 확인하세요 —\n" +
        "  / 로 구분되는 것은 App ID가 아니라 광고 단위 ID입니다.)"
    )
}

/*
 * 배너 광고 단위 ID — 2026-09-02에 환경변수에서 이 파일로 옮겼다 (HANDOFF 2.102).
 *
 * [⚠⚠ App ID와 실패의 모양이 정반대다]
 *   App ID가 없으면 앱이 **즉시 죽는다.** 단위가 없으면 **아무 일도 안 일어난다** —
 *   adsEnabled가 false가 되어 광고도 고지도 없는 앱이 조용히 나가고,
 *   데모 검사는 "데모가 있는가"만 보므로 **게이트가 전부 통과한다.**
 *   ★ 데모가 남는 실패보다 신호가 더 없다. 화면에 배너만 없을 뿐이다.
 *   → 그래서 여기서도 형식을 검사한다. 빈 값으로 조용히 가지 않는다.
 */
def pymAdmobBannerId = admobProps.getProperty("admob.bannerId", "").trim()
if (!(pymAdmobBannerId ==~ /ca-app-pub-\d+\/\d+/)) {
    throw new GradleException(
        "admob.bannerId 형식이 틀렸습니다: '${pymAdmobBannerId}'\n" +
        "  ca-app-pub-<숫자>/<숫자> 여야 합니다 (빗금 / 로 구분되는 광고 단위 ID).\n" +
        "  물결 ~ 로 구분되는 것은 단위가 아니라 App ID입니다 — admob.appId 쪽입니다.\n" +
        "  고칠 곳  android/admob.properties  의  admob.bannerId"
    )
}

/*
 * 릴리스에 **데모 광고 ID가 실리는 것**을 막는다 (2026-09-02 · HANDOFF 2.99).
 *
 * [왜 필요한가 — 이 값은 틀려도 화면이 멀쩡하다]
 *   데모 ID를 그대로 두고 출시해도 **광고가 잘 나온다.** 구글의 시험 광고가
 *   뜨기 때문이다. 수익만 0이고 아무 신호가 없다 —
 *   3절 「일하는 방식」 ⓪-2가 말하는 "실패가 성공처럼 보이는" 자리다.
 *   ⚠ 값이 **없거나 형식이 틀릴 때**는 반대로 앱이 즉시 죽는다(위 형식 검사).
 *     두 실패의 모양이 정반대라 장치도 둘이 필요하다.
 *
 * [왜 테스트가 아니라 여기인가]
 *   ⛔ npm test로는 못 잡는다 — 데모 ID는 **debug에서는 있어야 정상**이고,
 *     build:app에는 debug/release 구분이 없다.
 *   ⛔ appbuild.test.js도 반쪽이다 — dist-app(웹 자산)만 보므로 배너 단위는
 *     잡아도 App ID는 못 본다(APK의 resValue다).
 *   ★ 릴리스 산출물을 만드는 것은 로컬 gradle뿐이다. 막아야 할 자리가 여기다.
 *
 * ★ assembleRelease와 **bundleRelease를 함께** 막는다.
 *   Play가 받는 것은 AAB다 — assemble만 막으면 정작 올리는 산출물이 안 걸린다.
 */
def DEMO_AD_PUBLISHER = "3940256099942544"

def verifyNoDemoAdIds = tasks.register("verifyNoDemoAdIds") {
    description = "릴리스 산출물에 구글 데모 광고 ID가 남아 있지 않은지 본다"
    doLast {
        def problems = []

        // ① App ID — gradle이 이미 admob.properties에서 읽어 두었다.
        if (pymAdmobAppId.contains(DEMO_AD_PUBLISHER)) {
            problems << """  [1] App ID가 아직 **구글 데모 값**입니다.
      지금 값   ${pymAdmobAppId}
      고칠 곳   android/admob.properties  의  admob.appId
      무엇으로  AdMob 콘솔에서 이 앱을 등록하고 받은 App ID (물결 ~ 로 구분되는 값)
      ⚠ 광고 단위 ID(빗금 / 로 구분)를 여기 넣지 마세요. 다른 값입니다."""
        }

        // ② 배너 단위 ID — cap sync가 넣어 둔 웹 자산을 훑는다.
        def assetsDir = file("src/main/assets/public")
        def hits = []
        if (assetsDir.exists()) {
            fileTree(dir: assetsDir, includes: ["**/*.js", "**/*.html", "**/*.json"])
                .each { f ->
                    if (f.text.contains(DEMO_AD_PUBLISHER)) {
                        hits << f.name
                    }
                }
        }
        if (!hits.isEmpty()) {
            problems << """  [2] 앱 번들에 **구글 데모 광고 단위**가 남아 있습니다.
      걸린 파일  ${hits.join(', ')}
      고칠 곳   빌드할 때 넘기는 환경변수  ADMOB_BANNER_ID
      무엇으로  AdMob 콘솔에서 만든 배너 광고 단위 ID (빗금 / 로 구분되는 값)
      다시 하기  ADMOB_BANNER_ID=<실제 단위> npm run sync:app
                ⚠ sync를 다시 해야 번들이 바뀝니다. gradle만 다시 돌리면 그대로입니다."""
        }

        // ③ ★ **실제 단위가 번들에 실렸는가.** ①②의 반대 방향이다.
        //   ①②는 "데모가 남았는가"를 본다 — 값이 아예 없으면 둘 다 통과한다.
        //   그것이 2.101이 찾은 구멍이고, 사람이 알아챌 신호가 하나도 없다.
        //   admob.properties의 값과 **같은 값**을 찾는다. 그래야
        //   "값은 고쳤는데 cap sync를 안 돌렸다"까지 함께 걸린다.
        if (!assetsDir.exists()) {
            problems << """  [3] 앱 번들(src/main/assets/public)이 없습니다.
      다시 하기  npm run sync:app"""
        } else {
            def hasUnit = fileTree(dir: assetsDir, includes: ["**/*.js", "**/*.html", "**/*.json"])
                .any { it.text.contains(pymAdmobBannerId) }
            if (!hasUnit) {
                problems << """  [3] 앱 번들에 **배너 광고 단위가 없습니다.**
      있어야 할 것  admob.properties 의 admob.bannerId 와 같은 값
      이대로 나가면 adsEnabled가 false가 되어 **광고도 고지도 없는 앱**이 됩니다.
      화면에는 배너만 없을 뿐이라 아무도 알아채지 못합니다.
      다시 하기  npm run sync:app
                값을 고쳤어도 sync를 다시 해야 번들이 바뀝니다."""
            }
        }

        if (!problems.isEmpty()) {
            throw new GradleException(
                "릴리스에 데모 광고 ID가 남아 있습니다 — 이대로 출시하면 " +
                "**시험 광고가 나가고 수익이 0이 됩니다.**\n" +
                "화면은 멀쩡해 보이므로 사람이 알아채지 못합니다. 그래서 여기서 세웁니다.\n\n" +
                problems.join("\n\n") + "\n\n" +
                "  고친 뒤 확인   설치해서 **앱이 뜨는지부터** 봅니다(App ID가 틀리면 즉시 죽습니다).\n" +
                "                그다음 logcat에서 bannerAdLoaded를 봅니다. (HANDOFF 2.98)"
            )
        }
    }
}

// ★ AAB를 함께 막는다. Play가 받는 것은 AAB다.
tasks.matching { it.name in ["assembleRelease", "bundleRelease"] }.configureEach {
    dependsOn verifyNoDemoAdIds
}

android {
    namespace = "io.github.appleap385.peaceinmind"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "io.github.appleap385.peaceinmind"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode pymVersionCode
        versionName pymVersionName
        // 매니페스트의 @string/admob_app_id 를 여기서 채운다.
        // ⛔ res/values에 파일로 두지 않는다 — 그러면 값이 저장소에 남는다.
        resValue "string", "admob_app_id", pymAdmobAppId
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
