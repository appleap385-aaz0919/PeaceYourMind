# =====================================================================
# themes.yaml — PYM 주제 체계 초안 (Phase 0, v0.1)
#
# 역할: 감정(세분류 24)과 영상 사이의 매칭 단위.
#   감정 → 구절: verses.json의 emotion_tags (구절 단위, Phase 1)
#   감정 → 영상: 이 파일의 mapping (주제 단위, 배치가 사용)
#   구절 → 영상: 구절의 theme 필드가 같은 주제의 영상을 가리킨다
#
# 배치는 화이트리스트 채널의 영상 "제목"을 각 주제의 title_keywords로
# 태깅한다. 설명란은 보지 않는다 (FYM 교훈 — 설명란 검사는 역설적 오차단을 낳는다).
#
# [키워드 설계 원칙 — FYM 교훈 승계]
#   1. 단어가 장르를 부른다. 사전적 의미가 아니라 실제 유튜브 검색 결과가 기준이다.
#      각 주제의 caution에 알려진 오염 경로를 기록했다. 신규 키워드는
#      실제 상위 결과를 확인한 뒤 넣는다.
#   2. 짧은 키워드는 일상어를 삼킨다. 부분 매칭 전제이므로
#      "이 문자열이 다른 단어 안에 들어가는가"를 먼저 본다.
#   3. 한글은 음절 단위다. 어간을 줄일 때마다 활용형을 실측한다.
#
# [전역 주의 — 태깅에 쓰지 않는 단어]
#   은혜      기독교 유튜브 제목의 절반에 들어간다. 변별력 0, 전부 태깅됨.
#   치유      극단적 신유 집회·안수 콘텐츠를 부른다. rest/renewal로 대체.
#   축복      번영신학 계열 콘텐츠 비중이 높다. 쓰지 않는다.
#   간증      자극적 서사물("암 말기에서…")이 주류. 쓰지 않는다.
#             ※ 아래 [채널 승인과 태깅은 별개다] 참조 — 승인된 채널의 간증
#               영상이 어느 주제에도 안 붙는 것은 의도된 동작이다.
#   기적      번영신학 + 자극 서사 양쪽을 부른다. 쓰지 않는다.
#   기도응답  같은 이유. guidance/trust로 대체.
#
# [채널 승인과 콘텐츠 태깅은 별개다 — 2026-08-18 명시]
#   위 금지어는 **영상 제목 태깅 규칙**이지 채널 승인 기준이 아니다.
#   둘은 서로 다른 층에서 작동한다.
#
#     채널 승인   channel_allowlist.yaml — "이 채널의 영상을 수집할 것인가"
#     주제 태깅   이 파일 title_keywords — "수집한 영상을 어느 화면에 붙일 것인가"
#
#   그래서 **승인된 채널의 영상이라도 어느 주제에도 태깅되지 않을 수 있다.**
#   이것은 결함이 아니라 의도된 동작이다. 태깅되지 않은 영상은 세분류 화면에
#   노출되지 않고 `untagged`로 리포트에만 집계된다 (PLAN.md 3.3).
#
#   [실제 사례] PLAN.md 5.1 초기 후보 풀은 "CBS(성서학당·새롭게하소서 등
#   계열 채널 포함)"을 지목한다. 그런데 '새롭게하소서'는 CBS의 대표 **간증
#   프로그램**이다. 채널이 승인되더라도 그 간증 영상들은 위 금지어 원칙상
#   어떤 title_keywords에도 걸리지 않아 화면에 뜨지 않는다.
#
#   ⚠ 나중에 "승인한 채널인데 왜 영상이 안 나오지?"로 혼동하지 말 것.
#     그 채널의 콘텐츠 성격이 PYM의 주제 체계와 맞지 않는다는 뜻이며,
#     고칠 것은 태깅 규칙이 아니라 **그 채널을 승인할 이유가 있었는지**다.
#     untagged 비율이 높은 채널은 승인 재검토 신호로 읽는다.
# =====================================================================

version: "0.1.0"

# ---------------------------------------------------------------------
# 주제 정의 (24개)
#
# 필드
#   label            화면 표시명
#   intent           이 주제가 감정에 대해 하려는 일 (구절·영상 선정의 기준)
#   title_keywords   영상 제목 태깅 키워드 초안 — 전수 검토 전. 실측 후 확정
#   caution          알려진 오염 경로 / 태깅 함정
# ---------------------------------------------------------------------

themes:

  # ── 불안 계열을 받치는 주제 ──────────────────────────────

  - id: peace
    label: 평안
    intent: 불안을 억누르지 않고, 마음을 가라앉히는 방향으로 받친다. 서비스명(Peace in Mind)의 중심 주제.
    title_keywords: [평안, 평강, 두려워, 염려]
    caution: >
      "염려"는 마 6:34 계열 설교 제목에 흔해 유효하지만, "염려 마세요" 류
      세속 힐링 콘텐츠도 있다 — 화이트리스트 전제라 허용 가능.
      "두려워"는 2026-08-19 실측으로 "두려워하지"·"두려워말라"를 대체했다
      (retag_titles.py --probe 두려워 · 적중 6건 전부 정탐, 순증 3건 —
      "보라 너희는 두려워 말고"·"누구를 두려워하리요"처럼 어미가 갈려
      두 키워드가 모두 빗나가고 있었다).
      ⚠ 남은 위험은 "하나님을 두려워하라"(경외) 계열이다. 그쪽은 불안을
      가라앉히는 방향이 아니라 반대쪽이다. 현재 1,067건에는 없고,
      나타나면 이 키워드를 다시 좁힌다.

  - id: trust
    label: 맡김
    intent: 걱정의 대상을 통제하려는 마음을 내려놓는 방향. 시 55:22, 벧전 5:7 계열.
    title_keywords: [맡기, 맡겨, 의지, 신뢰, 신실]
    caution: >
      "의지"는 "의지력"(자기계발)과 충돌한다. 화이트리스트 채널이라 위험은
      낮지만 실측 필요. "믿음"은 변별력이 낮아 뺐다(제목 빈도 과다).
      "신실"은 2026-08-19 신설 — 적중 9건 전부 정탐, 순증 6건
      ("주 신실하심 놀라워"·"오 신실하신 주"·"영원히 신실하신 왕").
      맡김의 근거가 하나님의 신실이라는 점에서 이 주제에 둔다. "신뢰"(내가
      믿는 쪽)와 방향이 반대인 짝이라 둘 다 필요하다.

  - id: courage
    label: 담대함
    intent: 긴장·두려움 앞에서 움츠러들지 않게 하는 방향. 수 1:9, 사 41:10 계열.
    title_keywords: [담대, 강하고, 두려움을 이기, 용기]
    caution: '"강하고"는 "강하고 담대하라" 관용구를 노린 것. 단독 "강한"은 쓰지 않는다.'

  # ── 분노 계열 ────────────────────────────────────────────

  - id: self_control
    label: 마음 다스림
    intent: 짜증·격분을 정죄하지 않으면서 가라앉히는 방향. 잠언 계열.
    title_keywords: [노하기를, 마음을 다스리, 화가 날 때, 분을 품]
    caution: >
      분노 관련 어휘는 FYM에서 부분 매칭 사고가 있었던 영역이다("분해"가
      차분해·충분해에 걸림). 반드시 어절 이상 길이로 유지한다.

  - id: justice
    label: 공의
    intent: 억울함을 "네가 참아라"로 누르지 않고, 갚으시는 분께 넘기는 방향. 시 37, 롬 12:19 계열.
    title_keywords: [공의, 억울할 때, 신원, 갚으시]
    caution: '"심판"은 위기 정책(죄·심판 프레임 배제)과 충돌 소지가 있어 쓰지 않는다.'

  - id: forgiveness
    label: 용서
    intent: 분노의 대상을 향한 매임에서 풀려나는 방향. 강요하는 톤의 콘텐츠는 배제.
    title_keywords: [용서]
    caution: >
      "용서해야 합니다" 류 당위 설교는 억울함 상태의 사용자에게 2차 가해가
      될 수 있다. 키워드는 유지하되 Phase 1에서 이 주제의 구절·톤을
      보수적으로 고른다. 매핑 우선순위도 justice보다 뒤에 둔다.

  # ── 답답함 계열 ──────────────────────────────────────────

  - id: guidance
    label: 인도
    intent: 막막함에 "길을 아시는 분" 프레임을 놓는 방향. 시 23, 잠 3:5-6 계열.
    title_keywords: [인도하, 길을 여, 앞길, 방향을 잃]
    caution: >
      "길"단독은 일상어 오탐 폭탄. 반드시 결합형으로만.
      "인도하"는 2026-08-19 실측으로 "인도하시"를 대체했다 — 적중 1건 정탐
      ("구원으로 인도하는"). 존칭 어미를 떼도 "인도하"는 동사 어간이라
      국명 "인도"만으로는 걸리지 않는다("인도 선교"는 정규화 후 "인도선교").
      ⚠ 다만 "인도 하나님"류 띄어쓰기는 정규화가 접어 걸린다. 현재 데이터에
      없고, 나타나면 "인도하시"로 되돌린다.

  - id: patience
    label: 기다림
    intent: 진전 없음의 시간에 의미를 놓는 방향. 사 40:31, 합 2:3 계열.
    title_keywords: [기다림, 기다리는 시간, 인내, 때가 되면]
    caution: ""

  - id: lament
    label: 탄식
    intent: 억눌림·슬픔을 미화하지 않고 하나님 앞에 쏟아놓는 것 자체를 허용하는 방향. 시편 탄식시 계열.
    title_keywords: [탄식, 부르짖, 쏟아놓]
    caution: >
      감정 증폭이 아니라 "말해도 된다"는 허용이 목적이다. FYM 원칙(부정
      감정 카테고리는 완화·환기 방향)과 같은 축이며, 슬픔 몰아보기류가
      태깅되지 않는지 실측한다.

  # ── 우울 계열 ────────────────────────────────────────────

  - id: comfort
    label: 위로
    intent: 슬픔을 판단하지 않고 곁에 있는 방향. 시 34:18, 마 5:4 계열.
    title_keywords: [위로, 슬플 때, 마음이 무거]
    caution: '"위로"는 세속 힐링 콘텐츠에도 흔하지만 화이트리스트 전제라 허용.'

  - id: love
    label: 사랑받음
    intent: 외로움에 "혼자가 아니다"가 아니라 "사랑받고 있다"를 놓는 방향. 사 43:4, 롬 8 계열.
    title_keywords:
      [사랑하시, 사랑하심, 사랑하신, 사랑하셨, 사랑받, 귀하게,
       그 사랑, 주 사랑, 주의 사랑, 사랑한다 말하]
    caution: >
      "사랑" 단독은 변별력 없음(연애·CCM 제목 전반). 결합형만.
      2026-08-19 보강 — **어간을 "사랑하"까지 줄이지 않았다.** 실측하니
      적중 9건 중 4건이 방향이 반대였다("우리가 주를 더욱 사랑하고",
      "내 주 되신 주를 참 사랑하고", "그러므로 사랑하자"). 이 주제는
      사랑받음이지 사랑함이 아니다. 그래서 **주어를 하나님으로 묶는 표지**만
      남겼다 — 존칭 어미(시·심·신·셨)와 소유격 결합형이다.
        사랑하심/사랑하셨   "예수 사랑하심을" · "끝까지 사랑하셨어요"
        그 사랑/주 사랑/주의 사랑  "주의 인자하신 그 사랑이" · "주 사랑 놀라와"
        사랑한다 말하        "사랑한다 말하시네" — 평서형이지만 화자가 하나님
      "사랑하신"은 실측 적중 0건이다. 활용형 대칭으로만 넣었고 이득도 0이다.

  - id: presence
    label: 동행
    intent: 외로움·막막함에 임마누엘 프레임. 시 23:4, 마 28:20 계열.
    title_keywords: [동행, 함께하시, 임마누엘, 혼자가 아니]
    caution: ""

  - id: renewal
    label: 회복
    intent: 상실 이후의 시간을 받치는 방향. 욜 2:25, 시 147:3 계열.
    title_keywords: [회복, 다시 일어, 새롭게 하시]
    caution: '"회복"은 신유 집회 제목에도 쓰인다 — 화이트리스트 + 채널 성격 검토로 방어.'

  # ── 지침/무기력 계열 ─────────────────────────────────────

  - id: rest
    label: 쉼
    intent: 번아웃·피로에 "쉬어도 된다"는 허용. 마 11:28, 시 23:2 계열.
    title_keywords: [쉼, 안식, 쉬게 하리라, 수고하고 무거운]
    caution: '"쉼"은 1음절 — "쉼터", "쉼표" 등 확인 필요. 화이트리스트 전제로 허용 가능 범위.'

  - id: strength
    label: 새 힘
    intent: 의욕 없음을 질책하지 않고 힘의 출처를 바꾸는 방향. 사 40:29-31, 빌 4:13 계열.
    title_keywords: [새 힘, 힘을 주시, 독수리, 능력 주시]
    caution: '"독수리"는 사 40:31 설교 관용어를 노린 것. 실측으로 확인한다.'

  # ── 기쁨·설렘·평온·심심함 계열 ──────────────────────────

  - id: gratitude
    label: 감사
    intent: 감사·뿌듯함을 예배로 잇는 방향. 시 100, 살전 5:18 계열.
    title_keywords: [감사, 범사에, 선하심]
    caution: >
      "선하심"은 2026-08-19 신설 — 적중 4건 전부 정탐, 순증 3건
      ("주님의 선하심"). 하나님의 선하심을 노래하는 곡은 감사의 언어이고,
      존칭 어미가 붙어 있어 일상어와 겹치지 않는다.

  - id: joy_praise
    label: 기쁨의 찬양
    intent: 즐거움을 함께 기뻐하는 밝은 찬양·경배. 시 150 계열.
    title_keywords: [기쁨, 기뻐, 찬양하라, 경배, 송축]
    caution: >
      "기뻐"는 2026-08-19 실측으로 "기뻐하"를 대체했다 — 적중 7건, 순증 3건
      ("주 안에서 기뻐해"·"주 예수 기뻐 찬양해"). 어미가 "-해"로 갈리는
      곡명을 놓치고 있었다.
      "송축"은 신설 — 적중 4건 전부 정탐("송축해 내 영혼", 시 103:1 관용어).
      드문 어휘라 오탐이 없다.
      ⚠ **이미 있던 오탐 2건은 이 개정으로 고쳐지지 않는다.** "불행을 기뻐하는
        죄"·"하나님 백성의 패망을 기뻐하는 죄"가 기쁨의 찬양으로 태깅돼 있다.
        "기뻐하" 시절부터 있던 것이고 어간을 줄여도 그대로다. 부정 키워드가
        없으면 못 막는다 — HANDOFF 4.5에 판단을 남겼다.

  - id: new_thing
    label: 새 일
    intent: 기대·설렘에 "새 일을 행하시는" 프레임. 사 43:19 계열.
    title_keywords: [새 일, 새로운 시작, 시작하는]
    caution: ""

  - id: quiet_worship
    label: 잔잔한 찬양
    intent: 여유·안정 상태의 배경이 되는 조용한 찬양·연주. 여러 감정의 공용 풀.
    # 2026-08-20 개정 — 검색어를 실제 제목 어휘로 바꿨다.
    #
    #   개정 전 6종은 **한 건도 걸리지 않았다** (실측 코퍼스 1,067건 대비 0건).
    #     잔잔한 찬양 · 조용한 찬양 · 묵상 찬양 · 피아노 찬양 · CCM 피아노 · 새벽 찬양
    #   전부 **검색창에 칠 말**이지 교회가 자기 영상 제목에 쓰는 말이 아니다.
    #   `잔잔`이라는 두 글자가 코퍼스 전체에 0회다. FYM은 그 말로 검색해서
    #   영상을 찾았지만, PYM은 채널이 자기 관행대로 붙인 제목을 받는다.
    #   HANDOFF 2.13이 진단한 "검색으로 영상을 찾던 세계의 어휘"가 이 주제에
    #   통째로 남아 있었다.
    #
    #   실제로 교회·사역단체가 쓰는 말 (전부 오탐 0 실측, --probe로 건별 확인)
    #     찬양대        6건  "꿈의교회, 희망의 찬양대_거룩하시다"
    #     Instrumental  4건  "8-1. 내 삶의 이유라 | Anointing Instrumental Series"
    #     연주곡        1건  "어노인팅 연주곡 시리즈 Vol.8 - 소망 (Hope) 전곡"
    #     CCM PIANO     1건  "[CCM PIANO] 훈계로 다스려주소서 피아노ver."
    #     피아노ver     1건  (위와 같은 영상. 표기 관행이라 따로 둔다)
    #
    #   ⚠ `Inst.`를 쓰지 않았다. 마침표 때문에 영문 단어 경계 규칙을 못 타고
    #     정규화 경로로 떨어져 `inst` 부분 매칭이 된다(install·instant도 걸린다).
    #     `Instrumental`을 그대로 쓰면 단어 경계로 정확히 갈린다.
    #
    #   ⚠ **`워십`을 넣지 않았다.** 넣으면 30건이 들어와 폴백이 22%까지 내려가지만,
    #     그 30건은 하이프레이즈·블레싱워십 같은 **고조된 예배 찬양 콘티**다.
    #     intent가 "조용한 찬양·연주"인데 일반 찬양까지 받으면 joy_praise와
    #     구분이 사라지고, 주제 집합 분리 작업과 정면으로 충돌한다.
    #     ⛔ 물량이 아쉽다고 여기에 `워십`·`찬양`을 넣지 말 것.
    #
    #   실측 효과 — 12건 태깅으로 5개 세분류가 살아났다
    #     폴백 33.3% → 25.5% · 20건 달성 19/24 → 22/24 · 폴백과다 5개 → 2개
    #     anger.irritation 0/12 → 12/20 · calm.ease 1/13 → 13/20
    #
    #   ⚠ 그래도 남는 문제 — 공급 채널이 **2개뿐**이다(꿈의교회 찬양대 6 ·
    #     ANOINTING Instrumental 5). 그래서 이 주제를 쓰는 5개 화면의 겹침이
    #     82~90%로 남는다. **어휘로는 여기까지다** — HANDOFF 3절 10번 참조.
    #
    # 2026-08-24 추가 — `피아노 찬양` · `연주 찬양`
    #
    #   ★ 이 둘은 **현재 코퍼스에서 0건이다.** 위 2026-08-20 개정이 "0건이라
    #     뺀다"고 판단한 어휘에 `피아노 찬양`이 들어 있었다. 다시 넣는 것이므로
    #     근거가 그때와 어떻게 다른지 적어 둔다.
    #
    #     2026-08-20의 근거   현재 코퍼스에 0건이다 → 뺀다
    #     2026-08-24의 근거   현재 코퍼스에 0건인 것은 같다. 그러나 3차 발굴이
    #                        데려온 **실제 채널의 실제 제목**에 이 관행이 있다.
    #                        승인되면 값이 생긴다 — 검색창 어휘가 아니다.
    #       택피아노      "[CCM Playlist] 감사가 줄어들던 날에 | 피아노 찬양 | [4시간]"
    #       mini Music   "[미니뮤직 LIVE] 실시간 연주 찬양 | 테마= 주께 더 가까이"
    #
    #   ⛔ **"0건이니 빼자"로 다시 지우지 말 것.** 이 둘은 공급 채널이 승인되기
    #     전까지 0건인 것이 정상이다. 지우려면 **택피아노·미니뮤직 계열 채널이
    #     allowlist에 없다는 것을 먼저 확인**할 것 (2026-08-24 기준 승인 안 됨).
    #
    #   ⚠ `찬양`이 들어가지만 위의 ⛔(워십·찬양 단독 금지)와 충돌하지 않는다.
    #     단독 `찬양`이 아니라 **피아노·연주와 묶인 복합어**라 고조된 콘티를 안 받는다.
    #     실측: 현재 1,067건에서 두 어휘 모두 적중 0건 — 회중 찬양 콘티를 안 건드린다.
    #
    #   ⛔ `주일찬양`은 검토하고 **뺐다** (2026-08-24). 적중 14건 · 순증 11건으로
    #     물량은 가장 크지만 전부 우리들교회 회중 찬양 콘티다. intent가
    #     "조용한 찬양·연주"인데 회중 찬양을 받으면 **joy_praise와 구분이 무너진다** —
    #     위 `워십`을 뺀 것과 정확히 같은 이유다.
    title_keywords:
      [찬양대, 연주곡, Instrumental, CCM PIANO, 피아노ver, 피아노 찬양, 연주 찬양]
    caution: >
      공용 풀이라 물량이 가장 많을 주제로 설계했으나, 실측에서는 공급 채널이
      2개뿐이라 오히려 가장 얇다. 채널당 상한이 여기서 가장 먼저 걸린다.

  - id: creation
    label: 창조 묵상
    intent: 평온 상태에서 자연·창조를 통한 묵상. 시 8, 시 19 계열.
    title_keywords: [창조, 자연 묵상, 하늘이 선포]
    caution: '풀이 얇을 수 있다. untagged 리포트를 보고 유지 여부를 판단한다.'

  - id: daily_word
    label: 오늘의 말씀
    intent: 지루함·새 자극에 가벼운 진입점이 되는 짧은 묵상·큐티. 공용 풀.
    title_keywords: [오늘의 말씀, 큐티, QT, 아침 묵상, 하루 묵상, 매일 성경]
    caution: '"QT"는 영문 2자 — 대소문자 정규화 후 단어 경계 매칭으로만.'

  - id: bible_story
    label: 성경 이야기
    intent: 새로운 자극을 원하는 상태에 성경 인물·배경 강해로 응답. 지적 호기심 진입점.
    # 2026-08-20 — 5종 중 4종이 실측 0건이었다(검색어 유물). 살아 있는 것은
    #   `강해` 하나뿐이고 그마저 꿈의교회 저녁예배 4건이 전부다.
    #   `성경 속`을 넣어 6건이 됐다 — "임용한 박사의 성경 속 전쟁" 계열.
    #   ⚠ `이야기`는 넣지 않았다. 14건이 걸리는데 대부분 CTS 광복 시리즈라
    #     성경 이야기가 아니다. `인물`·`열전`·`일대기`·`다시 읽`은 전부 0건.
    #   **키워드로는 여기까지다. 물량은 채널 발굴 대상이다** (HANDOFF 3절 10번).
    title_keywords: [성경 인물, 성경의 인물, 강해, 성경 배경, 성경 이야기, 성경 속]
    caution: >
      FYM에서 "이야기"는 막장 서사를 불렀다. 여기서는 "성경 이야기" 결합형만
      쓰고 "이야기" 단독은 금지. 화이트리스트 전제라 위험은 낮지만 원칙 유지.

  # ── 공용 · 특수 ──────────────────────────────────────────

  - id: hope
    label: 소망
    intent: 여러 부정 감정의 출구가 되는 공용 주제. 렘 29:11, 롬 15:13 계열.
    title_keywords: [소망, 희망을 잃, 절망 속에]
    caution: '"절망 속에" 류는 극복 서사 낚시 제목과 겹칠 수 있다 — 실측 필요.'

  - id: crisis_fixed
    label: (위기 전용 — 매핑 금지)
    intent: >
      위기 화면 전용 풀. 감정 매핑을 타지 않고 운영자 고정 큐레이션만 쓴다.
      죄·심판·형벌 프레임 배제 (PLAN 7절). 이 주제는 mapping에 절대 넣지 않는다.
    title_keywords: []
    caution: 배치에서 이 id가 mapping에 등장하면 빌드를 실패시킨다.

# ---------------------------------------------------------------------
# 감정 세분류 → 주제 매핑 (우선순위 순)
#
# 첫 번째 주제가 주 매칭, 이후는 보충 풀이다.
# 앱은 우선순위 순으로 영상을 섞되 주 매칭 비중을 높인다 (비율은 Phase 3에서 확정).
# 세분류 id는 FYM taxonomy.yaml과 동일하다 (이식 전제).
# ---------------------------------------------------------------------

mapping:
  anxiety.restless:      [peace, quiet_worship]
  anxiety.worry:         [trust, peace]
  anxiety.tension:       [courage, peace]

  anger.irritation:      [self_control, quiet_worship]
  anger.unfair:          [justice, lament, forgiveness]
  anger.rage:            [self_control, peace]

  frustration.stuck:     [guidance, hope]
  frustration.blocked:   [patience, hope]
  frustration.suppressed: [lament, comfort]

  sadness.sorrow:        [comfort, lament, hope]
  sadness.lonely:        [presence, love]
  sadness.loss:          [renewal, comfort]

  exhaustion.burnout:    [rest, renewal]
  exhaustion.tired:      [rest, quiet_worship]
  exhaustion.listless:   [strength, hope]

  # 2026-08-20 — joy 3종이 **같은 집합**이라 목록이 20건 전부 동일했다.
  #   집합이 같으면 풀이 같고 선정이 결정적이라 결과가 같아진다.
  #   ⚠ 구절 큐레이션의 축(감사 어휘 / 공을 돌림 / 신체 동작, 2.7절 확정 규칙 3)을
  #     영상 주제로 옮기려 했으나 **재료가 없었다.** 실측(1,067건):
  #       공을 돌림  주께 영광 0 · 영광 돌리 1 · 주가 하셨 0 · 주께 돌리 0
  #       신체 동작  춤추 0 · 뛰놀 0 · 손뼉 0 · 손을 들 0 · 춤을 0
  #     찬양 콘티 제목은 곡명 나열이라 그 축이 제목에 드러나지 않는다.
  #     **새 주제를 만들 근거가 없어 기존 2주제로 갈랐다.**
  #   joy.proud만 합집합을 갖는다 — 셋을 2주제로 가르면 하나는 겹칠 수밖에 없다.
  #   부분 겹침은 남지만 100% 동일은 사라진다.
  joy.proud:             [gratitude, joy_praise]
  joy.delight:           [joy_praise]
  joy.grateful:          [gratitude]

  flutter.anticipation:  [new_thing, hope]
  flutter.thrill:        [joy_praise, new_thing]

  calm.ease:             [quiet_worship, creation]
  calm.stable:           [quiet_worship, daily_word]

  # 2026-08-20 — boredom 2종도 같은 집합이었다. 구절 축을 그대로 쓴다
  #   (2.7절): dull = **다시 보게**, novelty = **모르는 것으로**.
  #   ⚠ novelty가 얇다(bible_story 6 + new_thing 1 + creation 1 = 8건).
  #     daily_word를 주면 15건으로 두꺼워지지만 dull과 겹침이 90%로 되돌아간다
  #     (실측). 얇은 쪽을 택했다 — 겹치는 두꺼움보다 얇은 구분이 낫다.
  boredom.dull:          [daily_word]
  boredom.novelty:       [bible_story, new_thing, creation]

# =====================================================================
# media_type — 영상을 말씀/찬양으로 가르는 축 (Phase 2 배치에서 구현)
#
# [주제 태깅과 다른 축이다]
#   주제(theme)      감정에 무엇으로 응답할 것인가   comfort · rest · guidance ...
#   media_type       그 응답을 어떤 형식으로 받을 것인가   말씀 / 찬양
#   한 영상은 둘 다 갖는다. theme=comfort 이면서 media_type=worship 인 영상이 있고,
#   같은 주제에 media_type=sermon 인 영상이 따로 있다.
#
# [판별 키워드 사전을 주제 태깅 사전과 분리한 이유 — 용도가 다르다]
#   themes[].title_keywords  "이 영상이 어느 감정 화면에 갈 것인가"를 정한다.
#                            그래서 전역 금지어(은혜·치유·축복·간증·기적)를 쓰지
#                            않는다 — 변별력이 없거나 잘못된 장르를 부르기 때문이다.
#   media_types[].title_keywords  "이 영상이 말씀인가 찬양인가"만 가린다.
#                            이미 수집된 영상을 분류하는 것이라 장르를 부를 위험이
#                            없다. 그래서 "설교" 같은 단어를 여기서는 쓴다
#                            (발굴 검색어에서는 너무 넓어 피했지만, 여기서는
#                            그 넓음이 오히려 정확하다).
#   ⚠ 두 사전을 섞지 말 것. 한쪽 원칙을 다른 쪽에 적용하면 둘 다 망가진다.
#
# [쿼터는 늘지 않는다]
#   판별에 쓰는 것은 배치가 이미 받아오는 값뿐이다 —
#   채널 content_type(allowlist), 영상 title·duration(videos.list).
#   추가 API 호출이 없다.
# =====================================================================

media_types:

  - id: sermon
    label: 말씀
    intent: 내용을 듣고 싶은 상태에 맞는 형식. 설교·강해·묵상·큐티.
    title_keywords:
      [주일예배, 수요예배, 새벽기도, 금요기도, 저녁예배, 청년예배,
       설교, 강해, 말씀, 묵상, 큐티, QT, 성경통독, 매일성경, 세미나, 특강]
    caution: >
      "말씀"은 찬양 제목에도 쓰인다("말씀 위에 서리라"). 단독으로 판정하지 않고
      아래 우선순위 규칙을 따른다. 본문 장절 패턴이 더 강한 신호다.

  - id: worship
    label: 찬양
    intent: 듣기만 하면 되는 형식. 지치거나 불안한 상태에 부담이 적다.
    title_keywords:
      [찬양, 워십, 경배, CCM, 특송, 연주, 피아노, 찬양대, 워십팀,
       콘티, 메들리, 라이브클립, 예배실황, 성가]
    caution: >
      "예배"는 양쪽에 다 걸린다(주일예배 설교 / 찬양예배). 그래서 sermon 쪽은
      "주일예배·수요예배"처럼 예배 종류와 결합한 형태만 넣었다.

# 본문 장절 패턴 — sermon의 가장 강한 신호
#   "요한복음 3:16", "에스겔 40장", "누가복음 8:19-21" 형태.
#   책 이름 66권은 scripts/lib/krv_source.py의 BOOK_KEYS를 재사용한다
#   (정식 명칭 + 표준 약어 132개가 이미 들어 있다. 사전을 두 벌 두지 않는다).
#   찬양 제목에는 장절이 거의 붙지 않아 변별력이 높다.
scripture_reference_signal: true

# 길이 신호 — 보조. 제목으로 갈리지 않을 때만 쓴다(4순위).
#   설교는 길고 찬양 한 곡은 5분 내외다. 다만 찬양 메들리·예배 실황은 1시간을
#   넘기도 하므로 제목·장절·채널이 먼저 답한 것을 뒤집지 않는다.
#
# ⚠ 주석이 "단독 판정 근거로 쓰지 않는다"고 적혀 있었는데 **사실과 다르다.**
#   앞의 세 단계가 답을 못 내면 이 규칙이 **최종 판정을 내린다**(reason=duration).
#   "1순위가 아니다"와 "단독 판정이 아니다"는 다른 말이다 — 실제로는 단독이다.
#   그 사실을 알고 임계를 정해야 한다 (HANDOFF 2.80 ④).
duration_signal:
  # ★ 2026-08-28 — 1800 → 1200으로 낮췄다 (사용자 결정 · 안 E).
  #
  # [무엇을 풀었나]
  #   10~30분 구간에 갇힌 unknown이 판별 실패의 본체였다. unknown 81건의
  #   **100%가 이 사각지대**에 있었고(HANDOFF 2.73 ②), 그 다수가 20분대 강해다.
  #     젠센 프랭클린의 부흥 17~23분 · 존 파이퍼의 더 바이블 20~22분
  #     믿어야 산다 24~32분 · 하바드 21~28분
  #   1200으로 낮추면 합집합 2,055건에서 unknown 65건이 sermon으로 풀리고,
  #   위 네 시리즈 28건 중 23건이 해소된다.
  #
  # [왜 2026-08-27까지는 위험하다고 봤나 — 실측으로 뒤집혔다]
  #   2.73 ④에서 이 안은 "제3범주(간증·인터뷰·뉴스)를 말씀으로 몬다"는 이유로
  #   위험 판정을 받았다(1200s에서 65건 중 40건이 제3범주). 그런데
  #   **제3범주가 주제 태깅되는 경우가 0건**이고, 40건 중 36건은 이미
  #   promo_reason이 폴백에서 빼고 있다(2.75). sermon으로 오분류돼도
  #   **화면에 나오지 않는다.** 제3범주 필터가 이 안의 전제를 바꾼 것이다.
  #
  # ⚠ 남는 위험은 **사전에 없는 제3범주 2건**이다. 새 프로그램이 생기면
  #   그만큼 늘어난다 — THIRD_PARTY_PROGRAMS를 따라 늘려야 한다(selection.py).
  #
  # ⛔ 더 낮추지 말 것. 900s까지 내리면 제3범주가 53건으로 늘고 그중
  #   폴백에서 안 걸리는 것이 5건이 된다. 1200이 실측으로 잡은 선이다.
  sermon_min_seconds: 1200   # 20분 이상이면 sermon 쪽
  #
  # ⚠ 하한 600은 **실측 근거가 없는 추정치다** ("찬양 한 곡 5분 + 메들리 여유").
  #   이 규칙에 걸려 찬양으로 확정된 52건 중 6건(12%)이 말씀 계열이다.
  #   낮추면 오분류 4~5건을 구제하는 대신 unknown이 18~42건 늘고, unknown은
  #   **양쪽 탭에 다 뜨므로** 중복 노출이 악화된다(2.77 ②).
  #   ⏸ 손대기 전에 "unknown을 양쪽 탭에서 빼는 안"을 먼저 정할 것 (HANDOFF 2.80 ②).
  worship_max_seconds: 600   # 10분 이하면 worship 쪽 (메들리 여유 포함)

# ---------------------------------------------------------------------
# 판별 우선순위 (배치가 이 순서로 판정한다)
#
#   [2026-08-19 개정 — 제목이 채널보다 앞이다. 실측이 순서를 뒤집었다.]
#     개정 전 1순위는 채널 content_type이었고 전용 채널은 거기서 끝났다.
#     그런데 실측에서 **전용 채널이 반대 형식을 대량으로 올린다**는 것이 드러났다.
#       오륜교회(sermon)   주일 각 부 예배 찬양 콘티 55건
#       우리들교회(sermon)  찬양 26건 · 꿈의교회(sermon) 찬양 14건
#       → 1,069건 중 81건이 찬양인데 sermon으로 판정됐다.
#         앱에서 [찬양] 토글을 누르면 이 81건이 통째로 사라진다.
#     채널 성격은 "그 채널이 주로 무엇을 올리는가"이지 "이 영상이 무엇인가"가 아니다.
#
#   1. 제목 어휘 — title_keywords가 **한쪽만** 걸리면 거기서 확정한다.
#
#   2. 본문 장절 패턴이 있으면 sermon.
#      제목 어휘보다 뒤인 이유: 찬양 콘티의 곡명이 시편인 경우가 있다
#      ("시편 92편 + 주 이름 찬양 + … | 주일 2부예배 찬양 헤세드" — 실측 3건).
#      제목에 형식 어휘가 명시됐으면 그쪽이 더 구체적인 증거다.
#
#   3. 채널 content_type이 sermon·worship이면 그대로 확정한다.
#      devotion은 sermon으로 본다 — 큐티·묵상은 말씀 해설이다.
#      제목이 아무 말도 하지 않을 때의 기본값 자리로 내려왔다.
#
#   4. 그래도 못 가리면 길이로 가린다.
#
#   5. 그래도 못 가리면 unknown으로 둔다.
#      **unknown은 양쪽 토글 모두에 노출한다.** 판별 실패로 영상이 사라지는 것보다
#      낫고, unknown 비율이 리포트에 남아 사전을 고칠 근거가 된다.
#      (주제 태깅의 untagged와 다르다 — untagged는 노출하지 않는다.
#       거기서는 "어느 감정에 맞는지 모른다"가 곧 "보여줄 근거가 없다"이지만,
#       여기서는 "형식을 모른다"일 뿐 감정 적합성은 이미 판정된 상태다.)
# ---------------------------------------------------------------------

# =====================================================================
# 감정 세분류별 media_type 기본값
#
# [기본값일 뿐이다 — 사용자 전환이 필수 요건이다]
#   감정 분류가 완벽하지 않으므로 기본값이 안 맞는 경우가 상당수 나온다.
#   영상 리스트 상단에 [말씀]/[찬양] 토글을 두어 한 번의 탭으로 바뀌게 한다.
#   설정 화면에 숨기지 않는다 (PLAN.md 3.4).
#
# [배분 근거]
#   worship 우선 — 듣기만 하면 되는 형식이라 부담이 적다.
#     불안·분노·슬픔·지침처럼 여력이 없는 상태, 그리고 기쁨·설렘·평온처럼
#     내용보다 분위기가 맞는 상태.
#   sermon 우선 — 내용을 원하는 상태.
#     frustration(막막함·진전 없음·억눌림)은 "길을 알려달라"는 방향이고,
#     boredom(지루함·새 자극)은 읽을거리를 찾는 상태다.
#     themes.yaml mapping에 이미 그 결이 있다 — 이 두 계열의 주제가
#     guidance·patience·daily_word·bible_story로 내용 중심이다.
#
# [조정 여지 — 실사용 데이터로 다시 볼 것]
#   anger.unfair 는 판단이 갈렸다. 매핑 주제(justice·lament·forgiveness)가
#   전부 내용 중심이라 sermon 쪽 근거가 있지만, 억울한 상태에서 긴 설교를
#   들을 여력이 있는지는 다른 문제다. 일단 worship으로 두었다.
#   calm.stable 도 daily_word를 매핑에 갖고 있어 sermon 여지가 있다.
#   토글 사용 로그가 쌓이면 기본값이 뒤집히는 세분류가 보일 것이다.
# =====================================================================

media_defaults:
  anxiety.restless:      worship
  anxiety.worry:         worship
  anxiety.tension:       worship

  anger.irritation:      worship
  # 2026-08-20 — worship → sermon. 조정 후보로 적어 뒀던 것을 실측으로 확정했다.
  #   매핑 3주제(justice 2 · lament 2 · forgiveness 1)의 풀이 **전부 sermon**이라
  #   기본값 worship에서는 주제분이 한 건도 보이지 않았다.
  #     worship  보이는 12건 · 주제분 0     ← 개정 전
  #     sermon   보이는  8건 · 주제분 5
  #   보이는 건수는 줄지만 "이 마음에 맞춰 고른 영상"이 실제로 보인다.
  anger.unfair:          sermon
  anger.rage:            worship

  frustration.stuck:     sermon
  frustration.blocked:   sermon
  frustration.suppressed: sermon

  sadness.sorrow:        worship
  sadness.lonely:        worship
  sadness.loss:          worship

  exhaustion.burnout:    worship
  exhaustion.tired:      worship
  exhaustion.listless:   worship

  joy.proud:             worship
  joy.delight:           worship
  joy.grateful:          worship

  flutter.anticipation:  worship
  flutter.thrill:        worship

  calm.ease:             worship
  calm.stable:           worship    # 조정 후보 — 위 주석 참조

  boredom.dull:          sermon
  boredom.novelty:       sermon

# =====================================================================
# 폴백 — 주제 태깅이 안 된 영상을 형식으로 채워 넣는다 (2026-08-19 신설)
#
# [왜 필요해졌는가 — 실측이 전제를 뒤집었다]
#   첫 실 배치에서 필터 통과 1,069건 중 **822건(77%)이 어느 주제에도 안 걸렸다.**
#   제목이 주제를 말하는 채널은 CGN 생명의 삶 하나뿐이었고, 나머지는
#   설교 문장·곡목 나열·프로그램 브랜드·공지였다.
#   미태깅을 버리는 원래 규칙대로면 24개 화면 중 20개가 목표 미달, 1개는 0건이다.
#   **사전을 키워도 이 구조는 안 바뀐다** — 제목에 주제어가 없기 때문이다.
#
# [규칙]
#   폴백 풀      그 세분류의 media_defaults 형식 + unknown (미태깅 영상만)
#   상한         20슬롯 중 최대 12건 (60%). 화면이 폴백으로 덮이지 않게 한다
#   정렬         주제분과 같다 — 최신순 + 채널 라운드로빈, 채널당 상한 3
#   채널 우열    두지 않는다. 태깅률이 낮은 채널은 콘텐츠가 나빠서가 아니라
#                제목 관행이 다를 뿐이다 (CGN 성경통독 태깅률 0%)
#   위기 화면    폴백을 쓰지 않는다 (PLAN.md 7절)
#   source       theme / fallback을 데이터에 남긴다.
#                **앱은 두 층을 섞지 않는다** — "이 감정에 맞춰 고른 말씀 /
#                이 채널의 최근 영상"처럼 층이 보여야 한다. 섞으면 사용자가
#                "이게 왜 내 감정에 맞지?"라고 느끼는 순간 화면 전체를 의심한다.
#
# [폴백은 메우는 장치이지 해결이 아니다 — 경보로 감시한다]
#   theme_fallback_heavy  폴백 > 50%   그 감정을 못 받치고 있다는 신호 (실측 9개)
#   theme_too_few         최종 < 8건    화면으로 성립하지 않는다 (실측 0개)
#   20건 미달 자체는 허용한다. 채우려고 폴백을 늘리면 그 화면은 "감정에 맞춘
#   목록"이 아니라 "채널 최신 목록"이 된다.
#
#   임계값은 코드에 있다 (scripts/lib/themes.py) — 이 파일은 큐레이션 문서이고
#   배치 튜닝 상수를 섞으면 두 종류의 변경이 한 파일에서 뒤엉킨다.
# =====================================================================

# ---------------------------------------------------------------------
# 빌드 시 검증 (배치가 단언할 것)
#   1. mapping의 모든 세분류 id가 taxonomy에 존재한다 (역방향도 — 빠진 세분류 없음)
#   2. mapping이 참조하는 모든 주제가 themes에 정의되어 있다
#   3. crisis_fixed는 mapping 어디에도 없다
#   4. 전역 금지어(은혜·치유·축복·간증·기적)가 themes[].title_keywords에 없다
#      ※ media_types[].title_keywords에는 적용하지 않는다 — 용도가 다르다
#   5. media_defaults의 세분류 id 집합이 mapping과 정확히 같다 (누락·초과 없음)
#   6. media_defaults의 값이 media_types에 정의된 id뿐이다 (sermon / worship)
# ---------------------------------------------------------------------
