name: Peace in Mind daily YouTube Short

on:
  schedule:
    # Primary run at 01:30 KST; leave several hours before the 07:00 release.
    - cron: "30 16 * * *"
    # Retry window at 02:15 KST if the primary run was missed or failed.
    - cron: "15 17 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Render the preview and keep it private (recommended for the first run)"
        type: boolean
        default: true
      publish_at_kst:
        description: "Optional YYYY-MM-DDTHH:MM. Required for a manual non-dry-run upload."
        type: string
        required: false

concurrency:
  group: youtube-shorts-daily
  cancel-in-progress: false

permissions:
  contents: write # Retain the date-to-video-ID ledger and prevent a repeat upload.

jobs:
  make-and-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      PYM_TTS_SERVICE_ACCOUNT_JSON: ${{ secrets.PYM_TTS_SERVICE_ACCOUNT_JSON }}
      PYM_YOUTUBE_TOKEN_JSON: ${{ secrets.PYM_YOUTUBE_TOKEN_JSON }}
      PYM_SMTP_APP_PASSWORD: ${{ secrets.PYM_SMTP_APP_PASSWORD }}

    steps:
      - uses: actions/checkout@v4

      - name: Check today's upload ledger
        id: ledger
        shell: bash
        run: python3 youtube_shorts/scripts/check_upload_ledger.py

      - name: Check Google TTS and YouTube OAuth credentials
        id: credentials
        if: steps.ledger.outputs.already_uploaded != 'true'
        env:
          YOUTUBE_TOKEN_JSON: ${{ secrets.PYM_YOUTUBE_TOKEN_JSON }}
          SMTP_APP_PASSWORD: ${{ secrets.PYM_SMTP_APP_PASSWORD }}
        shell: bash
        run: |
          if [[ -n "$PYM_TTS_SERVICE_ACCOUNT_JSON" ]]; then
            echo "tts=true" >> "$GITHUB_OUTPUT"
          else
            echo "tts=false" >> "$GITHUB_OUTPUT"
            echo "Rendering skipped: add the Google TTS service account secret first."
          fi
          if [[ -n "$YOUTUBE_TOKEN_JSON" ]]; then
            echo "youtube=true" >> "$GITHUB_OUTPUT"
          else
            echo "youtube=false" >> "$GITHUB_OUTPUT"
            echo "YouTube upload skipped. Add its OAuth secret after reviewing a dry-run preview."
          fi
          if [[ "$GITHUB_EVENT_NAME" == "schedule" ]]; then
            missing=()
            [[ -n "$PYM_TTS_SERVICE_ACCOUNT_JSON" ]] || missing+=("PYM_TTS_SERVICE_ACCOUNT_JSON")
            [[ -n "$YOUTUBE_TOKEN_JSON" ]] || missing+=("PYM_YOUTUBE_TOKEN_JSON")
            [[ -n "$SMTP_APP_PASSWORD" ]] || missing+=("PYM_SMTP_APP_PASSWORD")
            if (( ${#missing[@]} )); then
              printf 'Scheduled run needs these GitHub Actions secrets: %s\n' "${missing[*]}" >&2
              exit 1
            fi
          fi

      - name: Set up Python
        if: steps.ledger.outputs.already_uploaded != 'true' && steps.credentials.outputs.tts == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: youtube_shorts/requirements.txt

      - name: Cache Korean font
        if: steps.ledger.outputs.already_uploaded != 'true' && steps.credentials.outputs.tts == 'true'
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/pym-fonts/NotoSansCJKkr-Regular.otf
          key: noto-sans-cjk-kr-regular-f8d1575

      - name: Download Korean font when cache is empty
        if: steps.ledger.outputs.already_uploaded != 'true' && steps.credentials.outputs.tts == 'true'
        run: |
          font="$RUNNER_TEMP/pym-fonts/NotoSansCJKkr-Regular.otf"
          if [[ ! -s "$font" ]]; then
            mkdir -p "$(dirname "$font")"
            curl --fail --location --retry 3 --retry-delay 2 \
              "https://raw.githubusercontent.com/notofonts/noto-cjk/f8d157532fbfaeda587e826d4cd5b21a49186f7c/Sans/OTF/Korean/NotoSansCJKkr-Regular.otf" \
              --output "$font"
          fi
          test -s "$font"

      - name: Install pipeline dependencies
        if: steps.ledger.outputs.already_uploaded != 'true' && steps.credentials.outputs.tts == 'true'
        run: |
          python -m pip install -r youtube_shorts/requirements.txt
          python - <<'PY'
          import imageio_ffmpeg
          from PIL import ImageFont
          import os
          from pathlib import Path

          font = Path(os.environ["RUNNER_TEMP"]) / "pym-fonts" / "NotoSansCJKkr-Regular.otf"
          ImageFont.truetype(str(font), 32).getlength("오늘의 말씀")
          print(f"Using bundled ffmpeg: {imageio_ffmpeg.get_ffmpeg_exe()}")
          print(f"Using Korean font: {font}")
          PY

      - name: Generate app scripture data for the walkthrough
        if: steps.ledger.outputs.already_uploaded != 'true' && steps.credentials.outputs.tts == 'true'
        run: |
          python scripts/gen_taxonomy_json.py
          python scripts/gen_verses_json.py
          python scripts/gen_krv_chapters.py

      - name: Load credentials into ignored local files
        if: steps.ledger.outputs.already_uploaded != 'true' && steps.credentials.outputs.tts == 'true'
        env:
          TTS_JSON: ${{ secrets.PYM_TTS_SERVICE_ACCOUNT_JSON }}
          YOUTUBE_JSON: ${{ secrets.PYM_YOUTUBE_TOKEN_JSON }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path

          tts = Path(os.environ["RUNNER_TEMP"]) / "pym-tts-service-account.json"
          tts.write_text(os.environ["TTS_JSON"], encoding="utf-8")
          youtube_json = os.environ.get("YOUTUBE_JSON", "")
          if youtube_json.strip():
              Path("youtube_shorts/token.local.json").write_text(
                  youtube_json, encoding="utf-8"
              )
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env:
              env.write(f"GOOGLE_APPLICATION_CREDENTIALS={tts}\n")
              font = Path(os.environ["RUNNER_TEMP"]) / "pym-fonts" / "NotoSansCJKkr-Regular.otf"
              env.write(f"PYM_KOREAN_FONT={font}\n")
          PY

      - name: Choose today's one-verse reading
        if: steps.ledger.outputs.already_uploaded != 'true' && steps.credentials.outputs.tts == 'true'
        id: day
        shell: bash
        run: |
          date_kst="$(TZ=Asia/Seoul date +'%Y-%m-%d')"
          echo "date_kst=$date_kst" >> "$GITHUB_OUTPUT"
          python youtube_shorts/scripts/choose_verse.py \
            --date "$date_kst" \
            --output-dir "youtube_shorts/work/$date_kst"

      - name: Render Korean TTS Short and metadata
        if: steps.ledger.outputs.already_uploaded != 'true' && steps.credentials.outputs.tts == 'true'
        run: |
          date_kst='${{ steps.day.outputs.date_kst }}'
          manifest="youtube_shorts/work/$date_kst/$date_kst.json"
          python youtube_shorts/scripts/render_short.py "$manifest"
          python youtube_shorts/scripts/build_metadata.py "$manifest"

      - name: Upload for 07:00 KST release
        id: upload-scheduled
        if: steps.ledger.outputs.already_uploaded != 'true' && steps.credentials.outputs.tts == 'true' && steps.credentials.outputs.youtube == 'true' && github.event_name == 'schedule'
        run: |
          date_kst='${{ steps.day.outputs.date_kst }}'
          python youtube_shorts/scripts/upload_short.py \
            "youtube_shorts/work/$date_kst/short-draft.mp4" \
            "youtube_shorts/work/$date_kst/metadata.json" \
            --publish-at-kst "${date_kst}T07:00"

      - name: Upload for a manually selected KST release
        id: upload-manual
        if: steps.ledger.outputs.already_uploaded != 'true' && steps.credentials.outputs.tts == 'true' && steps.credentials.outputs.youtube == 'true' && github.event_name == 'workflow_dispatch' && inputs.dry_run == false
        env:
          PUBLISH_AT_KST: ${{ inputs.publish_at_kst }}
        run: |
          if [[ -z "$PUBLISH_AT_KST" ]]; then
            echo "Provide a future publish_at_kst or keep dry_run enabled."
            exit 2
          fi
          date_kst='${{ steps.day.outputs.date_kst }}'
          python youtube_shorts/scripts/upload_short.py \
            "youtube_shorts/work/$date_kst/short-draft.mp4" \
            "youtube_shorts/work/$date_kst/metadata.json" \
            --publish-at-kst "$PUBLISH_AT_KST"

      - name: Keep a local copy of the preview
        if: always() && steps.ledger.outputs.already_uploaded != 'true' && steps.credentials.outputs.tts == 'true' && steps.day.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: youtube-short-${{ steps.ledger.outputs.date_kst }}
          path: youtube_shorts/work/${{ steps.ledger.outputs.date_kst }}/
          retention-days: 7

      - name: Commit the no-duplicate upload ledger
        if: steps.upload-scheduled.outcome == 'success' || steps.upload-manual.outcome == 'success'
        run: |
          if [[ -f youtube_shorts/state/uploads.json ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add youtube_shorts/state/uploads.json
            if ! git diff --cached --quiet; then
              git commit -m "chore: record daily YouTube Short"
              git pull --rebase origin main
              git push
            fi
          fi

      - name: Email the daily result
        if: always() && github.event_name == 'schedule'
        env:
          SMTP_APP_PASSWORD: ${{ secrets.PYM_SMTP_APP_PASSWORD }}
          SMTP_USER: appleap385@gmail.com
          NOTIFY_TO: aaz0919@naver.com
          RUN_STATUS: ${{ job.status }}
          RUN_DATE_KST: ${{ steps.ledger.outputs.date_kst }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python youtube_shorts/scripts/notify_result.py
