name: 데이터 배치 (videos.json)

# PLAN.md Phase 2 — 승인 채널의 업로드를 순회해 videos.json을 만들고 gh-pages에 배포한다.
# API 키는 이 워크플로의 Secrets에만 존재한다. 앱은 YouTube API를 직접 호출하지 않는다.
#
# [FYM 워크플로와 다른 점]
#   1. 실행 시각    쿼터 리셋이 아니라 **업로드 시각**에 맞췄다 (아래 cron 주석)
#   2. 사전 게이트  구절 대조(verify_verses)가 들어간다 — PYM에는 구절 계층이 있다
#   3. check_channels 단계 없음 — PYM에 이식하지 않았다. 채널 상태 경보는
#      배치 리포트(build_report.json)가 낸다
#   4. 제목 덤프(titles.json)를 아티팩트로 남긴다 — 태깅 분석을 API 0으로 하기 위해서다

on:
  schedule:
    # UTC 09:30 = KST 18:30. **쿼터가 아니라 업로드를 기준으로 잡았다.**
    #
    # FYM은 UTC 08:30이다. 거기서는 검색으로 영상을 모으므로 "쿼터 리셋 직후에
    # 하루치를 온전히 확보"하는 것이 중요했다(일 7,900 units). PYM은 승인 채널의
    # 업로드만 훑어 하루 ~62 units라 리셋과의 거리가 사실상 무의미하다.
    #
    # 대신 중요한 것은 그날 올라온 영상을 담느냐다. 한국 교회 채널의 업로드는
    #   새벽예배  KST 05~07시 (UTC 20~22시, 전날)
    #   주일예배  KST 12~14시 (UTC 03~05시)
    # 에 몰린다. KST 18:30에 돌면 그날 올라온 것이 모두 창 안에 들어온다.
    #
    # FYM(08:30)과 1시간을 띄운 것은 두 저장소의 실행 로그를 사람이 구분해서
    # 읽기 위해서다. API 키가 분리돼 있어(PLAN.md 6절) 쿼터는 서로 간섭하지 않는다.
    - cron: "30 9 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "드라이런 (API 호출 0 · 배포하지 않음). 첫 실행은 반드시 이걸로 확인한다"
        type: boolean
        default: false

# 데이터 워크플로와 앱 배포 워크플로(Phase 3)가 같은 gh-pages 브랜치에 쓴다.
# Phase 3에서 deploy-app.yml을 만들 때 **반드시 이 그룹명을 그대로 쓸 것.**
# cancel-in-progress를 켜지 않는 이유: 배포 도중 취소되면 브랜치가 반쯤 갱신된 채 남는다.
concurrency:
  group: gh-pages-deploy
  cancel-in-progress: false

permissions:
  contents: write # gh-pages 푸시
  issues: write # 경보 Issue 생성

env:
  PREVIOUS_VIDEOS: _previous/data/videos.json
  DRY_RUN: ${{ github.event.inputs.dry_run == 'true' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: 직전 배포본 가져오기
        # 업로드 창(채널당 100건) 밖으로 밀려난 영상을 풀에 남기는 데 쓴다.
        # 위기 풀의 "12건 미달 시 직전 결과 유지" 규칙도 이 파일이 있어야 작동한다.
        #
        # **최초 실행에는 gh-pages 브랜치가 없다.** 그래서 실패를 허용한다
        # (브랜치는 아래 배포 단계에서 peaceiris 액션이 처음 만든다).
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          ref: gh-pages
          path: _previous

      - name: Python 준비
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: 의존성 설치
        run: pip install -r scripts/requirements.txt

      - name: API 키 확인
        if: env.DRY_RUN != 'true'
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: |
          if [ -z "$YOUTUBE_API_KEY" ]; then
            echo "::error::secrets.YOUTUBE_API_KEY가 설정되지 않았습니다."
            exit 1
          fi
          echo "API 키 확인됨"

      - name: 배포 전 게이트 (API 호출 0)
        # **배치보다 먼저 돌린다.** "배포 전에만 통과하면 된다"가 아니라, 여기서
        # 깨지면 배치를 돌릴 이유 자체가 없기 때문이다. 먼저 세우면 쿼터도 아낀다.
        #
        #   verify_verses  250구절이 개역한글 원문과 일치하고 verified: true인가.
        #                  하나라도 false면 배포하지 않는다 (동일성유지권·본문 정확성)
        #   tagging_test   주제/형식 판별 규칙 + themes.yaml 게이트 6종
        #   spread_test    채널 분산·형식 균형·폴백·위기 유지·무결성 단언
        run: |
          # 건수를 여기에 적지 않는다 — 2026-08-24에 "250건"이 박혀 있었고 실제는
          # 303건이었다. HANDOFF 2.43과 같은 유형의 표류다. 스크립트가 세게 둔다.
          python scripts/verify_verses.py --check
          python scripts/tagging_test.py > /dev/null && echo "태깅·판별 테스트 통과"
          python scripts/spread_test.py > /dev/null && echo "선정·폴백 테스트 통과"

      - name: videos.json 생성
        id: build
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: |
          # [--no-reserve-actions-batch를 쓰는 이유]
          #   그 옵션은 "Actions 일일 배치가 쓸 몫(200)을 로컬 실행이 미리 비워둔다"는
          #   장치다. 여기서는 이 실행이 곧 그 배치이므로, 자기 몫을 자기가 또
          #   예약하면 이중 계상이 된다.
          #
          # [--dump-titles를 켜는 이유]
          #   필터를 통과한 전량의 제목을 남긴다. 이게 없으면 "미태깅이 왜 났는지"를
          #   보려고 API를 다시 써야 한다(실제로 그렇게 61 units를 재소모했다).
          #   배포 대상이 아니라 아티팩트로만 보관한다.
          ARGS="--previous $PREVIOUS_VIDEOS --out-dir dist --dump-titles --no-reserve-actions-batch"
          if [ "$DRY_RUN" = "true" ]; then
            echo "::notice::드라이런 — API를 호출하지 않고 배포도 하지 않습니다."
            ARGS="$ARGS --dry-run"
          fi

          # 재시도는 정확히 1회. 무한 재시도는 쿼터를 이중으로 태운다.
          # 종료 코드 2(쿼터 중단)는 재시도해도 같은 결과이므로 즉시 포기한다.
          # 일일 소진은 403으로도 429로도 오므로 상태 코드가 아니라 응답 내용으로
          # 가른다 (scripts/lib/youtube.py의 _is_daily_quota_error).
          run_build() { python scripts/build_videos.py $ARGS; }

          set +e
          run_build
          code=$?
          set -e

          if [ "$code" -eq 2 ]; then
            echo "::error::쿼터 관련 중단 — 재시도하지 않습니다. 다음 PT 자정 이후 재실행하세요."
            exit 2
          fi
          if [ "$code" -ne 0 ]; then
            echo "::warning::1차 실행 실패(code=$code) — 60초 후 1회만 재시도합니다."
            sleep 60
            set +e
            run_build
            code=$?
            set -e
            if [ "$code" -eq 2 ]; then
              echo "::error::재시도 중 쿼터 중단."
              exit 2
            fi
          fi
          exit "$code"

      - name: 산출물 검증 (PLAN.md 4.2 스키마)
        # 스키마가 깨진 파일이 조용히 배포되지 않도록 배포 직전에 한 번 더 본다.
        # 배치 안의 단언(assert_disjoint 등)과 겹치지만, 검사 대상이 다르다 —
        # 여기서는 **파일에 실제로 쓰인 것**을 읽는다.
        run: |
          python - <<'PY'
          import json, os, sys
          from pathlib import Path

          suffix = ".dry-run" if os.environ.get("DRY_RUN") == "true" else ""
          data = json.loads(Path(f"dist/videos{suffix}.json").read_text(encoding="utf-8"))

          missing = {"version", "subcategories", "crisis"} - set(data)
          if missing:
              sys.exit(f"videos.json 최상위 키 누락: {missing}")
          subs = data["subcategories"]
          if len(subs) != 24:
              sys.exit(f"세분류가 24개가 아님: {len(subs)}")

          crisis_ids = {v["videoId"] for v in data["crisis"]["videos"]}
          screen_ids = {v["videoId"] for s in subs for v in s["videos"]}
          overlap = crisis_ids & screen_ids
          if overlap:
              sys.exit(f"crisis와 세분류 화면이 videoId를 공유: {sorted(overlap)}")

          for s in subs:
              for key in ("id", "themes", "media_default", "videos"):
                  if key not in s:
                      sys.exit(f"{s.get('id')}에 {key} 없음")
              for v in s["videos"]:
                  if v.get("media_type") not in {"sermon", "worship", "unknown"}:
                      sys.exit(f"{v['videoId']} media_type 이상: {v.get('media_type')}")
                  if v.get("source") not in {"theme", "fallback"}:
                      sys.exit(f"{v['videoId']} source 이상: {v.get('source')}")
              # 주제분이 폴백보다 뒤에 오면 앱이 두 층을 순서로 구분할 수 없다.
              sources = [v["source"] for v in s["videos"]]
              if sources != sorted(sources, key=lambda x: 0 if x == "theme" else 1):
                  sys.exit(f"{s['id']}의 순서가 주제분 → 폴백이 아님")

          version = json.loads(Path(f"dist/version{suffix}.json").read_text(encoding="utf-8"))
          if version["version"] != data["version"]:
              sys.exit("version.json과 videos.json의 version이 다름")

          fallback = sum(1 for s in subs for v in s["videos"] if v["source"] == "fallback")
          print(
              f"검증 통과 — 세분류 {len(subs)}개 / 영상 {len(screen_ids)}건 "
              f"(폴백 {fallback}건) / 위기 {len(crisis_ids)}건"
          )
          PY

      - name: 실행 요약 (쿼터 · 진단)
        if: always()
        # [진단은 여기에만 남긴다 — Issue로 내지 않는다]
        #   theme_low_yield · media_type_gap · theme_fallback_heavy · untagged_high은
        #   "지금 데이터가 이렇다"이지 "무엇을 하라"가 아니다. 매일 같은 값이 뜨므로
        #   Issue로 내면 하루에 30건씩 쌓여 auto 라벨 자체가 무시된다.
        #   대신 실행마다 표로 남겨 **추이**를 보게 하고, 악화될 때만 주간 요약
        #   Issue를 낸다(아래 단계). 판정 기준은 scripts/lib/alerts.py에 있다.
        #
        # 러너는 매번 초기화되므로 .quota_log.json이 다음 실행까지 남지 않는다.
        # 그래서 쿼터도 여기(사람이 즉시 보는 곳)와 아티팩트 두 곳에 남긴다.
        # **실패한 실행도 쿼터를 쓴다** — build_videos.py는 중단되더라도 finally에서
        # 기록하므로, 리포트가 없어도 .quota_log.json에는 남는다.
        run: |
          spent=$(python -c "import json;d=json.load(open('.quota_log.json',encoding='utf-8'));print(d[max(d)]['spent'])" 2>/dev/null || echo "0 (드라이런)")
          {
            echo "### 쿼터"
            echo ""
            echo "| 항목 | 값 |"
            echo "|---|---:|"
            echo "| 이번 실행 | ${spent} units |"
            echo "| 일일 한도 | 10,000 units (PT 자정 리셋) |"
            echo "| 드라이런 | ${DRY_RUN} |"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

          python - >> "$GITHUB_STEP_SUMMARY" <<'PY'
          import json, os
          from pathlib import Path

          suffix = ".dry-run" if os.environ.get("DRY_RUN") == "true" else ""
          report = Path(f"dist/build_report{suffix}.json")
          if not report.exists():
              print("### 진단\n\n리포트가 없습니다 (배치가 산출 전에 중단됨).")
              raise SystemExit(0)

          data = json.loads(report.read_text(encoding="utf-8"))
          d = data.get("diagnostics", {})
          subs = data.get("subcategories", [])
          diag_alerts = [a for a in data.get("alerts", []) if a.get("route") == "summary"]

          def row(label, value, note=""):
              print(f"| {label} | {value} | {note} |")

          print("### 진단 (Issue로 내지 않는 상태 지표)")
          print()
          print("| 지표 | 값 | 비고 |")
          print("|---|---:|---|")
          row("노출 합계", d.get("total_exposed", 0), f"폴백 {d.get('from_fallback', 0)}건")
          row("미태깅 비율", f"{d.get('untagged_ratio', 0):.0%}", f"필터 통과 {d.get('kept', 0)}건")
          row("목표(20건) 미달 화면", len(d.get("screens_below_target", [])), "/ 24")
          row("최소(8건) 미달 화면", len(d.get("screens_below_min", [])), "0이어야 한다")
          row("폴백 과다 화면", len(d.get("fallback_heavy", [])), "폴백 > 50%")
          row("빈 주제", len(d.get("themes_empty", [])), ", ".join(d.get("themes_empty", [])) or "-")
          row("얇은 주제", len(d.get("themes_low_yield", [])), "확보량 < 15")
          row("형식 편중 주제", len(d.get("media_type_gaps", [])), "한쪽 토글이 빈다")
          row("잔존 0 채널", len(d.get("channels_zero_yield", [])), ", ".join(d.get("channels_zero_yield", [])) or "-")
          row("승인 채널", d.get("allowlist_size", 0), "최소 15")
          print()

          if subs:
              print("<details><summary>세분류별 노출 (24개)</summary>")
              print()
              print("| 세분류 | 형식 | 주제분 | 폴백 | 합계 | 폴백% |")
              print("|---|---|---:|---:|---:|---:|")
              for x in sorted(subs, key=lambda x: -x["fallback_ratio"]):
                  print(
                      f"| {x['id']} | {x['media_default']} | {x['from_theme']} | "
                      f"{x['from_fallback']} | {x['count']} | {x['fallback_ratio']:.0%} |"
                  )
              print()
              print("</details>")
              print()
          print(f"진단 경보 {len(diag_alerts)}건은 Issue로 만들지 않았습니다 (정책: 2026-08-19).")
          PY

      - name: 진단용 산출물 보관
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-report-${{ github.run_number }}
          path: |
            dist/build_report*.json
            dist/diagnostics*.json
            dist/titles*.json
            .quota_log.json
          if-no-files-found: warn
          retention-days: 90

      - name: 경보를 GitHub Issue로 올리기
        # 드라이런에서는 만들지 않는다. DryRunClient가 채널 몇 개를 일부러
        # "삭제됨"으로 흉내 내므로(경보 경로 검증용) 가짜 critical이 뜬다.
        if: always() && env.DRY_RUN != 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const file = 'dist/build_report.json';
            if (!fs.existsSync(file)) {
              core.info('리포트가 없어 경보를 올리지 않는다 (배치가 산출 전에 중단됨)');
              return;
            }
            let all = [];
            try {
              all = JSON.parse(fs.readFileSync(file, 'utf8')).alerts || [];
            } catch (e) {
              core.warning(`${file} 파싱 실패: ${e.message}`);
              return;
            }

            // [2026-08-19 정책] Issue는 **조치가 필요한 사건**만 만든다.
            // 진단(route === 'summary')은 Job Summary 표로 가고, 악화될 때만
            // 주간 요약 Issue가 뜬다. 판정은 scripts/lib/alerts.py가 끝냈고
            // 여기서는 옮겨 적기만 한다 — 정책이 두 곳에 흩어지면 반드시 어긋난다.
            const alerts = all.filter(a => (a.route || 'issue') === 'issue');
            const skipped = all.length - alerts.length;
            if (skipped) core.info(`진단 ${skipped}건은 Summary로 보냄 (Issue 미생성)`);
            if (alerts.length === 0) {
              core.info('Issue로 낼 경보 없음');
              return;
            }
            // 같은 제목이 두 번 담기는 경우를 막는다 (FYM에서 Issue가 중복 생성된 이력).
            const unique = [...new Map(alerts.map(a => [a.title, a])).values()];

            const { owner, repo } = context.repo;
            const open = await github.paginate(github.rest.issues.listForRepo, {
              owner, repo, state: 'open', labels: 'auto', per_page: 100,
            });
            const byTitle = new Map(open.map(i => [i.title, i]));

            // 같은 사유로 매일 Issue가 쌓이지 않도록 **제목으로** 중복을 판정한다.
            // 재알림 주기는 경보 자체가 들고 온다(scripts/lib/alerts.py) — 기본 7일,
            // 안전 관련은 2일, 안전 장치가 아예 없는 상태는 1일.
            const DAY_MS = 24 * 60 * 60 * 1000;
            const now = Date.now();

            for (const alert of unique) {
              const quietMs = (alert.renotify_days ?? 7) * DAY_MS;
              const existing = byTitle.get(alert.title);
              if (!existing) {
                const created = await github.rest.issues.create({
                  owner, repo,
                  title: alert.title,
                  body: `${alert.body}\n\n---\n자동 생성 · [실행 로그](${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId})`,
                  labels: alert.labels && alert.labels.length ? alert.labels : ['auto'],
                });
                byTitle.set(alert.title, {
                  number: created.data.number,
                  updated_at: created.data.updated_at,
                });
                core.info(`Issue 생성 #${created.data.number}: ${alert.title}`);
                continue;
              }
              if (now - new Date(existing.updated_at).getTime() < quietMs) {
                core.info(`중복 생략 (#${existing.number}, 재알림 ${alert.renotify_days ?? 7}일): ${alert.title}`);
                continue;
              }
              await github.rest.issues.createComment({
                owner, repo, issue_number: existing.number,
                body: `여전히 해결되지 않았습니다.\n\n${alert.body}\n\n[실행 로그](${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId})`,
              });
              core.info(`기존 Issue에 코멘트 (#${existing.number}): ${alert.title}`);
            }

      - name: 주간 진단 요약 (월요일 · 악화 시에만)
        if: success() && env.DRY_RUN != 'true'
        # [왜 주 1회인가]
        #   진단은 매일 같은 값이 뜬다. 매일 알리면 소음이고, 아예 안 알리면
        #   나빠지는 것을 놓친다. 그래서 **악화됐을 때만** 주 1회 알린다.
        #
        # [무엇과 비교하는가]
        #   지난주 월요일의 스냅샷(gh-pages의 data/diagnostics.weekly.json)이다.
        #   전날과 비교하면 하루 변동에 흔들려 "추세"가 안 보인다.
        #   비교가 끝나면 이번 값을 새 기준선으로 배포한다(아래 cp).
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            if (new Date().getUTCDay() !== 1) {
              core.info('월요일 실행이 아니므로 주간 요약을 건너뜁니다.');
              return;
            }
            const curPath = 'dist/diagnostics.json';
            const basePath = '_previous/data/diagnostics.weekly.json';
            if (!fs.existsSync(curPath)) { core.info('진단 스냅샷 없음'); return; }
            const cur = JSON.parse(fs.readFileSync(curPath, 'utf8'));
            if (!fs.existsSync(basePath)) {
              core.info('지난주 기준선이 없습니다 — 이번 값을 기준선으로 삼습니다.');
              return;
            }
            const base = JSON.parse(fs.readFileSync(basePath, 'utf8'));

            const grew = (a, b) => (b || []).filter(x => !(a || []).includes(x));
            const worse = [];
            const newEmpty = grew(base.themes_empty, cur.themes_empty);
            if (newEmpty.length) worse.push(`빈 주제가 늘었습니다: ${newEmpty.join(', ')}`);
            const newHeavy = grew(base.fallback_heavy, cur.fallback_heavy);
            if (newHeavy.length) worse.push(`폴백 과다 화면이 늘었습니다: ${newHeavy.join(', ')}`);
            const newBelowMin = grew(base.screens_below_min, cur.screens_below_min);
            if (newBelowMin.length) worse.push(`최소 건수 미달 화면이 생겼습니다: ${newBelowMin.join(', ')}`);
            const newZero = grew(base.channels_zero_yield, cur.channels_zero_yield);
            if (newZero.length) worse.push(`잔존 0 채널이 늘었습니다: ${newZero.join(', ')}`);
            if ((cur.untagged_ratio || 0) - (base.untagged_ratio || 0) >= 0.02) {
              worse.push(`미태깅 비율 ${(base.untagged_ratio*100).toFixed(0)}% → ${(cur.untagged_ratio*100).toFixed(0)}%`);
            }
            if ((cur.allowlist_size || 0) < (base.allowlist_size || 0)) {
              worse.push(`승인 채널 ${base.allowlist_size} → ${cur.allowlist_size}`);
            }
            if ((cur.total_exposed || 0) < (base.total_exposed || 0) * 0.9) {
              worse.push(`총 노출 ${base.total_exposed} → ${cur.total_exposed} (10% 이상 감소)`);
            }

            if (worse.length === 0) {
              core.info('지난주 대비 악화 없음 — 요약 Issue를 만들지 않습니다.');
              return;
            }
            const { owner, repo } = context.repo;
            const date = new Date().toISOString().slice(0, 10);
            await github.rest.issues.create({
              owner, repo,
              title: `[배치] 주간 진단 — 지난주보다 나빠졌습니다 (${date})`,
              body: [
                '진단 지표가 지난주 기준선보다 악화됐습니다.',
                '',
                ...worse.map(w => `- ${w}`),
                '',
                '---',
                '',
                `| 지표 | 지난주 | 이번 |`,
                `|---|---:|---:|`,
                `| 미태깅 비율 | ${(base.untagged_ratio*100).toFixed(0)}% | ${(cur.untagged_ratio*100).toFixed(0)}% |`,
                `| 총 노출 | ${base.total_exposed} | ${cur.total_exposed} |`,
                `| 폴백 | ${base.from_fallback} | ${cur.from_fallback} |`,
                `| 빈 주제 | ${(base.themes_empty||[]).length} | ${(cur.themes_empty||[]).length} |`,
                `| 폴백 과다 화면 | ${(base.fallback_heavy||[]).length} | ${(cur.fallback_heavy||[]).length} |`,
                `| 승인 채널 | ${base.allowlist_size} | ${cur.allowlist_size} |`,
                '',
                '매 실행의 상세 표는 각 실행의 Job Summary에 있습니다.',
                `[이번 실행 로그](${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId})`,
              ].join('\n'),
              labels: ['batch', 'auto'],
            });
            core.info(`주간 진단 요약 Issue 생성 (악화 ${worse.length}건)`);

      - name: 주간 기준선 갱신 (월요일)
        if: success() && env.DRY_RUN != 'true'
        # 월요일에만 기준선을 새로 쓴다. 다른 날은 쓰지 않으므로 gh-pages의
        # 기존 파일이 keep_files: true로 그대로 남는다.
        run: |
          if [ "$(date -u +%u)" = "1" ]; then
            cp dist/diagnostics.json dist/diagnostics.weekly.json
            echo "주간 기준선 갱신"
          else
            echo "월요일이 아니므로 기준선을 유지합니다"
          fi

      - name: 공개 배포 대상만 남기기
        if: env.DRY_RUN != 'true'
        # publish_dir 전체가 배포되므로, 공개되면 안 되는 것을 여기서 지운다.
        #   build_report.json  진단용. 채널별 기여·경보 본문이 들어 있다
        #   titles.json        원자료(수백 KB). 아티팩트로만 보관한다
        # **diagnostics.json은 지운다** — 배포한다. 다음 주 월요일 실행이
        # 이 파일(과 weekly 기준선)을 읽어 악화를 판정한다.
        #   *.partial.json     --only 부분 실행 산출물 (CI는 쓰지 않지만 경로를 막는다)
        #   *.dry-run.json     합성 데이터. 섞이면 앱이 그걸 진짜로 받는다
        run: rm -f dist/build_report*.json dist/titles*.json dist/*.partial.json dist/*.dry-run.json

      - name: gh-pages 배포 (data/ 하위)
        if: env.DRY_RUN != 'true'
        # gh-pages 브랜치가 없으면 이 액션이 만든다 — 첫 실행에서 브랜치가 생긴다.
        # keep_files: true — Phase 3에서 앱이 루트에 배포되므로 지우면 안 된다.
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          destination_dir: data
          keep_files: true
          commit_message: "data: videos.json 갱신 (run ${{ github.run_number }})"

      - name: 배치 실패 알림
        if: failure() && env.DRY_RUN != 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const title = `[배치] 데이터 파이프라인 실패 (${new Date().toISOString().slice(0, 10)})`;
            await github.rest.issues.create({
              owner, repo, title,
              body: [
                '일일 데이터 배치가 실패했습니다.',
                '',
                '부분 결과는 기록되지 않으므로 **직전 videos.json이 그대로 유지**됩니다.',
                '방치의 결과는 신선도 저하이지 안전성 저하가 아닙니다.',
                '',
                '소모한 쿼터는 실행 아티팩트의 `.quota_log.json`에 남아 있습니다.',
                '',
                `[실행 로그](${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId})`,
                '',
                '종료 코드 2는 쿼터 관련 중단이며 재시도하지 않습니다 (다음 PT 자정 이후 재실행).',
              ].join('\n'),
              labels: ['batch', 'auto'],
            });
