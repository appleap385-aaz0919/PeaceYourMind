# =====================================================================
# channel_allowlist.yaml — PYM 채널 화이트리스트 (v0.1 스켈레톤)
#
# FYM과 결정적으로 다른 점: FYM에서는 위기 카테고리에만 적용됐지만,
# PYM에서는 **모든 영상이 이 목록에서만 나온다.** 이 파일 밖의 채널은
# 서비스에 존재하지 않는다. 일상 배치는 search.list를 쓰지 않는다.
#
# 변경은 반드시 PR로만 한다 — 누가 왜 추가/제외했는지 이력이 남아야 한다.
#
# ---------------------------------------------------------------------
# 승인 기준 (PLAN.md 5.1절 — 순서대로 전부 통과해야 승인)
#
#   1. [정체 확인] — 2026-08-18 완화. 개정 경위는 아래 [기준 1 개정 기록] 참조
#
#      다음 a·b·c를 **모두** 충족하면 정체 확인으로 인정한다.
#
#      a. 실재하는 교회·기관의 공식 채널임이 확인된다.
#         **채널→홈페이지 방향**(채널 설명에 공식 홈페이지 링크)을 우선 근거로 삼는다.
#         홈페이지→채널 방향만 있는 경우, 그 링크가 후보 채널과 **동일한지**
#         확인해야 한다 (부속·부서 채널을 링크하는 사례가 있다).
#
#         [두 방향의 신뢰도가 다른 이유 — 2026-08-18 실측]
#           분당우리교회 홈페이지가 링크한 것은 "청년교구" 채널
#           (UCJe7PaggYL8ArlQPvvJbN3Q)이었고, 발굴로 나온 메인 채널
#           (UCBh3Qv-rKu6ZDxEcrio70Hw)과 달랐다. 홈페이지에 유튜브 링크가
#           있다는 사실만으로는 "이 후보 채널이 공식"이라는 증거가 되지 않는다.
#           반대로 채널 설명에 홈페이지가 적혀 있으면, 그 채널을 운영하는
#           주체가 스스로 소속을 밝힌 것이므로 방향이 어긋날 여지가 없다.
#      b. 실체를 보여주는 정보(예배 시간·주소·담임·교단 등)가
#         **채널 설명 또는 홈페이지에** 확인된다.
#         채널 설명에 있는 것도 유효한 근거다 — 채널 소유자가 직접 기재한
#         것이므로 홈페이지 기재와 신뢰도가 같거나 더 높다.
#
#         [실측 기록] 1차 검토(2026-08-18)에서 교단이 홈페이지가 아니라
#         채널 설명에서 확인된 사례가 3건이었다:
#           오륜교회    "대한예수교장로회(합동) 수경노회 소속교회"
#           꿈의교회    홈페이지 링크 → 기독교대한감리회 경기연회
#           낮은담교회  "기독교한국침례회(라이트하우스울산)에 소속된 교회"
#         반대로 교회 홈페이지에 교단 표기가 없는 경우가 흔했다
#         (분당우리교회·우리들교회 홈페이지 모두 교단 미표기).
#         즉 채널 설명이 홈페이지보다 나은 근거인 경우가 실제로 있다.
#      c. 주요 교단의 이단 규정 목록 대조에서 걸리지 않는다
#
#      ---------------------------------------------------------------
#      [범위 조건 — 개신교 · 한국어] 2026-08-18 추가
#
#      위 a·b·c 이전에 걸러지는 조건이다. 다음은 범위 밖이다:
#        - 가톨릭 · 정교회 채널
#        - 외국어 전용 채널 (한국어 콘텐츠가 없는 것)
#
#      **이단이라서가 아니다.** 서비스 내부의 일관성 때문이다:
#        - 구절이 개역한글(개신교 번역)이다. 가톨릭 성경은 권 수·번역·
#          고유명사 표기가 다르다 (예: 하느님/하나님, 마태오/마태복음).
#        - themes.yaml 주제 체계와 감정 문구가 개신교 어휘로 짜여 있다.
#        - 앱 출처 표기가 "성경전서 개역한글판, 대한성서공회"로 고정된다.
#      개신교 기반 데이터에 다른 전통의 영상을 붙이면 사용자가 받는 구절과
#      영상의 어휘가 어긋난다. 승인 기준의 문제가 아니라 데이터 정합성 문제다.
#
#      [실측] 2차 발굴에서 "가톨릭TV"(구독 47,100, 쇼츠 0%, 자동 점검 통과)와
#      "CGN Japan"(일본어 전용, 국가 JP)이 후보로 올라왔다. 둘 다 정상 채널이고
#      기준 a·b·c로는 걸러지지 않아, 이 범위 조건을 명시하게 됐다.
#
#      교단명은 확인되면 affiliation에 적고, 확인되지 않으면 "교단 미표기"로
#      적는다. **교단명 미확인 자체는 탈락 사유가 아니다.**
#      단 affiliation_verified에는 a·b를 무엇으로 확인했는지 URL을 포함해
#      구체적으로 남긴다.
#
#      나무위키 등 2차 자료는 근거로 쓰지 않는다. 누구나 편집할 수 있어
#      "운영 주체가 실재하는가"의 증거가 되지 못한다.
#
#      ---------------------------------------------------------------
#      [기준 1 개정 기록 — 2026-08-18]
#
#      개정 전 기준은 "소속 교단이 확인되는 교회"를 요구하고 채널 설명·
#      교회 홈페이지·교단 주소록 중 2개 이상 교차 확인을 명시했다.
#
#      1차 발굴(suggest_channels.py, 661 units)에서 나온 30개 후보를 이 기준으로
#      검토해보니 **한 건도 승인할 수 없었다.** 이유는 후보의 문제가 아니라
#      기준이 현실과 어긋나서였다:
#
#        - 교회 공식 홈페이지에 교단을 명시하지 않는 것이 일반적이다.
#          분당우리교회 홈페이지에는 교단 표기가 없고 "성남노회" 언급만 있어
#          합동/통합/고신/백석 중 어디인지 알 수 없었다.
#        - 독립 교회·미주 한인교회는 애초에 한국 교단 주소록에 없다.
#        - 2차 자료(나무위키 등)로는 확인이 되지만 근거로 쓸 수 없다.
#
#      **기준의 목적은 교단명 확정이 아니라 "운영 주체가 실재하는 정상
#      기독교 기관인가"를 확인해 이단 위장 채널을 막는 것이다.**
#      위장 채널은 실재하는 홈페이지·예배 시간·주소를 갖추지 못하거나,
#      갖췄더라도 이단 규정 목록에 이름이 올라 있다. 그 둘을 보는 것이
#      교단명을 캐는 것보다 목적에 더 직접적이다.
#
#      완화로 약해지는 부분과 그 보완:
#        약해짐  교단 소속이라는 제도적 보증이 필수가 아니게 된다
#        보완    c(이단 규정 목록 대조)를 절대 조건으로 유지하고,
#                기준 3(콘텐츠 성격)과 4(자동 점검)는 그대로 둔다.
#                판단이 애매하면 넣지 않는다는 원칙도 그대로다.
#
#   2. [이단 배제 — 절대 조건] 한국교회 주요 교단(예장 통합·합동 등)이
#      이단·사이비 또는 참여 금지로 규정한 단체 및 그 연계 채널은
#      어떤 경우에도 넣지 않는다.
#      - 판단이 애매하면 넣지 않는다. 누락의 비용(콘텐츠 몇 개 부족)보다
#        유입의 비용(서비스 신뢰 전체 붕괴)이 압도적으로 크다.
#      - 위장 채널을 전제한다: 채널명·제목이 아니라 운영 주체를 확인한다.
#        기준 1의 "정체 확인"이 통과 안 되면 이 검사까지 갈 것도 없이 탈락이다.
#      - 기준 1c와 같은 내용을 가리킨다. 1c는 정체 확인 절차의 마지막 단계이고,
#        여기 2번은 그것이 **절대 조건**임을 다시 못박는 자리다.
#        기준 1이 완화돼도 이 조건은 완화되지 않는다.
#
#   3. [콘텐츠 성격] 설교·성경 강해·묵상·찬양(CCM) 중심.
#      다음이 주력인 채널은 교리가 건전해도 제외한다:
#      - 정치·시사 논평 (서비스 톤 훼손)
#      - 이단 반박·비판 콘텐츠 (목적은 위로·묵상이다)
#      - 극단적 신유 집회·안수 중심 콘텐츠
#      - 번영신학 색채가 강한 콘텐츠
#
#   4. [자동 점검] 다음 셋을 본다. 자동 점검 통과는 승인이 아니라
#      "실격 사유 없음"이다. 썸네일은 자동 점검이 보지 못한다 — 사람이 확인한다.
#
#      - 최근 업로드 지속성 (90일 내 업로드가 없으면 실격)
#      - **쇼츠를 제외한 최근 업로드 건수** (표본 10건 중 2건 미만이면 실격)
#      - channel_blocklist 등재 여부
#
#      쇼츠 **비율**은 참고 지표이지 실격 기준이 아니다.
#
#      ---------------------------------------------------------------
#      [기준 4 개정 기록 — 2026-08-18. 쇼츠 비율 → 쇼츠 제외 건수]
#
#      개정 전에는 "쇼츠 비중 50% 이상"을 실격 사유로 삼았다(FYM 승계).
#      2차 발굴에서 CTS기독교TV(80%)·CGN(50%)·CBSJOY(60%)·ANOINTING(80%) 등
#      **PYM이 가장 원하는 기관형 채널이 콘텐츠 문제 없이 실격**됐다.
#
#      원인은 FYM 기준을 맥락 없이 가져온 것이다:
#        FYM  검색으로 영상을 모은다 → 채널 단위 쇼츠 비중이 품질 신호였다
#        PYM  화이트리스트 채널의 업로드를 순회하고 **영상 단위로 길이 필터**를
#             건다. 쇼츠는 배치에서 개별로 걸러지므로 채널을 탈락시킬 이유가 약하다
#
#      게다가 배치는 채널당 1~2페이지(50~100건)를 순회하는데(PLAN.md 6절)
#      검토 시트는 최근 10건만 본다. "최근 10건 중 8건이 쇼츠"여도 배치가
#      실제로 가져오는 50건 중에는 긴 영상이 10건쯤 된다.
#      **10건 표본의 비율로 채널을 탈락시키는 것은 표본 창이 좁아 생긴 오판이었다.**
#
#      그래서 "쇼츠를 뺀 영상이 실제로 몇 건 있는가"로 바꿨다.
#      쇼츠만 올리는 채널은 이 기준에서 자연히 걸린다(0~1건).
#
#      [임계값 2를 고른 근거 — 2차 30건 실측]
#        1건 미만  CBSTV올포원(0건)만 탈락. 90% 쇼츠 채널이 통과해 느슨하다
#        2건 미만  + YERAM WORSHIP(1건). 표본 10건에서 1건은 통계적으로
#                  불안정하다(실제로 0일 수도 있었다는 뜻)
#        3건 미만  CTS·극동방송·ANOINTING(각 2건)까지 탈락 — 회복시키려던
#                  대상이 다시 걸려 개정 목적에 반한다
#      표본이 10건뿐이라 정밀도에 한계가 있음을 전제한 값이다.
#      (scripts/suggest_channels.py의 MIN_NON_SHORT_VIDEOS)
#
#      [FYM 승계 항목 중 빠진 것] "blocklist 통과율"은 PYM에 제목 blocklist
#      사전이 없어 자동 점검에서 뺐다. 대신 성격 신호어 집계를 참고 지표로
#      보여준다 — 차단이 아니라 표시다(기준 3 판단 재료).
#
# ---------------------------------------------------------------------
# 필수 필드 (하나라도 비면 배치가 실패한다 — FYM 형식 승계 + PYM 확장)
#
#   channel_id            "UC"로 시작하는 24자 채널 ID (핸들·URL 불가)
#   channel_name          사람이 알아볼 이름
#   affiliation           소속 — 교단명 / 교회명(교단) / "초교파(법인명)"
#   affiliation_verified  정체를 무엇으로 확인했는지 (예: "교회 홈페이지 + 총회 주소록")
#                         ※ PYM 신규 필드. 승인 기준 1·2를 통과한 근거가 여기 남는다
#   content_type          주력 콘텐츠 — sermon / worship / devotion / mixed
#                         ※ 배치가 주제 태깅 통계를 content_type별로 리포트한다
#   added_at              최초 추가일 (YYYY-MM-DD)
#   last_reviewed_at      마지막 사람 검토일 — 120일 경과 시 재검토 Issue 자동 생성
#   reviewed_by           검토자
#   note                  왜 이 채널인가
#
# 선택 필드
#   crisis_eligible       true인 채널만 위기 풀 수집 대상이 된다 (기본 false)
#                         ※ 위기 풀은 일반보다 좁다 — 정신건강 전문 사역·
#                           상담 사역 채널 중심으로만 true를 준다 (PLAN 7절)
#
# ---------------------------------------------------------------------
# 배치가 이 파일을 쓰는 방식 (FYM 승계)
#   channels.list → uploads 재생목록 ID (50채널당 1 unit)
#   playlistItems.list → 채널별 최근 업로드 (페이지당 1 unit)
#   화이트리스트는 필터 면제권이 아니다 — 수집 영상도 blocklist·길이 필터를
#   전부 통과해야 한다. (길이는 하한만: 쇼츠 배제, 상한 없음 — 설교 30분+ 정상)
#
# ---------------------------------------------------------------------
# 목표 규모: 20~30개로 시작, 40~50개까지 확장
#   15개 미만이면 allowlist_undersized 경보 (FYM 승계)
#
# 현재 등록: 15개 (2026-08-18 승인) — 하한선과 같다. 한 건이라도 빠지면 경보가 뜬다.
#   교회 5 (오륜·꿈의·낮은담·우리들·베이직) + 초교파 방송·선교 미디어 10
#   승인 근거 시트: channel_criterion_c.20260818.md
#   제외 1건: 연세중앙교회 — 기준 1c (channel_reviewed_out.yaml)
#
# [초기 후보 풀 — 검토 대상이지 승인이 아니다]
#   아래는 발굴 시작점일 뿐, 개별 채널은 반드시 검토 시트(자동 점검 +
#   사람 확인)를 거쳐 위 필드를 채워서만 등록한다.
#
#   초교파 방송      CTS기독교TV, CBS(성서학당·새롭게하소서 등 계열 채널 포함),
#                    CGNTV, 극동방송, C채널
